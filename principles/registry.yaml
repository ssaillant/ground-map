# ---------------------------------------------------------------------------
# How to read this file
# ---------------------------------------------------------------------------
# Every source quotation carries a `check` value:
#   published-page : read in the published version; the page is the journal
#                    page shown in the running header.
#   manuscript     : read verbatim in an accepted manuscript or repository
#                    copy; journal pagination NOT verified. `locator` gives a
#                    section (or the manuscript's own page, labelled ms p.).
#   secondary      : this work was not read; the quote or locator is taken
#                    from a work that cites it (named in `via`).
#   unverified     : no text read. No quotation is given, only a paraphrase,
#                    which must not be cited until checked.
# All quotations were obtained by automated text extraction of PDFs (formula
# rendering can be lossy); each must be re-checked against the PDF before
# publication.
#
# `statement` is the formal statement to be encoded in Isabelle/HOL over the
# fixed signature below; free variables are universally quantified. `readings` lists every place a choice between
# readings was made: `chosen` is what the statement encodes, `alternatives`
# what it does not, and `why` the reason. Lines marked INFERENCE are mine,
# not the source's.
#
# Lattice (0.3.0, D5): every entry is a standalone statement. Selecting an
# entry asserts that statement and nothing else; it does not include the
# lower-ranked entries of its family. A package is any set of entries, with
# the core clause FACT (and LAM.T, LAM.ENV when an entry mentions lam or den).
# `rank` and `order` are display labels. The order on entries is the set of
# implications proved in isabelle/Order.thy and listed in the section
# `implications`, which also says which rank orders are not implications.
# Until 0.2.1 this paragraph said that choosing an entry of a chain includes
# every weaker entry; isabelle/Principles.thy never implemented that (audit
# finding A2), so results reported under 0.2.x must be read entry by entry.

# ---------------------------------------------------------------------------
# Fixed signature (not switchable)
# ---------------------------------------------------------------------------
signature:
  isabelle_theory: isabelle/Signature.thy (the definitions below are checked there)
  isabelle: |
    typedecl prop          (* propositions: a base type, never bool; prp in Isabelle *)
    typedecl pfun          (* propositional functions *)
    datatype fm = Var nat | Cst nat | Neg fm | Conj fm fm | Disj fm fm | Tr fm
                | Ex nat fm | All nat fm | BigC nat fm     (* formula layer, D3 *)
    consts
      T       :: "prop ⇒ bool"             (* truth (actual truth), metalevel predicate *)
      atom    :: "nat ⇒ prop"              (* atomic propositions named by Cst *)
      neg     :: "prop ⇒ prop"
      conj    :: "prop ⇒ prop ⇒ prop"
      disj    :: "prop ⇒ prop ⇒ prop"
      tr      :: "prop ⇒ prop"             (* the proposition that p is true *)
      app     :: "pfun ⇒ prop ⇒ prop"      (* value of a propositional function *)
      ex      :: "pfun ⇒ prop"             (* ∃p. f p; exq in Isabelle *)
      all     :: "pfun ⇒ prop"             (* ∀p. f p; allq in Isabelle *)
      bigconj :: "pfun ⇒ prop"             (* conjunction of the satisfiers of f *)
      tot     :: "pfun ⇒ prop"             (* totality fact for f; used only by ALL.TOT *)
      lam     :: "nat ⇒ fm ⇒ (nat ⇒ prop) ⇒ pfun"  (* λx.φ under an environment *)
      adm     :: "pfun ⇒ bool"             (* admissible functions; fixed by COMP *)
      G       :: "prop set ⇒ prop ⇒ bool"  (* strict full mediate factive ground *)
    primrec den :: "(nat ⇒ prop) ⇒ fm ⇒ prop"   (* denotation *)
      den v (Var n) = v n          den v (Cst n) = atom n
      den v (Neg a) = neg (den v a)          den v (Tr a) = tr (den v a)
      den v (Conj a b) = conj (den v a) (den v b)    (* Disj likewise *)
      den v (Ex x a) = ex (lam x a v)    den v (All x a) = all (lam x a v)
      den v (BigC x a) = bigconj (lam x a v)
    primrec fv, subf             (* free variables; subformulas *)
    primrec lvl :: "fm ⇒ nat"     (* quantifier depth: Ex/All/BigC add 1, connectives take max *)
    primrec tfree :: "fm ⇒ bool"  (* no Tr subformula *)
    definition inst f ≡ range (app f)
    definition sat f ≡ {p. T (app f p)}
    definition PG p q ≡ ∃Γ. p ∈ Γ ∧ G Γ q                       (* partial ground *)
    definition IG Γ q ≡ G Γ q ∧ (∀Δ. G Δ q ⟶ (∀p∈Γ - Δ. ∃Δ'⊆Δ. G Δ' p))   (* D1 *)
    definition IPG p q ≡ ∃Γ. p ∈ Γ ∧ IG Γ q                     (* immediate partial *)
    definition vacW A Γ c ≡ ∃Φ v z.                               (* D2 *)
        Γ = (λφ. den (v(z:=A)) φ) ` Φ
      ∧ (∃φ∈Φ. z ∈ fv φ)
      ∧ (∀φ∈Φ. ∀ψ∈subf φ. z ∉ fv ψ ⟶ den (v(z:=A)) ψ ≠ A)
      ∧ (∀B. (∀φ∈Φ. T (den (v(z:=B)) φ)) ⟶ G ((λφ. den (v(z:=B)) φ) ` Φ) c)
  core_axioms:
    # Assumed as hypotheses of every theorem, never as Isabelle axioms.
    FACT: |
      G Γ p ⟹ T p ∧ (∀q∈Γ. T q)
    LAM.T: |
      T (app (lam x a v) p) ⟷ T (den (v(x:=p)) a)
    LAM.ENV: |
      (∀y∈fv a - {x}. v y = w y) ⟶ lam x a v = lam x a w
  notes:
    - Factivity is part of the primitive (design decision), so it is core, not a
      family. Correia's logical grounding is explicitly non-factive (see the
      bibliography entry correia2014); his rules are imported here only in their
      factive form.
    - Grounds are HOL sets, so they may be empty or infinite unless EMPTY or FIN
      says otherwise. No constant maps `prop set` to `prop`; every map from a
      collection of propositions to a proposition goes through `pfun`, so HOL's
      built-in set comprehension cannot by itself manufacture a Cantor or
      Russell argument. Which propositional functions exist is governed by COMP.
    - >-
        Fine's and Krämer's puzzles quantify first-order over propositions with a
        truth predicate, or into sentence position. With a base type `prop` both
        become quantification over `prop` via `ex`/`all`. Consequence: Krämer's
        (PE) "∃y y = <∃x x is true>" holds trivially (every term of type prop
        denotes), so the Finean counterpart cannot be blocked by denying (PE).
        The same holds for Fine's Propositional Existence, "∃p(p = |A|)"
        (fine2010 p. 100). Fine's first option, predicativism, rejects exactly
        that principle (pp. 104, 109), so v1 cannot represent it; the
        comprehension family COMP restricts propositional functions, not
        propositions. See the readings on EX.FULL.
    - "`tot` is inert unless ALL.TOT is selected."
    - >-
        Convention (D3). A free variable f of type pfun in a family statement
        ranges over admissible functions: read `P f` as `adm f ⟶ P f`. COMP fixes
        adm. CL.QUANT is the exception and holds for every f.
    - >-
        Formula layer (D3, revised by D5 in 0.3.0). Formulas are syntax for
        describing propositions and functions; they are not the relata of ground.
        A restriction stated on a formula (lvl a = 0, tfree a) is read on closed
        formulas only (fv a = {}). The restricted principle applies to the
        propositions denoted by closed formulas with the property, as Krämer's α
        and Korbmacher's Sent range over sentences. Given LAM.ENV, the denotation
        of a closed formula does not depend on the environment (den_closed in
        isabelle/Order.thy). Until 0.2.1 a restriction applied to a proposition
        whenever some formula with the property denoted it under some
        environment. Var 0 has level 0, is truth-free and denotes any
        proposition, so every proposition qualified and the four restricted
        entries were equivalent to the unrestricted ones (finding F5).
        Identities between propositions (ID family) can still make a restricted
        principle apply to a proposition that also has an unrestricted
        presentation. That is the intended reading of "the proposition expressed
        by a quantifier-free sentence"; it means a restricted entry restricts
        less in a package with coarse-grained identities.
    - >-
        Woods's vacuity (D2). Φ presents the grounds with the variable z marking
        the occurrences of A. The third clause forces every occurrence to be marked
        (no z-free subformula denotes A), which encodes Woods's uniform
        substitution, embedded occurrences included. Limits - "anywhere" is read in
        the one model only (Woods fn. 27 asks for a modal test, so IRR.W is weaker
        than his principle); a z-containing subformula may still denote A through
        an identity (e.g. ¬¬A = A), which the clause does not exclude.

auxiliary_bundles: {}
  # LEVELS and TRUTHFREE (v0.1.x) were removed by D3: levels and truth-freeness
  # are now the functions lvl and tfree on formulas.

# ---------------------------------------------------------------------------
# Implications between entries (D5). Mirrors isabelle/Order.thy.
# ---------------------------------------------------------------------------
implications:
  note: >-
    The only order on entries. A result may be carried from one package to
    another only along these. The search propagates along the unconditional
    implications whose weaker side does not mention lam or den
    (scripts/driver.py, IMPL); it does not use ASYM.P to IRR.F, which is proved
    and was never added to its table.
  unconditional:
    - {from: IRR.F, to: IRR.W, theorem: IRR_F_W}
    - {from: IRR.F, to: IRR.MEM, theorem: IRR_F_MEM}
    - {from: ASYM.P, to: ASYM.ANTI, theorem: ASYM_P_ANTI}
    - {from: ASYM.P, to: IRR.F, theorem: ASYM_P_IRR_F}
    - {from: TRANS.CUT, to: TRANS.P, theorem: TRANS_CUT_P}
    - {from: AMALG.INF, to: AMALG.FIN, theorem: AMALG_INF_FIN}
    - {from: TS.ID, to: TS.FULL, theorem: TS_ID_FULL}
    - {from: TS.FULL, to: TS.TYPED, theorem: TS_FULL_TYPED}
    - {from: TR.FULL, to: TR.TYPED, theorem: TR_FULL_TYPED}
    - {from: TR.FULL, to: TR.PART, theorem: TR_FULL_PART}
    - {from: EX.FULL, to: EX.LEV, theorem: EX_FULL_LEV}
    - {from: EX.FULL, to: EX.PRED, theorem: EX_FULL_PRED}
    - {from: EX.FULL, to: EX.PART, theorem: EX_FULL_PART}
    - {from: DISJ.ONE, to: DISJ.PART, theorem: DISJ_ONE_PART}
    - {from: ALL.INST, to: ALL.PART, theorem: ALL_INST_PART}
    - {from: ALL.TOT, to: ALL.PART, theorem: ALL_TOT_PART}
    - {from: FIN.B3, to: FIN.FIN, theorem: FIN_B3_FIN}
  comprehension_to_witnesses:
    # D9 (0.3.2). Each comprehension level implies each witness entry. Not used
    # by the search for propagation (the weaker side mentions lam).
    - {from: C1, to: [W.ID, W.TR, W.EM, W.TEM], theorem: C1_W}
    - {from: C2, to: [W.ID, W.TR, W.EM, W.TEM], theorem: 'C2_W (for every level bound; the four bodies have level 0)'}
    - {from: C3d, to: [W.ID, W.TR, W.EM, W.TEM], theorem: C3d_W}
    - {from: C3s, to: [W.ID, W.TR, W.EM, W.TEM], theorem: C3s_W}
  conditional:
    - {from: EX.LEV, to: EX.PRED, given: 'every admissible function is a lam-term (so under C1, C2 or C3d; not under C3s)', theorem: 'EX_LEV_PRED with C1_lamb, C2_lamb, C3d_lamb'}
    - {from: DISJ.ONE, to: DISJ.WEAK, given: CL.PROP, theorem: DISJ_ONE_WEAK}
    - {from: DISJ.PART, to: DISJ.WEAK, given: CL.PROP, theorem: DISJ_PART_WEAK}
    - {from: EX.FULL, to: EX.WEAK, given: CL.QUANT, theorem: EX_FULL_WEAK}
    - {from: EX.PART, to: EX.WEAK, given: CL.QUANT, theorem: EX_PART_WEAK}
    - {from: DISJ.ONE, to: DISJ.BOTH, given: AMALG.FIN, theorem: AMALG_DISJ_ONE_BOTH (isabelle/Audit_Checks.thy)}
  equivalences:
    - {left: EMPTY.NONE, right: not EMPTY.SOME, theorem: EMPTY_excl}
  selection_rules:
    # Rules of the search, not theorems: at most one entry from each group.
    - {group: [C1, C2, C3d, C3s], why: each fixes adm exactly}
    - {group: [EMPTY.NONE, EMPTY.SOME], why: contradictory (EMPTY_excl)}
    - {group: [BETA.ID, BETA.GROUND], why: 'contradictory as soon as some proposition is true, by the distinctness clause of BETA.GROUND (BETA_excl; with CL.QUANT outright, BETA_excl_CL_QUANT). An inference until 0.3.0, a theorem of Order.thy since 0.3.1'}
  rank_order_without_implication:
    # Audit finding A2. The higher-ranked entry does not contain the lower one.
    # 0.3.1 - for each pair a model in which the higher-ranked entry holds and
    # the lower-ranked one fails is recorded under `separations` (IMM pair) or
    # `separations_by_search` (the other seven). Until 0.3.0 the
    # non-implications were inferences.
    - [CL.QUANT, CL.PROP]
    - [ID.DN, ID.AC]
    - [CONJ.INF, CONJ.BIN]
    - [CONJ.GRAIN, CONJ.BIN]
    - [DISJ.BOTH, DISJ.ONE]
    - [NEG.DM, NEG.DN]
    - [TR.NEG, TR.FULL]
    - [IMM.FRITZ7, IMM.CONJ]
  not_comparable:
    # 0.3.1 - listed under rank_order_without_implication until 0.3.0. Each
    # COMP entry says exactly which functions are admissible, and the search
    # takes at most one of them (selection_rules), so no result is ever carried
    # from one to another. INFERENCE - neither entry of a pair implies the
    # other in general (C3s admits every function, C1 four). Not tested by a
    # model - these are formula-layer entries, where Nitpick's models are not
    # genuine, and no model was built by hand for them.
    - [C2, C1]
    - [C3d, C2]
    - [C3s, C3d]
  separations:
    # Non-implications established by a model built in Isabelle.
    - holds: [EX.PRED, EX.LEV, TS.TYPED, TR.TYPED]
      fails: [EX.FULL, TS.FULL, TR.FULL]
      model: MG
      theorem: MG_package, MG_not_EX_FULL, MG_not_TS_FULL, MG_not_TR_FULL (isabelle/Restricted_Models.thy)
      note: MG also fails EX.PART, since it satisfies C1, BETA.ID, CL.QUANT and IRR.F and those refute EX.PART (kramer_package). So neither EX.PRED nor EX.LEV implies EX.PART.
    - holds: [EX.PART]
      fails: [EX.PRED, EX.LEV, EX.FULL]
      model: MH
      theorem: MH_package (isabelle/Separation_Models.thy)
      note: Added 0.3.1. MH has MG's propositions and functions; any two distinct truths together fully ground any truth and no single truth grounds anything, so every true instance is a partial ground and none is a full ground. With MG, EX.PART and the two restricted entries are independent in both directions. MH is a separation only - every truth partially grounds itself there.
    - holds: [IMM.FRITZ7]
      fails: [IMM.CONJ]
      model: ME
      theorem: ME_separates_IMM (isabelle/Separation_Models.thy; ME is the model of finding F2)
      note: Added 0.3.1. A weak separation - ME is not classical and its arbitrary conjunction is a false constant, so it does not bear on whether IMM.FRITZ7 implies IMM.CONJ given CL.PROP and CL.QUANT. That question is settled by MF (next entry).
    - holds: [IMM.FRITZ7, CL.PROP, CL.QUANT, TS.FULL]
      fails: [IMM.CONJ]
      model: MF
      theorem: MF_separates_IMM, MF_not_IMM_CONJ (isabelle/Separation_Models.thy; MF is in isabelle/Model_Certificates.thy)
      note: Added 0.5.0. The classical separation. MF has one propositional function, so its arbitrary conjunction of that function's instances is the quantified proposition Qu 2, which MF leaves ungrounded although it is true; IMM.CONJ requires each true instance to partially ground it immediately. So IMM.FRITZ7 does not imply IMM.CONJ given CL.PROP and CL.QUANT. Whether it does given C3s as well is not settled here (MF fails C3s).
    - holds: [C1, BETA.ID, CL.QUANT, ALL.INST, DISJ.ONE, TRANS.P, IRR.F, ASYM.P]
      fails: [CL.PROP]
      model: MS
      theorem: MS_package (isabelle/Separation_Models.thy)
      note: Added 0.3.1. Finding F7.
    - holds: [W.ID, W.TR, W.TEM]
      fails: [W.EM, TR.PART]
      model: MT
      theorem: MT_W, MT_package (isabelle/Separation_Models.thy)
      note: Added 0.3.2. Finding F9.
    - holds: [W.TR, W.TEM]
      fails: [W.ID, W.EM, TR.PART]
      model: MU
      theorem: MU_package (isabelle/Separation_Models.thy)
      note: Added 0.3.2. Finding F9. Together with MT - no witness entry among W.ID, W.TR, W.TEM implies W.EM, and neither W.TR nor W.TEM implies W.ID. The other non-implications among the four are not established by a model.
  separations_by_search:
    # Added 0.3.1. Non-implications established by a finite model that Nitpick
    # found for FACT, the first entry, N1 and the negation of the second
    # (scripts/separations.py). Each model is stored in results/separations.jsonl
    # and re-checked by scripts/verify_models.py's evaluator whenever
    # docs/results.md is generated. None of these entries mentions lam or den,
    # so the models are genuine. Each is a non-implication between the two
    # entries alone, not under further principles.
    - [CL.QUANT, CL.PROP]
    - [ID.DN, ID.AC]
    - [CONJ.INF, CONJ.BIN]
    - [CONJ.GRAIN, CONJ.BIN]
    - [DISJ.BOTH, DISJ.ONE]
    - [NEG.DM, NEG.DN]
    - [TR.NEG, TR.FULL]

# ---------------------------------------------------------------------------
# Families
# ---------------------------------------------------------------------------
families:

  # 1 ------------------------------------------------------------------------
  - id: IRR
    name: Irreflexivity
    order: chain
    entries:
      - id: IRR.W
        rank: 1
        name: Substantive irreflexivity (Woods)
        statement: |
          G Γ c ∧ c ∈ Γ ⟶ vacW c Γ c        (* vacW: signature, D2 *)
        sources:
          - work: woods2018
            locator: p. 641
            check: published-page
            quote: "...,A < A unless A occurs vacuously in ...,A<A"
          - work: woods2018
            locator: p. 640
            check: published-page
            quote: "A proposition A occurs vacuously in a grounding fact γ when A occurs in the grounds of γ"
            note: The rest of the definition (paraphrase of the extraction) says that
              substituting any B for A in the grounds yields a grounding fact
              wherever the modified grounds hold; substitution is in the grounds only
              (pp. 640–641).
          - work: woods2018
            locator: p. 644
            check: published-page
            quote: "...A... < A unless A occurs vacuously in ...A, ... < A for all ... such that ...A, ... < A"
            note: PARTIAL SUBSTANTIVE IRREFLEXIVITY; partial-ground symbols lost in extraction.
        readings:
          - point: what "occurs in the grounds" means
            chosen: uniform substitution of every occurrence, embedded ones included, on the formula layer (D2, 2026-11-26)
            alternatives: ['membership, a ∈ Γ - the v0.1.x reading, kept as the control IRR.MEM', 'constituent occurrence over prop without formulas - not definable on a base type']
            why: woods2018 p. 640 (uniform substitution "in the grounds"; embedded occurrences count), fn. 35 p. 644 (sentential and argument position). Lovett 2020 p. 2551 reads Woods the same way. Fine's "A in one capacity ... a ground for A in another capacity" (fine2010 p. 104) is the idea Woods develops (Woods p. 638).
          - point: 'Woods p. 640 - "for any proposition B, γ A/B holds anywhere the (modified) grounds of γ A/B are true"'
            chosen: for every B whatsoever, provided the modified grounds are true in the model
            alternatives: ['a modal test over worlds (Woods fn. 27)']
            why: v1 has no modality. The one-world test is easier to pass, so IRR.W is weaker than Woods's principle; recorded on every IRR.W result.
          - point: which presentation of the grounds
            chosen: some presentation Φ in which every occurrence of A is marked
            alternatives: ['every such presentation']
            why: INFERENCE - Woods quantifies over substituends, not presentations; with every occurrence marked, different presentations differ only in how the other grounds are written. Flagged for step 3 validation.
          - point: full versus partial version
            chosen: full-ground version (p. 641); the partial version (p. 644) is implied once vac is checked for every Γ, which this statement does
            alternatives: ['separate entry for p. 644']
            why: with set-valued full ground and PG defined from it, the two coincide on this encoding (INFERENCE, to be proved in step 2).
      - id: IRR.F
        rank: 2
        name: Irreflexivity (no proposition partially grounds itself)
        statement: |
          G Γ c ⟶ c ∉ Γ          (* equivalently ¬ PG c c, by definition of PG *)
        sources:
          - work: woods2018
            locator: p. 632
            check: published-page
            quote: "...,A < A"
            note: Stated as IRREFLEXIVITY (a fact never grounds itself); the negation sign did not survive extraction.
          - work: kramer2013
            locator: introduction, first paragraph
            check: manuscript
            quote: "grounding is irreflexive, i.e. that nothing grounds itself"
          - work: korbmacher2018a
            locator: Def. 2, axiom G1
            check: manuscript
            quote: "G1 ∀x¬(x ◁ x)"
          - work: correia2014
            locator: Prop. 1.2(3), ms p. 4–5
            check: manuscript
            quote: "Not: Γ,φ Λ φ."
            note: Correia's Generalised Irreflexivity, for non-factive logical grounding.
          - work: fine2012b
            locator: p. 5, rule Non-Circularity(≺)
            check: published-page
            quote: "Non-Circularity(≺): A ≺ A / ⊥"
            note: ADDED 0.3.0 (audit). Read from the page image. Premise before the slash, conclusion after. Fine's ≺ is strict partial ground.
          - work: fine2010
            locator: p. 100, Irreflexivity
            check: published-page
            quote: "A ≺ A/⊥"
            note: >-
              ADDED 0.3.0 (audit). Fine's ≺ in this paper is partial ground, "A ≺ B (read: A helps ground B)" (p. 99).
        readings:
          - point: full versus partial irreflexivity
            chosen: one entry; with PG defined as membership in a full ground they are the same principle
            alternatives: []
            why: definitional (INFERENCE).
      - id: IRR.MEM
        rank: 1
        standalone: true
        control: true
        name: Membership irreflexivity (control, not a source principle)
        statement: |
          vacM Γ a c ≡ a ∈ Γ ∧ (∀b. T b ⟶ G (insert b (Γ - {a})) c)
          G Γ c ∧ c ∈ Γ ⟶ vacM Γ c c
        sources: []
        readings:
          - point: status
            chosen: control for IRR.W (D2); replaces only the bare member and leaves embedded occurrences
            alternatives: []
            why: it is not Woods's principle (woods2018 pp. 640–641). Implied by IRR.F, incomparable with IRR.W (INFERENCE); a package may select IRR.MEM in place of IRR.W, never both.

  # 2 ------------------------------------------------------------------------
  - id: ASYM
    name: Asymmetry of partial ground
    order: chain
    entries:
      - id: ASYM.ANTI
        rank: 1
        name: Antisymmetry
        statement: |
          PG p q ∧ PG q p ⟶ p = q
        sources:
          - work: woods2018
            locator: p. 632, fn. 4
            check: published-page
            quote: null
            note: Paraphrase of extraction - under substantive irreflexivity, ASYMMETRY would have to be weakened to ANTISYMMETRY.
        readings:
          - point: whether Woods states antisymmetry formally
            chosen: textbook antisymmetry
            alternatives: ['a vacuity-qualified asymmetry parallel to IRR.W']
            why: the footnote names the principle without a formal statement in the extracted text.
      - id: ASYM.P
        rank: 2
        name: Asymmetry
        statement: |
          PG p q ⟶ ¬ PG q p
        sources:
          - work: kramer2013
            locator: introduction, after (F3)/(F4)
            check: manuscript
            quote: null
            note: named "the principle that grounding is asymmetric"; Krämer's Finean counterpart (F3)/(F4) violates it directly, without transitivity.
        readings:
          - point: why a separate family
            chosen: kept separate from IRR because without TRANS asymmetry is not derivable from irreflexivity, and the Finean counterpart needs only ASYM
            alternatives: ['merge into IRR']
            why: lets the map show that Fine-style circles need either ASYM or IRR+TRANS.

  # 3 ------------------------------------------------------------------------
  - id: TRANS
    name: Transitivity and Cut
    order: chain
    entries:
      - id: TRANS.P
        rank: 1
        name: Transitivity of partial ground
        statement: |
          PG p q ∧ PG q r ⟶ PG p r
        sources:
          - work: kramer2013
            locator: section on the Finean counterpart
            check: manuscript
            quote: "If p < q and q < r then p < r"
            note: called "the Transitivity of Grounding" (TG).
          - work: korbmacher2018b
            locator: Def. 1, axiom G2
            check: manuscript
            quote: "∀x∀y∀z(x ◁ y ∧ y ◁ z → x ◁ z)"
          - work: fine2010
            locator: p. 100, Transitivity
            check: published-page
            quote: "A ≺ B, B ≺ C/A ≺ C"
            note: ADDED 0.3.0 (audit). Partial ground (p. 99).
          - work: fine2012b
            locator: p. 5, rule Transitivity(≼/≺)
            check: published-page
            quote: "A ≼ B B ≺ C / A ≺ C"
            note: ADDED 0.3.0 (audit). Read from the page image. Fine's primitive transitivity rules are (≼/≼), (≼/≺) and (≺/≼); each has a weak partial premise. There is no primitive rule with two strict premises. INFERENCE - the strict rule this entry states follows from (≼/≺) by Subsumption(≺/≼).
        readings:
          - point: which notion of ground the sources use
            chosen: transitivity of PG
            alternatives: ['transitivity of single-premise full ground only']
            why: PG transitivity is what the puzzles use. CORRECTED 0.3.0 (audit) - this note said Krämer leaves full or partial open. His "<" is partial ground (his fn. 4, read in the fetched text), as are Korbmacher's ◁ and Fine 2010's ≺; so the sources state exactly this entry.
      - id: TRANS.CUT
        rank: 2
        name: Cut for strict full ground (mediacy)
        statement: |
          G Γ q ∧ Δ ⊆ Γ ∧ (∀p∈Δ. G (H p) p) ⟶ G ((Γ - Δ) ∪ (⋃p∈Δ. H p)) q
        sources:
          - work: fine2012b
            locator: p. 5, rule Cut(≤/≤)
            check: published-page
            quote: "Cut(≤/≤): Δ1 ≤ A1 Δ2 ≤ A2 ... A1, A2, ... ≤ C / Δ1, Δ2, ... ≤ C"
            note: Premises above the slash, conclusion below. CORRECTED 2026-11-27 (audit) against the page image - every sequent in the rule is weak full ground; the earlier quote had "<" in the label, the major premise and the conclusion, an artefact of the PDF's OCR text layer. The strict-only statement above is therefore not an instance of Fine's rule. INFERENCE (audit) - it is derivable in PLG - Subsumption(</≤), Identity(≤) and Cut(≤/≤) give the new set as a weak full ground of C; each of its members is a strict partial ground of C by Subsumption(</≺) and Transitivity(≺/≼); Reverse Subsumption(≤/≺) then gives the strict full sequent. Fine derives Amalgamation(<) the same way (p. 7).
          - work: correia2014
            locator: Prop. 1.2(4), ms p. 4–5
            check: manuscript
            quote: "If Γ,φ Λ ψ, φ ∉ Γ and Δ Λ φ, then Γ,Δ Λ ψ."
            note: Correia's restricted Cut; he notes unrestricted Cut fails for his (tree-based, non-mediate) notion.
        readings:
          - point: partial replacement (Δ ⊆ Γ) versus replacing every member
            chosen: partial replacement, which implies TRANS.P
            alternatives: ['replace all members of Γ (does not imply TRANS.P)']
            why: '"mediate" ground should be closed under grounding any subset of a full ground.'
          - point: Fine's Cut mixes strict and weak ground
            chosen: strict-only form
            alternatives: ['none available in v1, weak ground out of scope']
            why: design decision. CORRECTED 2026-11-27 (audit) - Fine's rule is Cut(≤/≤), wholly weak (fine2012b p. 5, page image); the strict-only form is a derived rule of PLG (see the source note), not a special case of the primitive rule.
          - point: infinitely many replaced members
            chosen: allowed (Δ any set)
            alternatives: ['finite Δ only']
            why: FIN restricts this when selected.

  # 4 ------------------------------------------------------------------------
  - id: AMALG
    name: Amalgamation
    order: chain
    entries:
      - id: AMALG.FIN
        rank: 1
        name: Binary amalgamation
        statement: |
          G Γ p ∧ G Δ p ⟶ G (Γ ∪ Δ) p
        sources:
          - work: correia2014
            locator: remark F, ms p. 8
            check: manuscript
            quote: "Fine (2012a, 2012b) takes the concept of (strict) grounding to obey a principle he calls 'Amalgamation'."
          - work: fine2012b
            locator: p. 7, Amalgamation(<)
            check: published-page
            quote: "the weak or strict grounds for a given truth can be amalgamated, or combined, into a single ground."
            note: Derivable in PLG (p. 7); stated for arbitrarily many grounds "Δ1 < C Δ2 < C ... / Δ1, Δ2... < C".
          - work: fine2012a
            locator: p. 57 (CUP; ms p. 26)
            check: published-page
            quote: "In other words, the strict grounds for a given truth can be amalgamated, or combined, into a single ground."
            note: checked in the CUP volume supplied 2026-11-27; derived there from the rules as the Amalgamation Rule for strict ground.
          - work: fine2012a
            locator: p. 59 (CUP), fn. 16
            check: published-page
            quote: "I should note that, since writing the paper, I have had reservations about insisting upon the rule of Amalgamation and its various consequences."
            note: ADDED 0.3.0 (audit). Fine's later reservation; the entry is optional in the map, which fits it.
        readings:
          - point: whether Fine's Amalgamation applies to strict full ground or only to weak
            chosen: strict
            alternatives: []
            why: verified - fine2012b p. 7 states Amalgamation(<) for strict ground.
          - point: interaction with DISJ.ONE
            chosen: none built in
            alternatives: []
            why: INFERENCE - AMALG.FIN + DISJ.ONE yields G {p,q} (p∨q) for true p,q, i.e. DISJ.BOTH; Correia (remark F) gives exactly this as the reason strict logical grounding fails Amalgamation.
      - id: AMALG.INF
        rank: 2
        name: Infinitary amalgamation
        statement: |
          F ≠ {} ∧ (∀Γ∈F. G Γ p) ⟶ G (⋃F) p
        sources:
          - work: fine2012b
            locator: p. 7, Amalgamation(<)
            check: published-page
            quote: "Δ1 < C Δ2 < C ... / Δ1, Δ2... < C"
        readings:
          - point: arity
            chosen: arbitrary nonempty families
            alternatives: ['binary only']
            why: verified 2026-11-27 (audit) against the page image of fine2012b p. 7 - Amalgamation(<) is displayed for arbitrarily many grounds.

  # 5 ------------------------------------------------------------------------
  - id: CL
    name: Classical behaviour of truth
    order: chain
    entries:
      - id: CL.PROP
        rank: 1
        name: Classical truth for the connectives
        statement: |
          T (neg p) ⟷ ¬ T p
          T (conj p q) ⟷ T p ∧ T q
          T (disj p q) ⟷ T p ∨ T q
        sources: []
        readings:
          - point: source
            chosen: no single source; this is the classical background every cited paper assumes
            alternatives: ['split consistency (T(neg p) ⟶ ¬T p) from bivalence']
            why: kept as one entry to stay near the target size; split in v1.1 if the map shows bivalence alone matters (Krämer fn. 5 reports that Fine's Universal Argument "assumes that every proposition is either true or false") Checked against fine2010 - Fine's premise is Universal Middle, "true or not true" (p. 102), not bivalence; he notes it fails under intuitionism and the Kleene tables (p. 107).
      - id: CL.QUANT
        rank: 2
        name: Classical truth for quantifiers and infinitary conjunction
        statement: |
          T (ex f) ⟷ (∃a. T (app f a))
          T (all f) ⟷ (∀a. T (app f a))
          T (bigconj f) ⟷ (∀q∈sat f. T q)      (* sat f ≡ {p. T (app f p)} *)
        sources: []
        readings:
          - point: domain of the propositional quantifiers
            chosen: all of prop (unrestricted)
            alternatives: ['level-relative domains, as in a ramified hierarchy']
            why: >-
              Krämer's "hierarchy of sentential quantifiers" is modelled by restricting the grounding principle (EX.LEV), not the truth clause. Flagged: a ramified reading would also restrict this clause.
          - point: FLAGGED 0.3.0 (audit) - the bigconj clause supplies a truth
            chosen: kept as stated
            alternatives: ['require a nonempty satisfier set in the clause', 'move the bigconj clause to its own entry']
            why: >-
              CL.QUANT alone proves that some proposition is true (CL_QUANT_truth in
              isabelle/Order.thy). Either every satisfier of f is true, and then
              bigconj f is; or some satisfier p is untrue, and then app f p is true.
              So a package with CL.QUANT has a truth without CL.PROP, which is why
              Krämer's package is refuted outright although it lists no CL.PROP
              (finding F6). The sources get their truth elsewhere (Krämer - ∃p p is
              a theorem of logic). Whether this is the wanted source of truths is
              the reviewer's call.
          - point: FLAGGED 0.3.0 (audit) - relation to CL.PROP
            chosen: standalone; CL.QUANT does not include CL.PROP
            alternatives: ['cumulative (the 0.2.x header convention, never implemented)']
            why: D5. A package that wants classical connectives and quantifiers selects both.

  # 6 ------------------------------------------------------------------------
  - id: TS
    name: Truth schema and transparency for tr
    order: chain
    entries:
      - id: TS.TYPED
        rank: 1
        name: Typed truth schema
        statement: |
          tfree a ∧ fv a = {} ⟶ (T (tr (den v a)) ⟷ T (den v a))      (* D3, D5: closed formulas *)
        sources:
          - work: korbmacher2018b
            locator: Def. 1–2, the typed truth axioms
            check: manuscript
            quote: null
            note: >-
              CORRECTED 0.3.0 (audit). No verbatim quotation of the typed truth
              schema has been obtained; the text was read in fragments without page
              breaks. The statement is this registry's two-level reading of
              Korbmacher's typed truth axioms and must not be cited as a quotation.
              The sentence quoted here until 0.2.1 states the typing restriction,
              which this entry omits; it is now under the reading on T₃ below.
        readings:
          - point: which formulas the schema covers (D5)
            chosen: closed truth-free formulas (fv a = {}), that is, truth-free sentences
            alternatives: ['every truth-free formula under every environment - the 0.2.x statement, equivalent to TS.FULL because Var 0 is truth-free and denotes any proposition (finding F5)']
            why: Korbmacher's typed truth predicate applies to sentences of lower level. Separated from TS.FULL by the model MG (MG_package, isabelle/Restricted_Models.thy).
          - point: whether typed truth blocks Fine's universal argument (0.3.1)
            chosen: no claim is attached to this entry
            alternatives: ['the 0.2.x remark that typed truth blocks Fine-style circles (withdrawn in 0.3.0)']
            why: Under C1 it does not. Fine's universal package with TS.TYPED and TR.TYPED in place of TS.FULL and TR.PART is refuted (fine_universal_typed_refuted), because C1 also admits f_em and the sentence-position argument uses no truth entry. Where f_em is not admissible it does - the model MT satisfies Fine's universal package with TR.TYPED in place of TR.PART, and with TS.FULL kept, so it is the typing of TR and not of this entry that does the work (finding F8). That is a model, not a registry package - no COMP entry leaves out f_em.
          - point: hierarchy depth
            chosen: two levels only (truth-free sentences and one truth predicate)
            alternatives: ['levels up to α < ε0 as in Korbmacher']
            why: the puzzles need one step; a full hierarchy would need indexed tr.
          - point: Korbmacher's T₃ (only lower-level sentences are true_β)
            chosen: omitted, so that TS.FULL implies TS.TYPED (TS_FULL_TYPED)
            alternatives: ['add a clause that tr applied to a non-truth-free proposition is untrue, which contradicts TS.FULL']
            why: >-
              lattice shape; the T₃ clause is a mutation candidate (step 5). Source
              for the clause - korbmacher2018b sect. 3.2, prose, check manuscript,
              "for all 0 < β ≤ α, if Tr_β(⌜φ⌝), then Sent_<β(⌜φ⌝)." CORRECTED
              0.3.0 (audit) - the axiom T₃ itself is stated for 0 < β < α (from the
              fetched text; no page confirmed). WITHDRAWN 0.3.0 - the remark that
              "Fine-style circles are already blocked by TR.TYPED". Under 0.2.x it
              was false, since TR.TYPED was equivalent to TR.FULL (F5). What is
              established under 0.3.0 is narrower. The "something is true" package
              with EX.PRED, EX.LEV, TS.TYPED and TR.TYPED in place of the full
              entries has the model MG. Typing truth alone does not block a
              circle - Krämer's package and the sentence-position universal
              argument use no TS or TR entry (kramer_package,
              fine_universal_sp_package). No model has been built for Fine's
              universal package with the typed entries.
      - id: TS.FULL
        rank: 2
        name: Truth schema
        statement: |
          T (tr p) ⟷ T p
        sources:
          - work: kramer2013
            locator: section on the Finean counterpart
            check: manuscript
            quote: "If p & ∃x x=<p>, then <p> is true"
            note: Truth-Introduction (TI); the existence conjunct is automatic here (see signature notes).
          - work: fine2010
            locator: p. 100, Truth Introduction
            check: published-page
            quote: "p = |A|, A/T ( p)"
            note: ADDED 0.3.0 (audit). One direction only, like Krämer's (TI); the biconditional is this registry's (see the reading).
        readings:
          - point: TI is one direction
            chosen: biconditional
            alternatives: ['TS.UP - T p ⟶ T (tr p) only']
            why: the puzzles use only the upward direction; the biconditional is the classical default. Mutation test in step 5 will use TS.UP.
      - id: TS.ID
        rank: 3
        name: Transparency (tr p = p)
        statement: |
          tr p = p
        sources: []
        readings:
          - point: why include
            chosen: identity between propositions is a registry entry by design
            alternatives: []
            why: INFERENCE - with TR.FULL and IRR.F it is refuted at once (G {p} p); included as a pipeline sanity check and to mark the deflationist option.

  # 7 ------------------------------------------------------------------------
  - id: ID
    name: Identities between propositions (Boolean)
    order: chain
    entries:
      - id: ID.AC
        rank: 1
        name: Associativity, commutativity, idempotence
        statement: |
          conj p q = conj q p       disj p q = disj q p
          conj p (conj q r) = conj (conj p q) r
          disj p (disj q r) = disj (disj p q) r
          conj p p = p              disj p p = p
        sources:
          - work: correia2014
            locator: remark B, ms p. 6
            check: manuscript
            quote: "The notion of logical grounding intended to be characterised by STRICT GROUNDING is thus very fine-grained."
            note: Cited as the contrary view. Correia also notes (Correia 2010) he argues elsewhere for a more coarse-grained conception and that both are viable.
        readings:
          - point: ID.DN placed above ID.AC
            chosen: two standalone entries; ID.DN does not include ID.AC
            alternatives: ['a cumulative chain in which DN includes AC - what this note said until 0.2.1; never implemented']
            why: CORRECTED 0.3.0 (D5, audit finding A2). A result for ID.DN is a result about the double-negation identity alone. A package that wants both selects both.
          - point: idempotence
            chosen: included
            alternatives: ['AC without idempotence']
            why: INFERENCE - idempotence plus CONJ.BIN gives G {p} p for true p, refuting IRR.F; included so the map shows it. Split into its own rank if that result swamps the family.
      - id: ID.DN
        rank: 2
        name: Double negation identity
        statement: |
          neg (neg p) = p
        sources: []
        readings:
          - point: source
            chosen: none cited; standard coarse-grained view
            alternatives: []
            why: INFERENCE - refuted with NEG.DN and IRR.F; sanity check and coarse-grain marker.

  # 8 ------------------------------------------------------------------------
  - id: CONJ
    name: Conjunction (binary and infinitary)
    order: chain
    entries:
      - id: CONJ.BIN
        rank: 1
        name: Binary conjunction introduction
        statement: |
          T p ∧ T q ⟶ G {p, q} (conj p q)
        sources:
          - work: korbmacher2018a
            locator: Sect. 4.1
            check: manuscript
            quote: "∀x∀y(Tr(x)∧Tr(y) → x◁x∧·y ∧ y◁x∧·y)"
          - work: correia2014
            locator: rule (∧1), ms p. 3–4
            check: manuscript
            quote: null
            note: rule display garbled in extraction; reconstructed as φ, ψ ⊢ φ∧ψ.
          - work: fine2012a
            locator: p. 58 (CUP), rule ∧I
            check: published-page
            quote: "∧I. A, B < A ∧ B"
            note: ADDED 0.3.0 (audit). The direct source for the full-ground reading; Fine's < is strict full ground. Not stated with a truth premise; the factive reading is v1's.
        readings:
          - point: Korbmacher's principle is about partial ground
            chosen: full ground {p,q}
            alternatives: ['partial only - PG p (conj p q) ∧ PG q (conj p q)']
            why: full is the primitive; the partial reading follows from it.
      - id: CONJ.INF
        rank: 2
        name: Infinitary conjunction introduction
        statement: |
          sat f ≠ {} ∧ (∀q∈sat f. T q) ⟶ G (sat f) (bigconj f)
        sources:
          - work: fritz2022
            locator: p. 299 (abstract)
            check: published-page
            quote: "Current views of metaphysical ground suggest that a true conjunction is immediately grounded in its conjuncts, and only its conjuncts"
          - work: fritz2022
            locator: p. 306, sect. 2.3
            check: published-page
            quote: "(⋀≺) ∀̅pp∀p(p ≺ ⋀ pp ↔ p ε pp)"
            note: CORRECTED 2026-11-27 (audit) - the first quantifier carries an overbar, Fritz's restriction of the plural quantifier to truths (p. 306); the bar was lost in extraction. Fritz's ≺ is immediate partial ground and pp ranges over pluralities of truths; the conjuncts are the members of pp. Fritz calls this principle more controversial than his seven main principles (p. 308).
        readings:
          - point: immediate versus mediate
            chosen: mediate (the primitive)
            alternatives: ['immediate - out of scope in v1']
            why: design decision; flagged because Fritz's premise is about immediate ground.
          - point: conjuncts of an infinitary conjunction
            chosen: the propositions satisfying f (sat f), as with Fritz's pluralities
            alternatives: ['the values of f (inst f) - the v0.1.0 reading, withdrawn']
            why: fritz2022 p. 306. Comprehension for pluralities then runs through COMP, as Fritz's plural comprehension (p. 306) and its predicative restriction (p. 315) do.
          - point: nonempty conjunct set
            chosen: required
            alternatives: ['allow the empty conjunction (zero-grounded)']
            why: Fritz admits the empty plurality (p. 303); kept out so CONJ.INF does not interact with EMPTY by default.
      - id: CONJ.GRAIN
        rank: 3
        control: true
        name: Grain of true conjunctions (stipulated; control for IMM.CONJ since D1)
        statement: |
          T (conj p q) ∧ conj p q = conj p' q' ⟶ {p, q} = {p', q'}
          (∀q∈sat f. T q) ∧ (∀q∈sat g. T q) ∧ bigconj f = bigconj g ⟶ sat f = sat g
        sources:
          - work: fritz2022
            locator: p. 306, (S⋀)
            check: published-page
            quote: "(S⋀) ∀̅pp∀̅qq(⋀ pp = ⋀ qq → pp ≡ qq)"
            note: CORRECTED 2026-11-27 (audit) - both quantifiers carry the overbar (restriction to truths); Fritz's label for truth-functionality is (⋀T), not (T⋀). Derived by Fritz from (⋀≺); with (⋀T) it is inconsistent by a plural Cantor/Russell–Myhill argument (p. 307).
        readings:
          - point: how to express "only its conjuncts" without immediate ground
            chosen: state the individuation consequence (distinct conjunct sets give distinct conjunctions) directly
            alternatives:
              - a mediate exclusivity clause (every member of a full ground of ⋀X is in X or partially grounds a member of X); INFERENCE - this does not yield injectivity, so it cannot reproduce Fritz
              - add immediate ground for this entry only (reopens a design decision)
              - define immediate full ground from mediate full ground by Fritz's support proposal (fritz2022 p. 322) and state "only its conjuncts" for the defined notion; Fritz leaves evaluating that definition open ("beyond the scope of this article", p. 322)
            why: Fritz's own mediate characterization (p. 322 - the mediate grounds of p ∧ q are exactly p, q and their mediate grounds) is the weak exclusivity clause above, so it does not yield grain. DECIDED (D1, 2026-11-26) - the third alternative is implemented as IMM.CONJ, from which grain is derived (grain_from_conj_imm); this entry stays as a control that assumes grain.
          - point: FLAGGED 0.3.0 (audit) - the first clause (grain of binary conjunction)
            chosen: included
            alternatives: ['the infinitary clause only, which is all (S⋀) states']
            why: the binary clause is not in Fritz's §2.3. It follows from his (∧1) and (∧2) (pp. 304–305) for true conjunctions - checked in 0.3.1 (grain_bin_from_FRITZ7, isabelle/Order.thy), for the defined IPG and with CL.PROP, which gives the truth of both conjuncts. It makes the entry stronger than the quoted source.
          - point: relation to CONJ.BIN
            chosen: standalone; neither CONJ.GRAIN nor CONJ.INF includes CONJ.BIN
            alternatives: []
            why: D5 (audit finding A2).

  # 9 ------------------------------------------------------------------------
  - id: DISJ
    name: Disjunction
    order: chain
    entries:
      - id: DISJ.ONE
        rank: 1
        name: Each true disjunct grounds the disjunction
        statement: |
          T p ⟶ G {p} (disj p q)
          T q ⟶ G {q} (disj p q)
        sources:
          - work: kramer2013
            locator: paragraph after "Re (iii)"
            check: manuscript
            quote: "if p, then p < (p ∨ q)"
            note: CORRECTED 0.3.0 (audit) - Krämer's "<" is partial ground (his fn. 4), so his principle is DISJ.PART and supports this entry only as its consequence. His reference to Fine 2012a, 60 attaches to the analogy with existential quantification, not to this rule.
          - work: fine2012a
            locator: p. 58 (CUP), rules ∨I-L, ∨I-R; p. 60
            check: published-page
            quote: "A or B, separately, is a ground for A ∨ B"
            note: p. 58. The rules as displayed there - "∨I-L. A < A ∨ B" and "∨I-R. B < A ∨ B" (ADDED 0.3.0). Krämer's p. 60 is a related passage (the grounds for A, if true, ground A ∨ ¬A). Fine's rule is not stated with a truth premise; the factive reading is v1's.
          - work: woods2018
            locator: p. 643
            check: published-page
            quote: "if A, then A<A ∨ B"
          - work: fine2010
            locator: p. 100, Disjunctive Grounding
            check: published-page
            quote: "A/A ≺(A ∨B)"
            note: partial ground, so strictly a source for DISJ.PART (0.3.0). On p. 108 Fine calls the rule "unnecessarily strong" when both disjuncts are true and proposes DISJ.WEAK; Fritz (p. 304) reports this passage.
          - work: correia2014
            locator: rules (∨2), (∨3), ms p. 3–4
            check: manuscript
            quote: null
        readings:
          - point: full versus partial
            chosen: '{p} is a full ground'
            alternatives: ['partial only - now the separate entry DISJ.PART']
            why: CORRECTED 0.3.0 (audit) - this note said all the sources read the disjunct as a complete ground. Fine 2012a's ∨I (p. 58) and Correia's rules do. Fine 2010 (≺, p. 99) and Krämer (fn. 4) state the rule for partial ground. Woods's "<" was not re-classified.
      - id: DISJ.BOTH
        rank: 2
        name: Both true disjuncts jointly ground the disjunction
        statement: |
          T p ∧ T q ⟶ G {p, q} (disj p q)
        sources:
          - work: correia2014
            locator: remark D, rule (∨4), ms p. 7
            check: manuscript
            quote: "not clear to me whether the new rules should be adopted."
          - work: fine2012a
            locator: p. 58 (CUP; ms p. 28)
            check: published-page
            quote: "if A and B are separate grounds for A ˅ B then A, B should be a collective ground for A ˅ B."
            note: Fine motivates this rule by Amalgamation; the rule as displayed is "∨I+. A, B < A ∨ B" (ADDED 0.3.0). (Corrected in 0.1.2 - Fine 2010 p. 108, as reported by Fritz p. 304, questions DISJ.ONE for two true disjuncts, not this collective rule.)
        readings:
          - point: status
            chosen: optional entry; endorsed by Fine 2012a (p. 58), left open by Correia
            alternatives: []
            why: Correia leaves it open. Fine 2010 does not discuss the collective rule (checked). Standalone (D5) - it does not include DISJ.ONE; with AMALG.FIN, DISJ.ONE implies it (AMALG_DISJ_ONE_BOTH).
      - id: DISJ.WEAK
        rank: 0
        name: Weak disjunctive grounding (some true disjunct grounds)
        added: 0.1.2-draft, pending review
        statement: |
          T (disj p q) ⟶ PG p (disj p q) ∨ PG q (disj p q)
        sources:
          - work: fine2010
            locator: p. 108, Weak Disjunctive Grounding
            check: published-page
            quote: "Any disjunctive truth is grounded by a disjunct."
          - work: fritz2022
            locator: p. 304, (∨1)
            check: published-page
            quote: "every true disjunction has at least one disjunct as a ground"
            note: Fritz states it for immediate partial ground and pairs it with (∨2), only disjuncts ground a disjunction.
        readings:
          - point: partial versus full
            chosen: partial (PG), as in Fine's ≺
            alternatives: ['G {p} (disj p q) ∨ G {q} (disj p q)']
            why: Fine's operator is partial. Implied by DISJ.ONE and by DISJ.PART under CL.PROP (DISJ_ONE_WEAK, DISJ_PART_WEAK), so rank 0 in this family; INFERENCE - it does not block Fine's universal argument, where only one disjunct is true (Fine p. 109).
      - id: DISJ.PART
        rank: 0
        name: Each true disjunct partially grounds the disjunction
        added: 0.3.0-draft (D5); reviewed 2026-11-27 (see D5 `reviewed`)
        statement: |
          T p ⟶ PG p (disj p q)
          T q ⟶ PG q (disj p q)
        sources:
          - work: fine2010
            locator: p. 100, Disjunctive Grounding
            check: published-page
            quote: "A/A ≺ (A ∨ B)"
            note: Followed by the symmetric rule "B/B ≺ (A ∨ B)" and the gloss "Given the truth of any disjunct, it will help ground a disjunction." Fine's ≺ is partial ground (p. 99).
          - work: kramer2013
            locator: paragraph after "Re (iii)"
            check: manuscript
            quote: "if p, then p < (p ∨ q)"
            note: Krämer's "<" is partial ground (his fn. 4).
        readings:
          - point: why a separate entry
            chosen: the partial rule, between DISJ.ONE and DISJ.WEAK
            alternatives: ['state the puzzles with DISJ.ONE only (0.2.x)']
            why: it is the premise Fine's 2010 arguments use (step 6 of the Universal Argument, p. 102). Implied by DISJ.ONE (DISJ_ONE_PART); implies DISJ.WEAK under CL.PROP (DISJ_PART_WEAK).

  # 10 -----------------------------------------------------------------------
  - id: NEG
    name: Negation
    order: chain
    entries:
      - id: NEG.DN
        rank: 1
        name: Double negation
        statement: |
          T p ⟶ G {p} (neg (neg p))
        sources:
          - work: korbmacher2018a
            locator: Sect. 4.1
            check: manuscript
            quote: "∀x(Tr(x) → x ◁ ¬·¬·x)"
          - work: correia2014
            locator: rule (¬), ms p. 3–4; remark E
            check: manuscript
            quote: null
            note: called double negation introduction.
          - work: fine2012a
            locator: p. 63 (CUP), rule ¬¬I
            check: published-page
            quote: "¬¬I. A < ¬¬A"
            note: ADDED 0.3.0 (audit). Strict full ground; supports the full reading.
        readings:
          - point: FLAGGED 0.3.0 (audit) - full versus partial
            chosen: '{p} is a full ground of its double negation'
            alternatives: ['partial only, as in Korbmacher, whose ◁ is partial ground']
            why: Fine's ¬¬I (fine2012a p. 63) is a full-ground rule. The Korbmacher quotation supports only the partial consequence.
      - id: NEG.DM
        rank: 2
        name: Negated conjunction and disjunction
        statement: |
          T (neg p) ⟶ G {neg p} (neg (conj p q))
          T (neg q) ⟶ G {neg q} (neg (conj p q))
          T (neg p) ∧ T (neg q) ⟶ G {neg p, neg q} (neg (disj p q))
        sources:
          - work: correia2014
            locator: rules (∧2), (∧3), (∨1), ms p. 3–4
            check: manuscript
            quote: null
            note: reconstructed from the tree-node table; rule displays garbled.
          - work: fine2012a
            locator: p. 63 (CUP), rules ¬∧I and ¬∨I
            check: published-page
            quote: "¬∨I. ¬A, ¬B < ¬(A ∨ B)"
            note: ADDED 0.3.0 (audit). Also on p. 63 - "¬∧I. ¬A < ¬(A ∧ B)". These match the entry clause for clause and give it a quotable source. Standalone (D5) - NEG.DM does not include NEG.DN.
        readings:
          - point: negated universal and existential
            chosen: omitted in v1
            alternatives: ['Correia (∀2), (∃1)']
            why: keeps the family size down; add if the quantifier families turn out to matter.

  # 11 -----------------------------------------------------------------------
  - id: EX
    name: Existential grounding
    order: chain
    entries:
      - id: EX.PRED
        rank: 1
        name: Predicative existential grounding (instance free of quantifiers)
        statement: |
          lvl a = 0 ∧ fv a = {} ∧ T (app f (den w a)) ⟶ G {app f (den w a)} (ex f)      (* D3, D5; adm f *)
        sources:
          - work: kramer2013
            locator: section "Can we give reasons to reject (X)"
            check: manuscript
            quote: "restricts (EG-S) to cases in which α is free of sentential quantifiers"
          - work: woods2018
            locator: p. 635
            check: published-page
            quote: "if A is free for p in the predicative fact ϕ(A), then ϕ(A) < ∃p(ϕ(p))"
        readings:
          - point: what must be quantifier-free
            chosen: the instance, presented by a quantifier-free formula a (Krämer's α)
            alternatives: ['the whole instance φ(a) (Woods''s "predicative fact ϕ(A)")']
            why: Krämer's wording is explicit; Woods's is the stronger restriction and is a mutation candidate.
          - point: which formulas count as quantifier-free instances (D5)
            chosen: closed formulas of level 0 (fv a = {}), that is, quantifier-free sentences
            alternatives: ['every level-0 formula under every environment - the 0.2.x statement, equivalent to EX.FULL because Var 0 has level 0 and denotes any proposition (finding F5)']
            why: Krämer's α is a sentence. With the 0.2.x statement his own escape route did not escape (kramer_not_blocked_v021 in isabelle/Audit_Checks.thy). With this one, Krämer's package with EX.PRED in place of the unrestricted principle has the model MG (isabelle/Restricted_Models.thy).
          - point: full versus partial
            chosen: full ground, as in EX.FULL
            alternatives: ['a restricted version of EX.PART']
            why: uniformity with EX.FULL. Krämer's "<" is partial (his fn. 4), so the entry is stronger than his restricted (EG-S).
      - id: EX.LEV
        rank: 2
        name: Level-restricted existential grounding
        statement: |
          lvl a < lvl (Ex x b) ∧ fv a = {} ∧ T (app (lam x b v) (den w a))
            ⟶ G {app (lam x b v) (den w a)} (ex (lam x b v))      (* D3, D5; adm (lam x b v) *)
        sources:
          - work: kramer2013
            locator: section "Can we give reasons to reject (X)"
            check: manuscript
            quote: "a less restrictive option is to introduce a hierarchy of sentential quantifiers"
        readings:
          - point: encoding of the hierarchy
            chosen: one unindexed ∃; the level of the quantified formula bounds the level of the instance
            alternatives: ['indexed quantifiers ex_n ranging over level < n']
            why: keeps one signature for all packages. The bound needs the function to be presented by a formula, so EX.LEV is silent on functions that are not lam-terms (possible under C3s). CORRECTED 0.3.0 (D5) - this note said that by the chain convention EX.LEV includes EX.PRED. It does not. EX.LEV implies EX.PRED exactly when every admissible function is a lam-term (EX_LEV_PRED; so under C1, C2, C3d); under C3s a package that wants both selects both.
          - point: which instances (D5)
            chosen: closed formulas a (fv a = {}) of level below that of the quantified formula
            alternatives: ['every formula of lower level under every environment - the 0.2.x statement, which gave EX.FULL for every lam-term (finding F5)']
            why: as for EX.PRED.
          - point: FLAGGED 0.3.0 (audit) - parameters of the quantified function
            chosen: unrestricted. The body b may have free variables other than x, and the environment v may assign them propositions of any level
            alternatives: ['require fv b ⊆ {x}', 'bound the level of the parameters']
            why: left open by D5 (see its choices). The level of Ex x b is read off the syntax of b, so a parameter can carry a proposition of high level into a function that counts as low. INFERENCE - under C1 this makes no difference, the four witnesses having no parameters. Also INFERENCE - under C1 the four bodies have level 0, so EX.LEV and EX.PRED apply to the same instances unless an admissible function has a second presentation with a body of higher level.
      - id: EX.FULL
        rank: 3
        name: Existential grounding (unrestricted)
        statement: |
          T (app f a) ⟶ G {app f a} (ex f)
        sources:
          - work: kramer2013
            locator: section "Re (iii)"
            check: manuscript
            quote: "From ϕ(α), infer ϕ(α) < ∃p ϕ(p)."
          - work: woods2018
            locator: p. 634
            check: published-page
            quote: "true propositions whose dominant logical component is an existential quantifier are grounded in their true instances."
          - work: fine2010
            locator: p. 101, Existential Grounding
            check: published-page
            quote: "A(y), E(y)/A(y) ≺∃x A(x)"
            note: Fine's ≺ is partial ground ("helps ground", p. 99) and the rule carries an existence premise E(y), trivial here. Fine's principle is weaker than EX.FULL; with TRANS.P and IRR.F it suffices for his arguments. Fine 2010 p. 108 proposes the weaker EX.WEAK.
          - work: lovett2020
            locator: p. 2544, rule ∃-I
            check: published-page
            quote: "A < ∃vA[t/v]"
            note: Lovett's < is strict full ground and the rule is non-factive (no premise); the factive version is not stated for ∃-I. Read from the page image (the rule is typeset as an image).
          - work: fine2012a
            locator: p. 59 (CUP), rule ∃I
            check: published-page
            quote: "∃I. B(a) < ∃xB(x)"
            note: ADDED 0.3.0 (audit). Read from the page image. Strict full ground; the direct source for the full reading.
        readings:
          - point: full versus partial
            chosen: each true instance is a full ground
            alternatives: ['partial - now the separate entry EX.PART']
            why: CORRECTED 0.3.0 (audit) - this note said Krämer uses the instance as a complete ground. His "<" is partial (his fn. 4), and so is Fine 2010's ≺; their principle is EX.PART. The full reading is Fine 2012a's ∃I (p. 59) and Lovett's ∃-I (p. 2544). Woods's "<" was not re-classified.
          - point: first-order quantification over propositions (Fine) versus quantification into sentence position (Krämer)
            chosen: collapsed into ex over pfun
            alternatives: ['a separate first-order domain of propositions with a "proposition" predicate']
            why: base-type design. Consequence flagged in signature notes - (PE) cannot fail.

      - id: EX.WEAK
        rank: 0
        name: Weak existential grounding (some instance grounds)
        added: 0.1.2-draft, pending review
        statement: |
          T (ex f) ⟶ (∃a. PG (app f a) (ex f))
        sources:
          - work: fine2010
            locator: p. 108, Weak Existential Grounding
            check: published-page
            quote: "Any existential truth is grounded by an instance."
          - work: fritz2022
            locator: p. 325
            check: published-page
            quote: "∃pφ → ∃p(φ  ≺  ∃pφ)"
            note: Fritz says this weakening "may well restore consistency" but leaves the theory of quantified grounds "excessively weak".
        readings:
          - point: place in the family
            chosen: rank 0, below EX.FULL
            alternatives: ['a separate family']
            why: EX.WEAK is implied by EX.FULL and by EX.PART under CL.QUANT (EX_FULL_WEAK, EX_PART_WEAK). INFERENCE - it is incomparable with EX.PRED and EX.LEV, so the EX family is not a chain. Fine p. 108 says the Particular Arguments then fail.
      - id: EX.PART
        rank: 0
        name: Existential grounding (partial, unrestricted)
        added: 0.3.0-draft (D5); reviewed 2026-11-27 (see D5 `reviewed`)
        statement: |
          T (app f a) ⟶ PG (app f a) (ex f)      (* adm f *)
        sources:
          - work: fine2010
            locator: p. 101, Existential Grounding
            check: published-page
            quote: "A(y), E(y)/A(y) ≺∃x A(x)"
            note: partial ground; the existence premise E(y) is trivial here (signature notes).
          - work: kramer2013
            locator: section "Re (iii)"
            check: manuscript
            quote: "From ϕ(α), infer ϕ(α) < ∃p ϕ(p)."
            note: (EG-S). Krämer's "<" is partial ground (his fn. 4).
        readings:
          - point: place in the family
            chosen: implied by EX.FULL (EX_FULL_PART); implies EX.WEAK under CL.QUANT (EX_PART_WEAK)
            alternatives: ['state the puzzles with EX.FULL only (0.2.x)']
            why: it is the premise Krämer's and Fine's arguments use. EX.PRED and EX.LEV do not imply it - the model MG satisfies both and refutes it, since Krämer's package with EX.PART is refuted (kramer_package). EX.PART implies neither of them - the model MH satisfies it and fails both (MH_package, isabelle/Separation_Models.thy; an inference until 0.3.0).

  # 12 -----------------------------------------------------------------------
  - id: ALL
    name: Universal grounding
    order: partial
    note: CORRECTED 0.3.0 (D5, audit finding A4). Until 0.2.1 the family was a pair of alternatives. ALL.INST and ALL.TOT share the weaker core ALL.PART, which is what Fine's universal puzzle uses, so they are not alternatives with respect to it. The search never treated them as exclusive.
    entries:
      - id: ALL.PART
        rank: 0
        name: Each instance partially grounds the universal truth
        added: 0.3.0-draft (D5); reviewed 2026-11-27 (see D5 `reviewed`)
        statement: |
          (∀b. T (app f b)) ⟶ PG (app f a) (all f)      (* adm f *)
        sources:
          - work: fine2010
            locator: p. 100, Universal Grounding
            check: published-page
            quote: "∀x A(x), E(y)/A(y) ≺ ∀x A(x)"
            note: partial ground of each instance; the existence premise E(y) is trivial here.
          - work: fine2010
            locator: p. 109
            check: published-page
            quote: "that problem need not be solved in order to pose the puzzle"
            note: the problem being "what the absolute full ground for a universal truth should be".
        readings:
          - point: place in the family
            chosen: weakest entry, implied by ALL.INST and by ALL.TOT (ALL_INST_PART, ALL_TOT_PART)
            alternatives: ['no entry; state Fine''s puzzle with ALL.INST (0.2.x)']
            why: Fine's Universal Argument uses only this (fine_universal_package), so it goes through with ALL.TOT as well as with ALL.INST (fine_universal_ALL_TOT, fine_universal_ALL_INST).
      - id: ALL.INST
        name: Instances alone
        statement: |
          (∀a. T (app f a)) ⟶ G (inst f) (all f)
        sources:
          - work: correia2014
            locator: rule (∀1), ms p. 13–14
            check: manuscript
            quote: null
            note: (∀1) takes all instances for "all the constants of the language"; Correia calls it problematic for classically valid rules.
          - work: fine2010
            locator: p. 100, Universal Grounding
            check: published-page
            quote: "∀x A(x), E(y)/A(y) ≺∀x A(x)"
            note: partial ground of each instance, so strictly a source for ALL.PART (0.3.0). On p. 109 Fine takes all the instances to be a full ground "relative to certain presuppositions" (that the objects listed are all there are), which is the reading ALL.INST encodes; he also rejects a weak universal rule, since a universal truth cannot be grounded "by some of its instances to the exclusion of the others" (p. 109).
          - work: fine2012a
            locator: p. 59 (CUP), rule ∀I
            check: published-page
            quote: "∀I. B(a1), B(a2), . . . < ∀xB(x)"
            note: ADDED 0.3.0 (audit). Read from the page image. Strict full ground by all the instances; the direct source for this entry.
        readings:
          - point: substitutional (Correia) versus objectual instances
            chosen: "objectual - all values app f a for every a of type prop"
            alternatives: ['instances for named constants only']
            why: matches the base-type quantifier.
      - id: ALL.TOT
        name: Instances plus a totality fact
        statement: |
          (∀a. T (app f a)) ⟶ T (tot f) ∧ G (insert (tot f) (inst f)) (all f)
        sources:
          - work: woods2018
            locator: p. 645, Obj. 5
            check: published-page
            quote: "TOTALITY, A0, A1,...< ∀p p ∨ ¬p"
          - work: fine2012a
            locator: pp. 61–62 (CUP)
            check: published-page
            quote: "the “totality” claim that a1, a2, . . . are all of the individuals that there are"
            note: p. 61. Fine distinguishes the totality claim from the corresponding universal claim and takes it in the weak sense "at most" (p. 62); Fritz cites pp. 60–62 for the "that's all" ground (fritz2022 p. 305).
        readings:
          - point: what the totality fact says
            chosen: an opaque constant tot f, required true whenever all instances are
            alternatives: ['tot f = "a, b, ... are all the propositions" with its own grounds']
            why: v1 does not model the content of totality facts.
          - point: FLAGGED 0.3.0 (audit) - consequence for Woods
            chosen: tot f stays opaque
            alternatives: ['a totality fact with structure, so that substitution can act on it']
            why: Woods's reply to his Objection 5 rewrites the totality fact under substitution (p. 645). With an opaque constant that reply cannot be reproduced, so results that combine ALL.TOT with IRR.W do not test Woods's treatment of universal cases (INFERENCE).

