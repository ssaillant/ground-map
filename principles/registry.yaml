            check: manuscript
            quote: "∀x(Tr(x) → x ◁ ¬·¬·x)"
          - work: correia2014
            locator: rule (¬), ms p. 3–4; remark E
            check: manuscript
            quote: null
            note: called double negation introduction.
          - work: fine2012a
