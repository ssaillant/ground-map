          f_em  ≡ lam 0 (Disj (Var 0) (Neg (Var 0))) e0
          f_tem ≡ lam 0 (Disj (Tr (Var 0)) (Neg (Tr (Var 0)))) e0
          adm f ⟷ f ∈ {f_id, f_tr, f_em, f_tem}
          (* with BETA.ID: app f_id p = p, app f_tr p = tr p, app f_em p = disj p (neg p),
             app f_tem p = disj (tr p) (neg (tr p)) - the v0.1.x C1 identities *)
        sources:
          - work: kramer2013
            locator: (1)–(2) and (F1)
            check: manuscript
            quote: null
            note: '"∃p p" (f_id) and "∃x x is true" (f_tr).'
          - work: woods2018
            locator: p. 645
            check: published-page
            quote: null
            note: '"∀p p ∨ ¬p" (f_em).'
          - work: fine2010
            locator: pp. 99, 102–103 (Universal and Particular Middle)
            check: published-page
            quote: "∀x(T (x) ∨¬T (x))"
            note: f_tem; Fine's universal and particular arguments for propositions.
        readings:
          - point: which of Fine's cases to name
            chosen: the propositional cases (f_tem, f_tr); Fine's cases for facts and sentences are not named
            alternatives: ['facts with an existence predicate (Fine pp. 102–103)', 'sentences with a naming device (p. 98)']
            why: v1 has no facts, existence predicate or sentences. Fine's fact arguments with "obtains" in place of "exists" become the propositional ones when facts are true propositions (p. 106), so f_tr covers them.
          - point: identity of the witnesses with their values
            chosen: not part of C1; it comes from BETA.ID
            alternatives: ['state the identities in C1, as in v0.1.x']
            why: D3 - β-conversion is its own family, so that Fritz's rejection of it (via Goodman) is representable.
      - id: C2
        rank: 2
        standalone: true
        name: Level-bounded definable comprehension
        statement: |
          adm f ⟷ (∃x a v. lvl a ≤ k ∧ f = lam x a v)      (* v1: k = 1 *)
        sources: []
        readings:
          - point: bound
            chosen: k = 1 (bodies with at most one nested quantifier)
            alternatives: ['k as a mutation parameter (step 5)']
            why: D3 replaces the v0.1.x closure conditions, which did not bound the level of new quantified propositions. Predicative in the sense of bounding quantifier depth, not Russell's ramification.
      - id: C3d
        rank: 3
        standalone: true
        name: Definable comprehension (impredicative)
        statement: |
          adm f ⟷ (∃x a v. f = lam x a v)
        sources: []
        readings:
          - point: what "definable" means
            chosen: denoted by a formula of the formula layer under some environment
            alternatives: ['definable in the object language with ground as an operator']
            why: D3. The formula layer has no ground operator, so Fritz's comprehension instance with "non-self-grounding" (fritz2022 p. 315) is not C3d-definable; it is available under C3s.
      - id: C3s
        rank: 4
        standalone: true
        name: Full comprehension (standard semantics)
        statement: |
          (∀f. adm f) ∧ (∀h :: prop ⇒ prop. ∃f. app f = h)
        sources: []
        readings:
          - point: source
            chosen: the HOL default made explicit; matches arbitrary plural comprehension as Kment and Fritz use it
            alternatives: []
            why: needed for the Cantor-style results and for X.UNIVERSAL.TRUTHS, whose witness is defined by cases on truth (not C3d-definable; to be confirmed by a model in step 3).

  # 17 -----------------------------------------------------------------------
  - id: BETA
    name: β-conversion for lam-terms (D3)
    order: alternatives
    note: Selecting neither entry is the rejection of both that Goodman reports of Fritz. The core clause LAM.T (truth of redex and reduct agree) holds in every package.
    entries:
      - id: BETA.ID
        name: β-identity (redex and reduct identical)
        statement: |
          app (lam x a v) p = den (v(x:=p)) a
        sources:
          - work: goodman2023
            locator: discussion of Krämer's puzzle (pages not visible)
            check: unverified
            quote: "Fritz argues that there could be a principled basis for rejecting both β-conversion and (9)"
            note: quoted from the published PDF's text as fetched; Fritz's own paper (Goodman's reference [17]) not read.
        readings:
          - point: role
            chosen: the identity the v0.1.x named witnesses built in
            alternatives: []
            why: Krämer's puzzle in its original form uses it (∃p p is its own instance).
      - id: BETA.GROUND
        name: β-grounding (reduct strictly grounds the distinct redex)
        statement: |
          T (den (v(x:=p)) a) ⟶ app (lam x a v) p ≠ den (v(x:=p)) a
                                ∧ G {den (v(x:=p)) a} (app (lam x a v) p)
        sources:
          - work: goodman2023
            locator: principle (9) (pages not visible)
            check: unverified
            quote: null
            note: Goodman's (9), as reported in the decision note; to be checked against the JPL pages.
        readings:
          - point: distinctness
            chosen: stated, so that BETA.GROUND excludes BETA.ID
            alternatives: ['grounding without distinctness (then it contradicts IRR.F whenever BETA.ID also holds)']
            why: keeps the family a set of alternatives.

  # 18 -----------------------------------------------------------------------
  - id: IMM
    name: Immediate ground, defined from mediate ground (D1)
    order: chain
    entries:
      - id: IMM.CONJ
        rank: 1
        name: Only its conjuncts (Fritz's (⋀≺) for the defined immediate ground)
        statement: |
          (∀r∈sat f. T r) ⟶ (∀p. IPG p (bigconj f) ⟷ p ∈ sat f)      (* adm f *)
        sources:
          - work: fritz2022
            locator: p. 306, (⋀≺)
            check: published-page
            quote: "(⋀≺) ∀pp∀p(p ≺ ⋀ pp ↔ p ε pp)"
          - work: fritz2022
            locator: p. 322
            check: published-page
            quote: "let pp support qq just in case every q among qq which is not one of pp is fully grounded in some of pp"
            note: Fritz's proposal defines immediate full grounds as those supported by every plurality that mediately fully grounds the proposition; "Evaluating this proposal is beyond the scope of this article" (p. 322).
        readings:
          - point: definition of immediate ground
            chosen: IG Γ q ≡ G Γ q ∧ every full ground of q supports Γ (signature)
            alternatives: ['Fritz''s wording without the clause G Γ q', 'a primitive of immediate ground (option c)', 'mediate Cut-refinement exclusivity (option b)']
            why: D1. Without G Γ q the empty set qualifies vacuously (INFERENCE). On Fine's (p∧q)∧r the definition picks {p∧q, r}, not {p, q, r} (checked by hand).
          - point: empty plurality
            chosen: allowed (sat f may be empty; then bigconj f has no immediate partial grounds)
            alternatives: ['require sat f ≠ {}']
            why: Fritz admits the empty plurality (p. 303).
          - point: Fritz's seven principles of §2.4
            chosen: separate entry IMM.FRITZ7
            alternatives: []
            why: IMM.CONJ covers the arbitrary-conjunction variant (§2.3) only.
      - id: IMM.FRITZ7
        rank: 2
        standalone: true
        name: Fritz's seven principles of immediate partial ground
        statement: |
          (∧1) T p ∧ T q ⟶ IPG p (conj p q) ∧ IPG q (conj p q)
          (∧2) IPG r (conj p q) ⟶ r = p ∨ r = q
          (∨1) T (disj p q) ⟶ IPG p (disj p q) ∨ IPG q (disj p q)
          (∨2) IPG r (disj p q) ⟶ r = p ∨ r = q
          (∀1) T (all g) ⟶ IPG (app g x) (all g)                  (* adm g *)
          (∀2) IPG q (all g) ∧ (∀x. q ≠ app g x) ⟶ q = tt          (* adm g; tt :: prop *)
          (nt) ¬ (∀p q. T p ∧ T q ⟶ IPG p q)
        sources:
          - work: fritz2022
            locator: pp. 304–305
            check: published-page
            quote: "(∧2) ∀p∀q∀r (r ≺(p∧q) →r = p ∨r = q)"
            note: Fritz states all seven for immediate partial ground ≺; (∀1), (∀2) are schemata over formulas φ in which p occurs free; t is the "that's all" truth if there is one, else an arbitrary proposition (p. 305).
        readings:
          - point: schematic (∀1), (∀2)
            chosen: stated for every admissible function g
            alternatives: ['only for lam-terms of formulas (C3d)']
            why: with C3s every function is admissible. Fritz's derivation of (Sψ) and (Tψ) needs the principles only for the function ψ is built from (p. 308); the formula layer has no constructor for the plural parameter "r ε rr", so C3s supplies that function.
          - point: standalone
            chosen: not cumulative with IMM.CONJ
            alternatives: []
            why: Fritz rests his main argument on the seven principles alone (p. 308).

# ---------------------------------------------------------------------------
# Non-triviality levels (measured on each model; not part of the lattice)
# ---------------------------------------------------------------------------
nontriviality:
  cumulative: true
  parameters: {k: 3, d: 3}
  levels:
    - id: N1
      statement: "∃Γ p. G Γ p"
    - id: N2
      statement: "N1 ∧ ∃ k pairwise distinct p with T p"
    - id: N3
      statement: |
        N2 ∧ every selected introduction entry (CONJ, DISJ, NEG, EX, ALL, TR)
        has an instance whose antecedent holds with pairwise distinct relata and
        whose grounded proposition is not among its grounds
    - id: N4
      statement: |
        N3 ∧ some pair from {(p, neg (neg p)), (conj p q, conj q p),
        (p, conj p p), (disj p q, disj q p)} consists of distinct propositions
        with different sets of full grounds {Γ. G Γ x}
    - id: N5
      statement: "N4 ∧ ∃ x0 … xd pairwise distinct with PG x0 x1, …, PG x(d-1) xd"
  readings:
    - point: cumulative versus independent levels
      chosen: cumulative, so "highest level" is well defined; each level is also reported separately
      why: the brief asks for the highest level.
    - point: '"equivalent propositions" in N4'
      chosen: pairs that are classically equivalent by construction
      alternatives: ['any two propositions with the same truth value (too weak in a one-world model)']
      why: v1 has no modality, so "equivalent" cannot mean necessarily equivalent.

# ---------------------------------------------------------------------------
# Validation targets for step 3 (all reproduced 2026-11-27; see puzzles.validation)
# ---------------------------------------------------------------------------
puzzles:
  targets:
  - id: P.KRAMER
    source: kramer2013 (1)–(2)
    package: [C1, BETA.ID, CL.QUANT, EX.FULL, IRR.F]
    expected: refuted
    derivation: |
      CL.PROP gives a truth, so T (ex f_id); ex f_id is a true instance of
      itself (app f_id (ex f_id) = ex f_id), so G {ex f_id} (ex f_id).
  - id: P.FINE.PARTICULAR
    source: fine2010 p. 106 ("something is true", facts read as true propositions); kramer2013 (F1)–(F4); lovett2020 p. 2541 (factive version, fn. 21 p. 2550)
    package: [C1, BETA.ID, CL.QUANT, TS.FULL, TR.FULL, EX.FULL, ASYM.P]
    also_refuted_with: [TRANS.P, IRR.F]   # instead of ASYM.P
    expected: refuted
  - id: P.FINE.UNIVERSAL
    source: fine2010 pp. 102–103, Universal Argument for Propositions, steps (1)–(9)
    package: [C1, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, ALL.INST, DISJ.ONE, TR.FULL, TRANS.P, IRR.F]
    expected: refuted
    derivation: |
      s = all f_tem is true; d = disj (tr s) (neg (tr s)) is an instance, so PG d s
      (Fine's step 4); T (tr s), so PG (tr s) d (step 6); PG s (tr s) (step 7);
      TRANS.P gives PG s s (step 8).
  - id: P.FINE.PARTICULAR.PROPS
    source: fine2010 p. 103, Particular Argument for Propositions
    package: [C1, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, EX.FULL, DISJ.ONE, TR.FULL, TRANS.P, IRR.F]
    expected: refuted
    note: Fine p. 108 - blocked by replacing EX.FULL and DISJ.ONE with EX.WEAK and DISJ.WEAK; a target for step 3.
  - id: P.FINE.UNIVERSAL.SP
    source: sentence-position variant of fine2010 p. 102, instance from woods2018 p. 645
    package: [C1, BETA.ID, CL.QUANT, ALL.INST, DISJ.ONE, TRANS.P, IRR.F]
    expected: refuted
    derivation: |
      s = all f_em is true; s is a true disjunct of app f_em s = disj s (neg s),
      so PG s (disj s (neg s)); that disjunction is an instance of s, so
      PG (disj s (neg s)) s; TRANS.P gives PG s s.
  - id: P.FRITZ.CANTOR
    source: fritz2022 pp. 306–307 (sect. 2.3, arbitrary conjunction); main result sect. 2.4 pp. 308–310
    package: [C3s, CL.PROP, CL.QUANT, IMM.CONJ]
    control_package: [C3s, CL.PROP, CL.QUANT, CONJ.GRAIN]
    expected: refuted, without irreflexivity
    caveat: reproduces the arbitrary-conjunction variant (S⋀)+(T⋀) of §2.3, with grain derived from IMM.CONJ (D1). Fritz's main result (§2.4, seven principles of immediate ground, (∧1)–(∀2) and (nt), pp. 304–305) needs further IMM entries.
  - id: P.FRITZ.MAIN
    source: fritz2022 §2.4, pp. 308–310
    package: [C3s, CL.PROP, CL.QUANT, IMM.FRITZ7]
    expected: refuted (Fritz), without irreflexivity
  - id: P.WOODS.CHECK
    source: woods2018 (no model given in the paper)
    package: [C1, BETA.ID, CL.QUANT, EX.FULL, IRR.W, TRANS.P]
    expected: unknown; a model here would be a finding (Woods proposes, "not prove", p. 639)
  checked:
    # Machine-checked 2026-11-26 in Isabelle2026, isabelle/Russell_Checks.thy (no sorry, oops or axioms; principles are hypotheses).
    # Encoding note (D3): Russell_Checks and Fine_Checks predate the formula layer. Their hypotheses
    # quantify over every pfun and state the C1 identities directly (e.g. app f_id p = p); in v0.2
    # terms that is C1 + BETA.ID with the admissible witnesses used. kramer_v2 in Signature.thy
    # re-checks Krämer's puzzle in the v0.2 encoding.
    - id: P.KRAMER
      theorem: kramer
      status: refuted (checked)
    - id: X.UNIVERSAL.TRUTHS
      theorem: universal_of_truths
      package: [C3s, CL.PROP, CL.QUANT, ALL.INST, IRR.F]
      status: refuted (checked)
      note: the universal whose instances are exactly the truths is one of its own instances. Uses a function defined by cases on truth, so it needs C3s (every function), not definable comprehension.
      prior_art: transposition of the Russell–Myhill diagonal for ground in Kment, "Russell-Myhill and Grounding" (p. 8); not a finding. Closest case in fine2010 - a universal argument from "every true proposition is true" with quantifiers restricted to truths (pp. 106–107), which needs truth-grounding and transitivity; ours builds the restriction into the function and needs neither. Lovett 2020 does not discuss it (checked).
    - id: X.CONJ.TRUTHS
      theorem: conjunction_of_truths
      package: [C1, BETA.ID, CL.PROP, CL.QUANT, CONJ.INF, IRR.F]
      status: refuted (checked)
      note: the conjunction of all truths is one of its own conjuncts (satisfier reading).
      prior_art: degenerate case, under irreflexivity, of Fritz's predicative argument with the non-self-grounding truths (fritz2022 p. 315); Kment p. 9 draws the parallel conclusion for existence-grounding.
    # Machine-checked 2026-11-26 in Isabelle2026, isabelle/Fine_Checks.thy.
    - id: P.FINE.UNIVERSAL
      theorem: fine_universal_props
      status: refuted (checked)
    - id: P.FINE.PARTICULAR.PROPS
      theorem: fine_particular_props
      status: refuted (checked)
    - id: P.FINE.PARTICULAR
      theorem: something_true_asym (with ASYM.P), something_true_trans (with TRANS.P and IRR.F)
      status: refuted (checked)
      note: Lovett's Asymmetry(<) is for strict full ground; both groundings here have singleton full grounds, so full-ground asymmetry would also suffice.
    # Machine-checked 2026-11-26 in Isabelle2026, isabelle/Signature.thy (v0.2 encoding).
    - id: P.KRAMER
      theorem: kramer_v2
      package: [C1, BETA.ID, CL.PROP, CL.QUANT, EX.FULL, IRR.F]
      status: refuted (checked)
    - id: P.FRITZ.CANTOR
      theorem: fritz_cantor_imm (uses grain_from_conj_imm)
      package: [C3s, CL.PROP, CL.QUANT, IMM.CONJ]
      status: refuted (checked)
      note: no irreflexivity, transitivity or other ground principle is used; the inconsistency comes from IMM.CONJ, truth-functionality of bigconj and full comprehension, as Fritz says (pp. 306–307).
    - id: P.FRITZ.P315
      source: fritz2022 p. 315 (the non-self-grounding truths)
      theorem: fritz_p315_imm
      package: [C3s, CL.PROP, CL.QUANT, IMM.CONJ]
      status: refuted (checked)
      note: needs C3s here; Fritz's instance of comprehension is predicative but mentions ground, which the formula layer cannot express (see C3d).
    - id: P.FRITZ.MAIN
      theorem: fritz_main_imm (isabelle/Fritz_Main.thy; generic form fritz_main_generic)
      package: [C3s, CL.PROP, CL.QUANT, IMM.FRITZ7]
      status: refuted (checked)
      note: follows Fritz's proof step by step - two distinct truths from (nt) (p. 308), the hat-conjunction and hat-disjunction lemmas, (Lφ), (Sψ), (Tψ) (pp. 309–310), then the Cantorian step. The generic theorem shows the seven principles are inconsistent for any factive relation, not only for IPG. "r ε rr" is encoded as a proposition app (mem X) r with T (app (mem X) r) ⟷ r ∈ X, given by C3s.
    - id: P.FINE.UNIVERSAL.SP
      theorem: fine_universal_sp (isabelle/Fine_Checks.thy)
      status: refuted (checked)
    - id: V.WOODS.KRAMER
      source: woods2018 p. 640 (Krämer's ∃p p is vacuous)
      theorem: kramer_vacuous
      package: [C1, BETA.ID, EX.FULL]
      status: validation (checked) - the self-ground {∃p p} of ∃p p satisfies vacW, so IRR.W does not exclude it; matches Woods's verdict.
  validation:
    # Step 3 of the brief: "reproduce Krämer's puzzle, Fine's puzzles, and Fritz's Cantor-style result".
    date: 2026-11-27
    status: passed - every target is reproduced by a checked Isar proof (Isabelle2026; no sorry, oops or axioms)
    reproduced: [P.KRAMER, P.FINE.PARTICULAR, P.FINE.PARTICULAR.PROPS, P.FINE.UNIVERSAL, P.FINE.UNIVERSAL.SP, P.FRITZ.CANTOR, P.FRITZ.MAIN]
    encoding_checks: [V.WOODS.KRAMER]
    open: [P.WOODS.CHECK]
    caveat: Russell_Checks and Fine_Checks use the pre-D3 encoding (identities stated directly); only P.KRAMER is re-checked in the v0.2 encoding (kramer_v2). Re-stating the Fine proofs over the formula layer is mechanical and is scheduled with step 4.
  conjectures:
    # INFERENCE: superseded by X.UNIVERSAL.TRUTHS (simpler, checked). Kept for the record.
    - id: X.RUSSELL.ALL
      package: [C3s, CL.PROP, CL.QUANT, ALL.INST, IRR.F]
      claim: refuted, without disjunction or transitivity
      sketch: |
        Let D = {p. T p ∧ (∃f. p = all f ∧ p ∉ inst f)}. If D is empty, take a
        constant f with true value q; then all f ∈ inst f = {q}, so
        G {q} q. Otherwise C3 gives g with inst g = D, and all g is true. If
        all g ∉ D then all g ∈ D (witness g). So all g ∈ inst g, and
        ALL.INST gives G (inst g) (all g) with all g among its grounds.
      significance: if it checks, unrestricted universal grounding plus full
        comprehension is incompatible with irreflexivity outright, so Fine's
        universal puzzle does not need DISJ or TRANS under C3. The same sketch
        applies to CONJ.INF. Literature check needed before calling it new.

  # Candidate validation targets from sources received after step 3 passed.
  # Not encoded, not part of the step 3 result; reviewer decides whether to add them.
  candidates:
    - id: P.LITLAND.INTERNALITY
      source: litland2023 sect. 4.4, p. 12 (variant of litland2015 pp. 489-491, not received)
      claim_in_source: Irreflexivity (mediate partial), disjunction grounding, restricted "or"-Internality and Aristotle's Principle (T p implies p grounds T p) are jointly inconsistent; fn. 30, the inconsistency persists if T p is identical to p.
      registry_mapping: INFERENCE, unchecked - roughly [IRR.F or IRR.P, DISJ.ONE/DISJ.BOTH, TR.FULL] plus a new INTERNALITY family; Internality has no registry entry yet.
      status: not encoded
    - id: P.CORREIA.2026
      source: correia2026 sects. 8-9 (truth-teller/liar puzzles; Cantorian puzzle for immediate ground)
      status: not read in this thread
    - id: P.ELGIN.IDENTITY
      source: elgin2026 (a = b partially grounds itself)
      status: not read in this thread

# ---------------------------------------------------------------------------
# Findings that bear on the search (step 4)
# ---------------------------------------------------------------------------
findings:
  - id: F1
    date: 2026-11-27
    claim: No package containing CL.PROP, TRANS.P and IRR.F together with any of CONJ.BIN, DISJ.ONE or TR.FULL (+ TS.FULL) has a finite model.
    proof: isabelle/No_Finite_Models.thy (chain_no_finite; no_finite_model_conj, _disj, _tr). The chain p, s p, s (s p), ... of truths, with s = λp. conj p p, disj p p or tr p, must repeat in a finite domain, and transitivity then gives PG x x.
    consequence: Nitpick can certify models only for packages that drop transitivity, irreflexivity or every such "successor" rule. Most packages of interest need infinite-model certificates (for example term models built in Isabelle), which the brief's classification "finite-model" does not cover. DECIDED (D4, 2026-11-27) - add the class "infinite-model", certified by a model constructed in Isabelle.
    status: checked

