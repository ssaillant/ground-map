  - id: P.FINE.UNIVERSAL.SP
    source: sentence-position variant of fine2010 p. 102, instance from woods2018 p. 645
    package: [W.EM, BETA.ID, CL.PROP, CL.QUANT, ALL.PART, DISJ.PART, TRANS.P, IRR.F]
    expected: refuted
    theorem: fine_universal_sp_W; with C1, fine_universal_sp_package; fine_universal_sp_em and fine_universal_sp_witness for the weaker hypotheses (isabelle/Puzzle_Packages.thy)
    status: refuted (checked)
    derivation: |
