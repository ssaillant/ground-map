            note: CORRECTED 2026-11-27 (audit) - Goodman's (9), quoted here, is only the instance for (λp.p). The general schema this entry encodes is what Goodman calls "the principle of β-grounding" on the same page, attributing it to Fine 2012a (his [15]).
          - work: fritz2020
            locator: sect. 4, final draft p. 4, (βG)
            check: manuscript
            quote: "(βG) φ[ψ/p] → (φ[ψ/p] ≺ (λpφ)ψ)"
            note: ADDED 0.3.0 (audit). Read from the page image of the final draft. Fritz attributes the proposal to Fine (2012, section 1.9).
          - work: fine2012a
