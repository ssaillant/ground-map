  - id: D8
    date: 2026-11-27
    decided_by: Said Saillant (reviewer), same message ("then we should fix that")
    implemented_in: 0.5.0-draft
    question: whether N4 counts in models where truth is not classical (for example every proposition true)
    decision: >-
      N4 counts only in models that satisfy CL.PROP. Its pairs are meant to be
      classically equivalent; where CL.PROP fails (all-true models, the term
      model ME) a distinct pair with different grounds does not show grain
      among equivalent propositions. Because the levels are cumulative, such
      a model is reported at N3 at most, with N4_pairs and N5_chain noted
      separately when proved.
    checks: N4_pairs in isabelle/Principles.thy; levels in results/isabelle_models.jsonl
