  - id: F13
    date: 2026-11-27
    status: checked; pending review (proposed 0.6.0-draft)
    claim: >-
      Korbmacher's untyped repair (DISJ.GRD, slide 12) is refuted again by the left-to-right half
      of his slide-3 formula read as foundation (FOUND.ATOM), given a non-atomic diagonal
      proposition (DIAG.K) and FACT.
    proof: >-
      isabelle/NonClassical.thy, korbmacher_found. If d had a partial ground, DISJ.GRD would make
      d ground d ∨ d, so d is true, contradicting its diagonal condition; so d is ungrounded, hence
      (FOUND, d non-atomic) untrue, hence by the diagonal condition d grounds d ∨ d, hence true by
      FACT.
    consequence: >-
      Slide 12's observation (Kriterion p. 6-7 "Observation") that d is ungrounded is not stable -
      with foundation, ungroundedness makes d untrue, and the diagonal condition then makes d
      ground d ∨ d. No truth clauses are used, so any package with DISJ.GRD and DIAG.K must let
      FOUND fail at d. LITERATURE (Kriterion paper read 2026-11-27) - Korbmacher's fn. 5 (p. 7)
      already states that FACT plus "every truth has a partial ground" is inconsistent; F13 is the
      variant that exempts the fundamental (atomic) truths and uses his own restricted
      disjunction rule (∨*1) of p. 6, left-to-right half. It bears on his conjecture (p. 7) that "an
      interesting, consistent, untyped predicational theory of ground can be developed in this
      way". FLAGGED - F13 needs Fund fixed independently of ground (proposed.FOUND readings); under
      his 2018a definition of Fund it does not arise.
  - id: F14
    date: 2026-11-28
    status: checked; pending review (0.7.0-draft)
    claim: >-
      Under classical truth, IRR.W lets a truth help ground itself only if any truth can
      take its place. Precisely - assume FACT, LAM_CORE, CL.PROP, CL.QUANT, TS.FULL and
      IRR.W, and let c be a member of a full ground Γ of c. Then Γ has a presentation by
      formulas in which some formula φ, with the marked variable free, denotes c, and for
      EVERY truth B the set obtained by putting B for c is a full ground of c; in
      particular what φ denotes with B for c helps ground c. If no formula that properly
      contains the marked variable denotes c, every truth helps ground c.
    proof: >-
      isabelle/Woods_Models.thy - woods_classical, woods_classical_every_truth, with
      classical_truth_env (under those entries the truth value of what a formula denotes
      depends only on the truth values of what its variables denote, so the side condition
      of vacW, "the modified grounds are true", is met by every truth).
    consequence: >-
      (1) For partial ground the demand is already met by the packages themselves. In each
      Krämer and Fine target, and in Woods's Objection 3, every truth helps ground the
      self-grounding truth by the package's own entries, with no irreflexivity entry -
      kramer_cluster (every truth helps ground whatever ∃p p helps ground), woods_obj3 (the
      fact Woods's reply to Objection 3 uses, pp. 643-644), fine_sp_every_truth (every truth
      B is a disjunct of the instance B ∨ ¬B of ∀p(p ∨ ¬p); compare his reply to Objection
      5, p. 645). What IRR.W adds is the same for full grounds - the set with B in place
      of c must itself be a full ground. (2) INFERENCE, not checked - whether the entries
      for full ground (EX.FULL, ALL.INST, DISJ.ONE, TR.FULL with TRANS.CUT) deliver that by
      themselves differs by case. For the existential cases they seem to (from {T B}
      grounding ∃p T p and {B} grounding T B, TRANS.CUT gives {B} grounding ∃p T p, for
      every truth B). For the universal cases they seem not to (putting B for ∀p(p ∨ ¬p)
      removes the instance at ∀p(p ∨ ¬p) from the grounds), which is where Woods brings
      in the totality fact (p. 645, fn. 37). Settling this needs a model of the full-ground
      package in which a reflexive fact is not vacuous, with propositions as fine as
      formulas; the models of F15 are too coarse for it. (3) INFERENCE, not checked -
      without CL.PROP or TS.FULL the side condition of vacW can do the work. If the truth
      value of a negation, a disjunction or a truth ascription may depend on which
      proposition it applies to, a ground can be added that is true for c and false for
      every other B, and vacW then holds trivially. Woods's modal clause is his defence
      against a related worry (fn. 27, p. 640, on there being too few facts to substitute);
      the one-world test has none outside classical packages, so IRR.W results for
      non-classical packages should be read with this in mind. (4) The reading "some
      presentation" flagged on IRR.W matters in models that identify propositions. There a
      formula that properly contains the marked variable can denote c (for instance a
      vacuous quantification over it). The models of F15 do not use such presentations;
      woods_classical does not exclude them, which is why its last clause is conditional.
  - id: F15
    date: 2026-11-28
    status: checked; pending review (0.7.0-draft)
    claim: >-
      Each of the five Krämer and Fine targets is consistent with IRR.W in place of IRR.F,
      with classical truth, at level N5; so is the package of Woods's Objection 3 and the
      union of all of them. One infinite model, MV, satisfies them together at full
      strength - C3s, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, EX.FULL, ALL.INST, CONJ.BIN,
      CONJ.INF, DISJ.ONE, DISJ.BOTH, TR.FULL, TR.NEG, NEG.DN, NEG.DM, TRANS.CUT, AMALG.INF,
      EMPTY.NONE, IRR.W (and IRR.MEM). The same model satisfies C1, C2 or C3d in place of
      C3s when the admissibility predicate is changed (MV1, MV2, MV3). The registry target
      P.WOODS.CHECK also has a finite model, MW. In all of them the vacuity test is the
      one-world test of decision D2.
    proof: >-
      isabelle/Woods_Models.thy - MV_package with MV_N3, MV_N4s, MV_circles; MV1_package,
      MV2_package, MV3_package, MV2_obj3; MW_package with MW_N3, MW_N4s. In MV a
      proposition is a truth value with a level; levels form an ordinary tier L n and a
      top tier Top n; connectives and the truth ascription raise the level by one and stay
      in the top tier once an argument is there; every quantified proposition has level
      Top 0. A non-empty set of truths fully grounds a truth q when q is in the top tier,
      or when every member has an ordinary level below that of q. The propositions on each
      puzzle's circle are distinct (MV_circles) - ∀p(p ∨ ¬p) is (True, Top 0) and its own
      instance is (True, Top 2).
    consequence: >-
      Woods's substitution of substantive for strict irreflexivity removes every one of
      these puzzles at once, on the one-world reading, and it does so without restricting
      comprehension, the truth schema or any introduction entry. WHAT THE MODELS COST - in
      MV every true quantified proposition, and every truth built from one, is fully
      grounded by every non-empty set of truths (MV_top_universal). For partial ground
      much of this is forced by the packages (F14 (1)); for full ground it is a
      stipulation of the model, and it is the simplest way to satisfy the demand of F14.
      The levels N1-N5 do not register it - the model reaches N5 through the ordinary
      tier. INFERENCE, not separately checked - the relation on which every non-empty set
      of truths grounds every truth also satisfies IRR.W (the proof of MV_IRR_W uses only
      that the conclusion is in the top tier), so consistency with IRR.W is never the
      informative question; the level and the cost are. LIMITS - (a) one-world vacuity;
      Woods's test is modal (fn. 27), so the models do not show that his own principle is
      satisfied. (b) The seven packages contain no totality fact, and where ALL.TOT is
      added (F17) the totality fact cannot be rewritten under substitution, so nothing
      here tests his own reply to Objection 5 (reading flagged in puzzles.irr_w_tests). (c) Propositions are
      truth values with a level. All true quantified propositions with the same history
      of connectives are one proposition; for instance ∃p p and ∀p(p ∨ ¬p) are both
      (True, Top 0). (d) No model here separates IRR.W from the control IRR.MEM. NOVELTY -
      not claimed. That these packages are acceptable with substantive irreflexivity is
      Woods's proposal (woods2018); he gives no model. What is added is a machine-checked
      certificate for this registry's reading and the statement of its cost. Literature
      check - limited to the project's sources. lovett2020 p. 2552 objects to Woods's
      solution on cases outside this signature (truth of self-referential sentences;
      conjunction and disjunction cases). Whether a model of Woods's proposal has been
      published elsewhere was not checked beyond that.
  - id: F16
    date: 2026-11-28
    status: checked; pending review (0.7.0-draft)
    claim: >-
      With antisymmetry (ASYM.ANTI), which Woods adopts in place of asymmetry (fn. 4),
      the sentence-position package forces ∀p(p ∨ ¬p) to be the same proposition as its own
