    status: checked
  - id: F9
    date: 2026-11-28
    claim: "With TR.TYPED in place of TR.PART, each of the three targets that involve truth is consistent: 'something is true' (P.FINE.PARTICULAR, in both versions), Fine's universal argument for propositions (P.FINE.UNIVERSAL) and his particular argument for propositions (P.FINE.PARTICULAR.PROPS). The truth schema stays unrestricted (TS.FULL), and so do the existential and universal entries (EX.FULL, ALL.INST). Two packages have models - [W.ID, W.TR, W.TEM, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, TS.TYPED, TR.TYPED, ALL.INST, ALL.PART, DISJ.ONE, DISJ.PART, TRANS.P, IRR.F, ASYM.P] (model MT) and [W.TR, W.TEM, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, TS.TYPED, TR.TYPED, EX.FULL, EX.PART, ALL.INST, ALL.PART, DISJ.ONE, DISJ.PART, TRANS.P, IRR.F, ASYM.P] (model MU). The three variants are sub-packages of the second."
    proof: "isabelle/Separation_Models.thy - MT_package, MT_W, MT_N3, MT_N4, MT_not_TR_PART; MU_package, MU_N3, MU_N4, MU_not_TR_PART. Both models have N1, N2, N3 instances for their DISJ, ALL, TR and (in MU) EX entries, an N4 pair and a four-step chain. A proposition is a truth value with a rank in one of two tiers; a truth ascription has the lowest rank of the upper tier; an existential or universal proposition has upper-tier rank exactly when its body is not truth-free; a truth grounds every truth of higher rank. In MU 'something is true' is grounded in its own truth ascription, which is one of its instances, and does not ground that ascription (MU_not_TR_PART)."
    consequence: "What Fine's arguments need beyond Krämer's is the untyped grounding of truth ascriptions: TR.PART applied to a quantified truth whose body contains the truth predicate. Typing that one principle blocks the three arguments, and typing the truth schema is not needed. Krämer's puzzle and the sentence-position universal puzzle mention no truth entry and are untouched: adding W.ID to the second package refutes it (kramer_W), and adding W.EM refutes both (fine_universal_sp_W). So W.ID is compatible with the typed packages only in the absence of an unrestricted existential entry, and W.EM only in the absence of ALL.PART or DISJ.PART. LIMITS - two models of one construction; their propositional functions are closures (a variable, a formula and an environment), not functions on propositions; the rank of a quantified proposition is fixed by the syntax of its body, a stipulation of the models; no CONJ or NEG grounding entry was checked; the falsity version of the argument (P.KORBMACHER.APF, F21) is refuted with the untyped TR.NEG, and no typed falsity entry exists to test. COMPARISON (restated 0.8.0, D10, F23) - F9 is not a case of Korbmacher's typed solution (korbmacher2018b), and neither result implies the other. Korbmacher keeps the Aristotelian principle at every level (APU, p. 207) and makes Tr_1 false of every sentence outside L_0 (T3, p. 204), so Tr_1(∃xTr_1(x)) is no true instance of ∃xTr_1(x) ('the grounds of the truth of ∃xTr_α(x) don't include the truth of ∃xTr_α(x) itself', p. 224). MU keeps TS.FULL, so tr s is a true instance of s = 'something is true', and EX.FULL grounds s in tr s; what fails is the Aristotelian principle for s, since TR.TYPED says nothing about a proposition that is not truth-free. His theory covers more grounding rules (negation, conjunction, the downward axioms) and only partial ground over first-order codes; F9 covers full ground, impredicative propositional quantification with BETA.ID, and an untyped truth schema. The registry transcription of his solution is a different package with its own model (P.KORBMACHER.2018B.TYPED, F22). NOVELTY - not found in the sources read, which is weaker than undefended. Fine sets aside giving up Propositional Grounding ('let us keep these assumptions fixed for the rest of the discussion', fine2010 p. 107); Lovett 2020 sect. 6 (pp. 2549-2552) surveys Fine, Korbmacher, rejecting irreflexivity and Woods, none of which is F9's option, and his own solution weakens both links by a weak-ground condition (p. 2557); Genco, Poggiolesi and Rossi 2021 (pp. 1446-1447) keep the Aristotelian rule. Read 0.8.0, after the reviewer supplied them - (a) Krämer 2013 lists rejecting (A), the Aristotelian principle, as a response to the Finean argument and attributes it to Skiles (ms.) ('Skiles (ms.) advocates rejecting (A) as well as my assumption (i) from the beginning of the paper', kramer2013 fn. 6; (i) is that grounding is adequately expressed by a sentential operator). SECONDHAND - the attribution rests on Krämer's footnote alone; Skiles's text has not been read, so neither his reasons nor the form of his rejection of (A) is known. Rejecting (A) blocks a step of the Finean argument; Krämer's own puzzle dispenses with (A) but still uses (i), so Skiles's position as reported would also reach it, through (i). INFERENCE, flagged - the registry states ground as a relation on propositions, not as an operator, so how a rejection of (i) bears on P.KRAMER depends on whether propositional quantification is read as Krämer's sentential quantification or as first-order quantification over propositions, which he says would make his argument 'a notational variant on its Finean counterpart'; he notes that rejecting (A) does not help with his sentential puzzle, which F9 confirms (W.ID refutes the typed package, kramer_W); his own predicativist option restricts existential grounding (EX.PRED, EX.LEV), not (A). So giving up (A) is a known response; what F9 adds is the restricted form (A for truth-free propositions only) with an untyped truth schema and impredicative quantification, and a model. (b) Donaldson (draft, appendix pp. 25-27) blocks the second-order analogue of Fine's universal argument by levels of properties, a restriction on which properties exist ('⟨λ0x: ∃X1 X1x⟩' does not represent a property, p. 27), and identifies Fine's 'predicativist' approach with it (endnote xlii, p. 36); that is a restriction of comprehension, not of truth-grounding. (c) Litland 2015 sect. 6.3 (pp. 493-494) considers restricting Truth-grounding by type - 'φ ≺ T⌜φ⌝ holds only when the truth-property assigned to \"T\" is of a \"higher\" type than any truth-property assigned to a truth-predicate occurring in φ' (p. 493) - as a contextualist response, and objects that 'the contextualist needs to independently motivate the restriction on Truth-grounding', since the scenarios are not paradoxical (p. 494); he keeps truth untyped. This is the nearest option found. F9 differs in having one untyped truth predicate with an untyped truth schema, and in never grounding the truth ascription to a proposition that is not truth-free in that proposition, at any level; Litland's motivation objection applies to it with more force. Not read - Skiles (ms.), 'Some solutions to some puzzles of ground' (cited by Krämer; the closest lead; Skiles's chapter 'Identity and the Epistemology of Grounding' and the SEP entry 'Metaphysical Explanation', both read 2026-11-28, neither discuss nor cite it), Correia 2014, Pleitz 2020, Schnieder (forthcoming), deRosset 2021, Botticchio 2024 (Utrecht MA thesis), Korbmacher's 2016 dissertation ch. 2. COST AND SCOPE (INFERENCE) - in MU the truth ascription to 'something is true' grounds it and is not grounded by it, the reverse of the direction Fine's Aristotle passage (p. 106) and Korbmacher's APU support. Typing TR touches only arguments that run through tr; Correia's operator puzzle (correia2026 p. 2566), with ¬¬ in place of truth, is not blocked by it once λp. ¬¬p is admissible (candidate P.CORREIA.2026, not encoded)."
    status: checked

  - id: F10
    date: 2026-11-27
    status: checked; pending review (proposed 0.6.0-draft)
    claim: >-
      The interpretation Poggiolesi gives to prove her consistency theorem (poggiolesi2022 p. 5)
      violates her condition (1) and makes a falsehood a ground. Her theorem itself is true.
    proof: >-
      isabelle/Poggiolesi_Checks.thy. poggiolesi_interpretation_violates_1 and
      poggiolesi_interpretation_not_factive - let B = p ∨ ¬p, C = q, A = B* = ¬(p ∨ ¬p). A ≅ B,
      so A is an immediate g-subformula of B ∧ C; B ∧ C is true (clause (ii)); A classically
      implies B ∧ C because A is unsatisfiable (clause (iii)). So the interpretation makes A ⊲ (B ∧ C)
      true, but A is equivalent to neither conjunct, so I(A ≈ B) and I(A ≈ C) are false (clause
      (iv)) and (1) fails; A is false. This holds for every relation ≐ containing ≅.
      poggiolesi_conditions_consistent - a normal-form interpretation (push star through,
      ground = immediate subformula of normal forms between truths, identity = same normal form)
      satisfies (1), (2'), (3), (4'), (5), (6), (7'), (8') and the Leibniz reading LEIBNIZ, and is
      factive and irreflexive (NR_factive_irreflexive). wilhelm_inconsistency checks Wilhelm's
      original conditions (1), (4), (5), (6), (7) refuted for any reflexive, symmetric Q that R
      respects; wilhelm_prp is the prp version for IPG with identity.
    consequence: >-
      Poggiolesi's consistency claim survives with a different witness; the published proof
      does not establish it as written. The source of the failure is that ≅ relates A to A*,
      which has the opposite truth value, and clause (iii) is passed by any contradiction.
      LITERATURE - not found as known (checked 2026-11-27, limited search). Litland 2022
      (Analysis 81(4) 639-647) predates it and does not discuss it; the PhilArchive citation
      list for Wilhelm 2021 shows no reply to Poggiolesi; Litland 2023 cites it only in its
      bibliography. INFERENCE - the counterexample depends on the literal reading of ≅
      (proposed.WP readings); under a reading where ≅ never pairs formulas of opposite truth
      value it may not arise. Not to be called new before the reviewer has checked the reading.
  - id: F11
    date: 2026-11-27
    status: checked; pending review (proposed 0.6.0-draft)
    claim: >-
      Fine's strong Kleene "compromise" package with beta identity is consistent at N1, N2 and
      N5 - FACT, LAM_CORE, C3d, BETA.ID, SK.PROP, SK.QUANT, TS.KF, TS.FULL, SK.GAP, IRR.F, ASYM.P,
      TRANS.P, TRANS.CUT, AMALG.INF, EMPTY.NONE, CONJ.BIN, DISJ.WEAK, NEG.DN, EX.WEAK, ALL.INST,
      TR.FULL, TR.NEG. The same package with CL.PROP + CL.QUANT in place of SK is refuted.
    proof: >-
      isabelle/Kripke_Model.thy, theorem K1_package (restated principles over gstr; fidelity_nc
      and the D4 fidelity lemmas link them to Principles.thy and NonClassical.thy). K1 is a term
      model - propositions are closed terms, quantifiers are closures of a formula under an
      environment, application is substitution (so BETA.ID and C3d hold). Each term gets a pair
      of Kripke stages (true-stage, false-stage) in enat, computed by recursion; monotonicity
      (sf_mono) makes a quantifier's stage computable from its instances at a true, a false and
      a gap atom. Ground is the least relation closed under the package's introduction rules
      with "efficient" premises (premise stage below conclusion stage, Fine p. 112 and fn. 13),
      cut and amalgamation; kgr_sound shows every ground's premises are true strictly earlier.
      The classical refutation is fine_universal_weak in NonClassical.thy, which reproduces Fine
      p. 109 ("we cannot save ourselves from the Universal Argument ... only one of the disjuncts
      is the case"). K1 refutes DISJ.ONE at Fine's fn. 13 example (K1_not_DISJ_ONE) and EX.FULL
      (K1_not_EX_FULL), as Fine says (p. 114).
    consequence: >-
      Makes Fine 2010 sect. 8 precise for propositions with propositional quantifiers and beta
      identity. Contrast with F3 (M1) - M1 keeps classical truth, EX.FULL and DISJ.ONE but must
      refute BETA.ID; K1 keeps BETA.ID but gives up bivalence, EX.FULL and DISJ.ONE. Krämer's
      puzzle is escaped by EX.WEAK - in K1, ∃p p is an instance of itself and is not its own
      ground. LITERATURE - the position is Fine's (2010 sect. 8); Goodman 2023 sect. 4 (PDF pp.
      15-16) discusses "Kripke-inspired approaches" (Fine; Litland) and writes "I do not claim to
      have shown that there is no well-motivated consistent theory of the granularity of
      propositions ... within which a broadly Kripkean response to Krämer's puzzle is both
      formulable and attractive. But I am not aware of any such theory." INFERENCE, for review -
      K1 is a consistent granularity (propositions as syntactic terms, beta identity) in which
      the Kripkean response is formulable; it does not meet Goodman's setting, which is classical
      higher-order logic with Fritz's conjunct and instance principles for arbitrary properties
      (K1 is strong Kleene and has only definable comprehension, so Fritz's Cantorian argument,
      which needs C3s, does not apply). Whether it is attractive is philosophical. Korbmacher 2018a
      (read 2026-11-27) models partial ground by grounding trees over the standard model of
      positive truth for truth-free arithmetic sentences - classical, typed, first-order - so it
      is not a Kripke fixed point; Korbmacher 2018b (read in full 2026-11-28) builds on the ramified positive
      truth theory and names an untyped theory of ground 'in the spirit of the
      Kripke-Feferman theory of truth KF' as requiring 'the development of new
      methods' beyond its scope (p. 224). Lead, not read - Botticchio 2024, Type-free
      Predicational Theories of Ground (Utrecht MA thesis), which appears to build a
      K3/KF-style model of ground and truth; to be read before K1's position is called
      new. Litland 2015 (read 0.8.0) - appendix B (pp. 522-532) gives models of strict
      full immediate ground for Kripke's theory of truth with the strong Kleene and
      supervaluational schemes, untyped truth, first-order quantifiers in a free logic
      with an existence predicate, and ground defined from spanning forests of
      'grounding graphs' built in stages (sect. 8.5, pp. 516-517). That is prior art
      for Kripkean ground with untyped truth and full ground. K1 differs in having
      propositional quantifiers, beta identity and a fixed domain, and in defining
      ground by efficient premises rather than by deleting inferences; INFERENCE,
      not checked - neither construction is a special case of the other.
    limits: >-
      No self-reference (K1_no_liar: the gap is an atom, not a liar); quantifiers over a fixed
      domain without Fine's existence predicate (proposed.SK readings); bigconj is a gap; strict
      efficiency, not fn. 13's broadened notion. No finite model is claimed (F1 applies).
  - id: F12
    date: 2026-11-27
    status: checked; pending review (proposed 0.6.0-draft)
    claim: >-
      Under strong Kleene truth, DISJ.ONE is refuted twice without bivalence - (a) with C3d,
