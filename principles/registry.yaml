  - id: F18
    date: 2026-11-28
    status: theorems checked; the reading of the totality fact and the assessment of Woods's reply are pending review (0.7.0-draft)
    claim: >-
      On the reading below, Woods's reply to Objection 5 (p. 645) holds, but vacuously, in
      the reflexive case. Reading - a totality fact for a list is true at a world only if
      every fact at that world is on the list or is itself a totality fact; substituting
      B for a member of the list turns the totality fact into the totality fact for the
      modified list. Let c be a fact that is not a totality fact and is not on the
      modified list. Then at every world where c is a fact, the modified totality fact is
      false. If c is a fact at every world, as ∀p(p ∨ ¬p) is, the modified grounds are
      true at no world, so the clause of Woods's vacuity test for that substitution holds
      whatever grounds what - for the empty grounding relation as well.
    proof: >-
      isabelle/Woods_Models.thy Part 11 - totality_substitution_false,
      totality_reply_vacuous (any set of worlds, any world-relative truth predicate, any
      grounding relation), totality_one_world (one world, any true c). The hypotheses
      are jointly satisfiable - totality_example, totality_example_never.
    textual_basis: >-
      woods2018 p. 645, verified against page images (puzzles.irr_w_tests.source_reading).
      Woods describes TOTALITY as testifying that the listed facts are all the facts, and
      says the substitution returns a different totality fact. That a totality fact is
      true only where its list is complete is this registry's reading of "testifying";
      Woods does not state truth conditions for it.
    consequence: >-
      (1) The reply can be assessed without worlds in the signature and without a search.
      Giving ALL.TOT a rewritable totality fact in the one-world encoding would return a
      pass for the same reason (totality_one_world), so that extension is not
      informative. (2) The theorem uses nothing about universal quantification. On this
      reading any necessary truth c passes the vacuity test in any grounding claim whose
      grounds contain a totality fact for a list with c on it. FOR THE REVIEWER'S
      JUDGMENT - whether a pass of this kind fits Woods's gloss of vacuity (p. 640, any
      proposition would have done in its place) and his reason for the modal clause
      (fn. 27, a proposition should not pass because too few facts are available to take
      its place). Here no proposition can take the place of c, at any world. (3) For
      contingent members of the list the theorem says nothing; the modified grounds may
      be true at other worlds, and whether they ground the universal truth there is
      what Woods presumes.
    limits: >-
      (a) The hypothesis that c is not on the modified list is assumed, not derived. It
      is what one expects when propositions are structured, B is not c, and no other
      member becomes c under the substitution; it can fail if propositions are
      identified coarsely. (b) Fn. 37 says the reliance on a totality fact among the
      grounds can be avoided by grounding* facts; that route is not assessed. (c) Whether
      this observation is in the literature was not checked. NOVELTY - not claimed.

  - id: F19
    date: 2026-11-28
    status: theorems checked; the constraint, the choice of rules and the assessment of Woods's proposal are pending review (0.7.0-draft)
    claim: >-
      Requested by the reviewer 2026-11-28 - test Woods's proposal without totality facts.
      Where propositions are structured and grounds are only what the introduction and
      structural rules generate, IRR.W fails for the universal case and holds for the
      basic existential cases. Model MR - a proposition is an atom, a negation,
      conjunction, disjunction or truth ascription of propositions, or a quantified
      proposition; distinct constructions are distinct propositions; truth is classical;
      ground is the least relation closed under EX.FULL, ALL.INST, CONJ.BIN, DISJ.ONE,
      DISJ.BOTH, TR.FULL, TR.NEG, NEG.DN, NEG.DM, TRANS.CUT and AMALG.INF. MR satisfies the
      Krämer and Fine targets at full strength without any irreflexivity entry, with C3d
      and BETA.ID, at N5. In MR the truth U = ∀p(p ∨ ¬p) is among its own grounds - the
      instances of p ∨ ¬p ground U (ALL.INST), U grounds the instance U ∨ ¬U (DISJ.ONE),
      hence the other instances together with U ground U (TRANS.CUT) - and U does not
      occur there vacuously. So IRR.W fails in MR, as do IRR.MEM and IRR.F. Three
      reflexive facts with an existential conclusion are vacuous in MR - ∃p p (Krämer's
      case), ∃p Tp (something is true), and ∃p(p ∨ A) for any A (Woods's Objection 3,
      p. 643) - because any truth put for the existential grounds it by the rules.
    proof: >-
      isabelle/Rule_Generated.thy. MR_package - the entries and the levels (MR_N3 has an
      instance for each of the nine introduction entries; MR_levels). GR_universal -
      every rule-generated ground of U, and of U ∨ ¬U, contains U or U ∨ ¬U. den_UR,
      den_VR - a presentation that denotes U, or U ∨ ¬U, once another proposition is put
      for the marked variable either contains an unmarked occurrence of U, which the
      test excludes, or presents U ∨ ¬U without the mark, and U ∨ ¬U is not among the
      grounds. MR_not_vacuous - the test fails for every presentation, with an atom put
      for U. MR_not_IRR_W, MR_not_IRR_MEM, MR_not_IRR_F. MR_existential_vacuous.
    why_the_two_cases_differ: >-
      Put B for U in "the instances of p ∨ ¬p other than U ∨ ¬U, together with U". The
      result contains neither U nor U ∨ ¬U (the instance B ∨ ¬B was there already), so it
      is no longer the full set of instances, and ALL.INST needs every instance; the one
      rule that would supply U ∨ ¬U needs U. In the existential cases EX.FULL needs a
      single true instance, and any truth is one or grounds one. This is the reason
      Woods's own reply treats the two differently - it adds TOTALITY to the grounds of
      the universal truth (p. 645) and needs nothing of the kind for Objection 3
      (pp. 643-644). MR agrees with his verdict on Objection 3 and shows that for
      Objection 5 the verdict does not survive the removal of TOTALITY, when nothing
      else is added.
    relation_to_other_findings: >-
      The registry now has four models or arguments for the universal case under IRR.W.
      F18 - with a totality fact among the grounds the test is passed, vacuously, on the
      reading stated there. F15 - MV passes it because every non-empty set of truths
      grounds every true quantified proposition, grounds that no introduction rule
      delivers. F16 and F17 - MY and MX pass it because the propositions on the circle
      are identified. F19 - with none of these three, it fails. INFERENCE, not a
      theorem - a defence of IRR.W for the universal case must therefore take one of
      three routes, or a fourth that the registry does not represent; fn. 37 of woods2018
      (the totality assumption is avoidable by grounding* facts, in a manuscript not
      available here) may be such a fourth route and is not assessed.
    consequence: >-
      (1) The seven packages of puzzles.irr_w_tests are consistent (F15), but F19 shows
      that their consistency is not evidence that the rules of the puzzle are compatible
      with IRR.W by themselves - in the least model of those rules on structured
      propositions IRR.W is false. (2) The limit of decision D2 does not weaken this
      result. INFERENCE - the one-world test is weaker than Woods's modal test, since
      grounds that are true without grounding could be true without grounding; so a
      failure of the one-world test is a failure of his. D2 limits the positive results
      (F15), not this one. (3) FOR THE REVIEWER'S JUDGMENT - whether to adopt the
      constraint proposed.GEN.RULES, in what form, and whether "rule-generated" is a fair
      reading of the position Woods is replying to (Fine's and Krämer's principles as
      rules that give sufficient conditions, versus a closure claim that they give the
      only grounds; neither Fine nor Krämer is cited here for the closure claim).
    limits: >-
      (a) This is a result about one model, not a refutation of a package - IRR.W
      together with every entry of MR is consistent (MV). A package-level refutation
      needs the closure condition as an entry (proposed.GEN.RULES). (b) Choices made in
      building MR, each of which could be made otherwise - which rules generate grounds
      (the nine full-strength introduction entries, TRANS.CUT, AMALG.INF; CONJ.INF is
      left out; the partial entries follow from the full ones); quantified propositions
      are a bound variable, a formula and an environment, so propositions that differ
      only in the name of a bound variable are distinct; quantifiers range over truth
      values in the definition of truth, which agrees with ranging over propositions
      (ex_truth, all_truth); only functions defined by a formula are admissible (C3d).
      INFERENCE - C3s is not available with propositions this fine-grained, for the
      cardinality reason familiar from the Russell-Myhill argument; not checked here.
      (c) The test is the registry's reading of Woods's definition (p. 640) - every
      occurrence of the tested proposition in the presentation of the grounds is
      marked and replaced (the third clause of vacW). INFERENCE, not checked in
      Isabelle - without that clause the test would be passed trivially, by marking an
      occurrence of U inside one instance only. (d) The existential result covers three
      reflexive facts. Whether every reflexive fact of MR with an existential
      conclusion is vacuous is open. (e) Whether the observation is in the literature
      was not checked. NOVELTY - not claimed.

  - id: F20
    date: 2026-11-28
    status: checked; pending review (0.8.0-draft, D10)
    claim: >-
      The three targets that involve truth - P.FINE.PARTICULAR (both versions),
      P.FINE.UNIVERSAL and P.FINE.PARTICULAR.PROPS - are refuted without TS.FULL. Their
      0.3.2-0.7.0 packages were not minimal.
    proof: >-
      isabelle/Puzzle_Packages.thy - tr_true_FACT (FACT, TR_PART and T p give T (tr p)),
      something_true_trans_noTS, something_true_asym_noTS, fine_universal_noTS,
      fine_particular_props_noTS. The earlier proofs used TS_FULL only to infer T (tr q) from
      T q; TR.PART gives PG q (tr q), and the core clause FACT makes its conclusion true.
      For the caveat - isabelle/Korbmacher_Typed.thy, TR_PART_TI, TR_PART_A_iff,
      MK_TR_A, MK_truth_targets_source_form.
    consequence: >-
      Source - Korbmacher's Lemma 1 (korbmacher2018b p. 198, steps 3-4) gets Tr(Tr(0=0)) from
      0=0 ◁ Tr(0=0) by factivity (G3), not by a T-scheme. CAVEAT, added 0.8.0 after
      reading kramer2013 - the result depends on the antecedent of TR.PART. The registry
      states TR.PART with antecedent T p (reading 'antecedent' on TR.PART), and with FACT
      that entails truth introduction, T p ⟶ T (tr p) (TR_PART_TI), the half of TS.FULL
      the old proofs used. Fine's Propositional Grounding (fine2010 p. 101), Krämer's (A)
      ('If <p> is true then p ≺ <p> is true', which he combines with Truth-Introduction
      (TI) to reach (F2)) and Korbmacher's APT (korbmacher2018b p. 198) have the truth of
      the truth ascription as antecedent; Litland's Truth-grounding (litland2015 p. 488,
      from φ infer φ ≺ T⌜φ⌝, partial strict) has the registry's. With the sources' antecedent the three
      arguments need truth introduction and are blocked without it - model MK satisfies
      that form of the principle for every proposition together with the other entries
      of the three targets, and fails TS.FULL (MK_truth_targets_source_form, MK_TR_A,
      isabelle/Korbmacher_Typed.thy). So the accurate statement is that TS.FULL is
      redundant given the registry's TR.PART, which already does the work of truth
      introduction. Korbmacher's Lemma 1 needs a T-scheme only for the truth-free 0=0,
      because in a predicational theory factivity yields the truth ascriptions of
      grounded sentences. F9 is unaffected - its
      models satisfy TS.FULL, so they also model the smaller packages' typed variants. Every
      refutation proved for the old packages still holds; only the targets' listed packages
      shrink. INTERACTION - the IRR.W tests (puzzles.irr_w_tests, 0.7.0-draft) copy the
      0.6.0-draft truth-target packages, which contain TS.FULL; they remain correct for
      those packages, and their models carry over to the reduced targets (packages_as_of).
  - id: F21
    date: 2026-11-28
    status: checked; pending review (0.8.0-draft, D10)
    claim: >-
      The falsity version of "something is true" - "not everything is true", with the
      untyped falsity clause TR.NEG and the negated-universal rule NEG.ALL - is refuted:
      [W.TR, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, TR.NEG, NEG.ALL, TRANS.P, IRR.F]
      (target P.KORBMACHER.APF).
    proof: isabelle/Puzzle_Packages.thy, korbmacher_apf_W (derivation under the target). FACT is not used.
    consequence: >-
      Korbmacher states APF and leaves the analogous derivation to the reader
      (korbmacher2018b p. 199); this is one reconstruction of it, FLAGGED as the project's.
      NEG.ALL is his U9 (p. 205, ∀x∀t∀v(Tr_β(¬x(t/v)) → ¬x(t/v) ◁ ¬∀vx)) and Fine's ¬∀I
      (fine2012a p. 63), read as full ground. LIMIT - F9's typing of TR.PART does not reach
      this argument, which runs through TR.NEG; the registry has no typed TR.NEG, so whether
      F9's strategy extends to falsity is open.
  - id: F22
    date: 2026-11-28
    status: checked; pending review (0.8.0-draft, D10)
    claim: >-
      Korbmacher's typed solution, transcribed into the registry at two levels, is
      consistent at N5 with full ground, impredicative propositional quantification and
      BETA.ID - model MK of [W.TR, W.TEM, BETA.ID, CL.PROP, CL.QUANT, TS.TYPED, TS.T3,
      TR.TYPED, EX.FULL, ALL.INST, DISJ.ONE, NEG.DN, CONJ.BIN, TRANS.P, IRR.F, ASYM.P]
      (target P.KORBMACHER.2018B.TYPED). TS.FULL and TR.PART fail in MK. TS.T3 is
      inconsistent with TS.FULL given CL.QUANT, BETA.ID and LAM_CORE, and it forces a grain:
      no true proposition denoted by a closed truth-free formula is denoted by a closed
      formula that is not truth-free.
    proof: >-
      isabelle/Korbmacher_Typed.thy - MK_package, MK_N3, MK_N4s, MK_fails; TS_T3_not_FULL;
      TS_T3_grain. MK is model MU (F9) with two changes - a truth ascription is true only of
      a true proposition of the lower tier, and a non-empty set of truths fully grounds
      every truth of higher rank. NEG.DN and CONJ.BIN are restated in the locale with
      faithfulness lemmas (K_faithful_korb).
    consequence: >-
      Korbmacher's consistency result (Cor. 3, korbmacher2018b p. 213) is for a first-order
      theory of partial ground; MK shows that the registry's version of his strategy also
      survives propositional quantification, BETA.ID and full ground, which his proof does
      not cover. In MK "something is true" is not grounded in its own truth ascription,
      which is untrue (MK_blocks). In the sources' form of the Aristotelian principle,
      with the truth of the truth ascription as antecedent, MK satisfies it for every
      proposition (MK_TR_A) - the transcription keeps APT^1 unrestricted, as Korbmacher
      does, and gives up truth introduction for propositions that are not truth-free.
      COST - the untruth of a truth ascription helps ground a
      truth - with s the universal closure of f_tem, neg (tr s) grounds tr s ∨ ¬tr s, which
      grounds s (MK_neg_tr_grounds). Fine 2010 p. 104 rejects that in his principle (*).
      INFERENCE, not checked - Korbmacher's own standard model (p. 214) appears to share the
      feature, through his upward ∨ and ∀ axioms (p. 205) at the instance ⌜s⌝ of
      ∀x(Tr_1(x) ∨ ¬Tr_1(x)), so it is a cost of T3 and not of the transcription. LIMITS -
      one model; one truth operator, so the Aristotelian principle above level 1 and the
      downward axioms are not expressed; the grain result means any model of TS.T3 with
      TS.TYPED separates truth-free from semantic presentations of truths.
  - id: F23
    date: 2026-11-28
    status: inference; pending review (0.8.0-draft, D10)
    claim: >-
      F9 (MT, MU) and Korbmacher's typed theory are different solutions to Fine's puzzles,
      and neither result implies the other. F9 keeps the untyped truth schema and gives up
      the Aristotelian principle for semantic propositions; Korbmacher keeps the
      Aristotelian principle at every level and gives up the untyped truth schema (T3).
    proof: >-
      Comparison, not a theorem. Machine-checked parts - MU satisfies TS.FULL and fails
      TR.PART (MU_package, MU_not_TR_PART); MK satisfies TS.T3 and fails TS.FULL (MK_package,
      MK_fails); TS.T3 and TS.FULL are jointly inconsistent given CL.QUANT, BETA.ID and
      LAM_CORE (TS_T3_not_FULL); MK satisfies the Aristotelian principle with the sources'
      antecedent for every proposition (MK_TR_A). Textual parts - korbmacher2018b pp. 204, 207, 224.
    consequence: >-
      Recorded in F9's COMPARISON and NOVELTY text. The registry's TS chain had no entry for
      Korbmacher's position; TS.T3 supplies it, outside the chain. Report -
      docs/korbmacher-2018b.md.
  - id: F24
    date: 2026-11-28
    status: checked; pending review (0.8.0-draft, D11)
    claim: >-
      (a) Donaldson's puzzle of property grounding, transcribed, is refuted -
      [W.EM, BETA.GROUND, CL.PROP, CL.QUANT, ALL.PART, DISJ.PART, TRANS.P, IRR.F] (target
      P.DONALDSON.SP). (b) With the Aristotelian principle in the sources' form (TR.PART.A),
      each of the three truth targets is refuted with TS.FULL and has a model without it.
    proof: >-
      isabelle/Puzzle_Packages.thy - donaldson_sp_W; TR_PART_A_TS_FULL, something_true_trans_A,
      something_true_asym_A, fine_universal_A, fine_particular_props_A.
      isabelle/Korbmacher_Typed.thy - MK_TR_A, MK_truth_targets_source_form, with the
      faithfulness lemma K_faithful_korb for TR_PART_A.
    consequence: >-
      (a) The sentence-position universal argument survives the move from BETA.ID to
      BETA.GROUND - where predication grounds, the λ step replaces identity in the circle.
      F9's typing of TR does not touch it, as it does not touch P.FINE.UNIVERSAL.SP. (b)
      What the truth targets need of truth is either the registry's TR.PART, which with
      FACT supplies truth introduction, or the sources' TR.PART.A together with truth
      introduction (TS.FULL); this turns the F20 caveat into a result about registry
      packages. LIMITS - (a) is a reconstruction (see the target's note); (b) the models
      without TS.FULL are one model, MK, in which truth ascriptions to propositions that
      are not truth-free are untrue. NOVELTY - (a) not claimed, it is Donaldson's
      argument in transcription; (b) not claimed, an observation about the encoding.

