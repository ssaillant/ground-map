          (∀a. T (app f a)) ⟶ G (inst f) (all f)
        sources:
          - work: correia2014
            locator: rule (∀1), ms p. 13–14
            check: manuscript
            quote: null
            note: (∀1) takes all instances for "all the constants of the language"; Correia calls it problematic for classically valid rules.
          - work: fine2010
            locator: p. 100, Universal Grounding
            check: published-page
            quote: "∀x A(x), E(y)/A(y) ≺∀x A(x)"
            note: partial ground of each instance, so strictly a source for ALL.PART (0.3.0). On p. 109 Fine takes all the instances to be a full ground "relative to certain presuppositions" (that the objects listed are all there are), which is the reading ALL.INST encodes; he also rejects a weak universal rule, since a universal truth cannot be grounded "by some of its instances to the exclusion of the others" (p. 109).
          - work: fine2012a
            locator: p. 59 (CUP), rule ∀I
            check: published-page
            quote: "∀I. B(a1), B(a2), . . . < ∀xB(x)"
            note: ADDED 0.3.0 (audit). Read from the page image. Strict full ground by all the instances; the direct source for this entry.
        readings:
          - point: substitutional (Correia) versus objectual instances
            chosen: "objectual - all values app f a for every a of type prop"
            alternatives: ['instances for named constants only']
            why: matches the base-type quantifier.
      - id: ALL.TOT
        name: Instances plus a totality fact
        statement: |
          (∀a. T (app f a)) ⟶ T (tot f) ∧ G (insert (tot f) (inst f)) (all f)
        sources:
          - work: woods2018
            locator: p. 645, Obj. 5
            check: published-page
            quote: "TOTALITY, A0, A1,...< ∀p p ∨ ¬p"
          - work: fine2012a
            locator: pp. 61–62 (CUP)
            check: published-page
            quote: "the “totality” claim that a1, a2, . . . are all of the individuals that there are"
            note: p. 61. Fine distinguishes the totality claim from the corresponding universal claim and takes it in the weak sense "at most" (p. 62); Fritz cites pp. 60–62 for the "that's all" ground (fritz2022 p. 305).
        readings:
          - point: what the totality fact says
            chosen: an opaque constant tot f, required true whenever all instances are
            alternatives: ['tot f = "a, b, ... are all the propositions" with its own grounds']
            why: v1 does not model the content of totality facts.
          - point: FLAGGED 0.3.0 (audit) - consequence for Woods
            chosen: tot f stays opaque
            alternatives: ['a totality fact with structure, so that substitution can act on it']
            why: Woods's reply to his Objection 5 rewrites the totality fact under substitution (p. 645). With an opaque constant that reply cannot be reproduced, so results that combine ALL.TOT with IRR.W do not test Woods's treatment of universal cases (INFERENCE).

  # 13 -----------------------------------------------------------------------
  - id: TR
    name: Grounding of truth ascriptions (Aristotelian principle)
    order: chain
    entries:
      - id: TR.TYPED
        rank: 1
        name: Typed Aristotelian principle
        statement: |
          tfree a ∧ fv a = {} ∧ T (den v a) ⟶ G {den v a} (tr (den v a))      (* D3, D5: closed formulas *)
        sources:
          - work: korbmacher2018b
            locator: p. 207, Def. 2, APU_T^γ
            check: published-page
            quote: "∀x(Trγ(x) → x ◁ Tr.γ(ẋ))"
            note: CHECKED 0.8.0 (D10) on the page image. Tr.γ (underdot) is the function symbol for the truth ascription.
        readings:
          - point: hierarchy depth
            chosen: two levels, as for TS.TYPED
            alternatives: ['every level γ < α, as in Korbmacher (needs an indexed tr)']
            why: >-
              see TS.TYPED. Korbmacher says two levels suffice for the solution - "We
              could already have stopped at level two ... the theory PGA2 is consistent
              and proves the following simple version of the typed Aristotelian
              principle for truth - ∀x(Tr1(x) → x ◁ Tr.1(ẋ))" (p. 223). His theory
              also has the principle at every higher level, which one tr cannot state
              (reading on TS.T3).
          - point: which formulas the principle covers (D5)
            chosen: closed truth-free formulas (fv a = {})
            alternatives: ['every truth-free formula under every environment - the 0.2.x statement, equivalent to TR.FULL (finding F5)']
            why: as for TS.TYPED. Separated from TR.FULL by the model MG.
          - point: FLAGGED 0.3.0 (audit) - full versus partial
            chosen: full ground {p}
            alternatives: ['partial, as in Korbmacher, whose ◁ is partial ground']
            why: uniformity with TR.FULL. The entry is stronger than its only source.
      - id: TR.FULL
        rank: 2
        name: Aristotelian principle
        statement: |
          T p ⟶ G {p} (tr p)
        sources:
          - work: kramer2013
            locator: section on the Finean counterpart
            check: manuscript
            quote: "If <p> is true then p < <p> is true"
            note: Krämer's (A), "often associated with Aristotle". His "<" is partial ground (his fn. 4), so strictly a source for TR.PART (0.3.0).
          - work: lovett2020
            locator: p. 2544, rule T-I
            check: published-page
            quote: "A < T⟨A⟩"
            note: ADDED 0.3.0 (audit). Read from the page image. Lovett's < is strict full ground and the rule has no premise (non-factive); the direct source for the full reading.
        readings:
          - point: antecedent T p versus T (tr p)
            chosen: T p (with TS the two coincide)
            alternatives: ['T (tr p)']
            why: makes TR independent of TS for the map.
          - point: FLAGGED 0.3.0 (audit) - full versus partial
            chosen: full ground {p}
            alternatives: ['partial - now the separate entry TR.PART']
            why: Lovett's T-I is a full-ground rule. Krämer's (A) and Fine's Propositional Grounding (fine2010 p. 101) are partial; the puzzles need only the partial rule and are now stated with TR.PART.
      - id: TR.NEG
        rank: 3
        name: Aristotelian principle with the falsity clause
        statement: |
          T (neg p) ⟶ G {neg p} (neg (tr p))
        sources:
          - work: korbmacher2018b
            locator: p. 207, Def. 2, APU_F^γ
            check: published-page
            quote: "∀x(Trγ(¬.x) → ¬.x ◁ ¬.Tr.γ(ẋ))"
            note: CHECKED 0.8.0 (D10) on the page image.
        readings:
          - point: typed versus untyped
            chosen: untyped
            alternatives: ['typed falsity clause, as in the source']
            why: the typed falsity clause is a v1.1 candidate. CORRECTED 0.3.0 (D5) - this note said the clause is "added on top of TR.FULL". TR.NEG is standalone and does not include TR.FULL; a package that wants the full Aristotelian principle selects both.
          - point: FLAGGED 0.3.0 (audit) - full versus partial
            chosen: full ground {neg p}
            alternatives: ['partial, as in Korbmacher, whose ◁ is partial ground']
            why: uniformity with TR.FULL. The entry is stronger than its source in this respect and weaker in being untyped.
      - id: TR.PART
        rank: 0
        name: Propositional grounding (partial)
        added: 0.3.0-draft (D5); reviewed 2026-11-27 (see D5 `reviewed`)
        statement: |
          T p ⟶ PG p (tr p)
        sources:
          - work: fine2010
            locator: p. 101, Propositional Grounding
            check: published-page
            quote: "T ( p), p = |A|/A ≺ T ( p)"
            note: Fine's ≺ is partial ground (p. 99). His premise is T(p), not A.
          - work: kramer2013
            locator: section on the Finean counterpart
            check: manuscript
            quote: "If <p> is true then p < <p> is true"
            note: Krämer's (A). His "<" is partial ground (his fn. 4).
          - work: litland2015
            locator: p. 488, Figure 1 (Principles of full ground), Truth-grounding
            check: published-page
            quote: "φ / φ ≺ T⌜φ⌝"
            note: 'Added 0.8.0, read from the page image. ≺ is partial strict ground and < strict full ground (p. 484). The premise is φ, as in this entry, and his T applies to sentences. P. 494 fn. 30 - "I am not claiming that its being the case that φ is a full ground for T⌜φ⌝"; in appendix B he nevertheless models it as strict full immediate ground (p. 522 fn. 73, "pretty clearly incorrect, unless one assumes a strongly deflationary conception of truth").'
        readings:
          - point: antecedent
            chosen: T p, as in TR.FULL
            alternatives: ['T (tr p), as in Fine and Krämer - now the separate entry TR.PART.A (D11)']
            why: keeps TR independent of TS; under TS.FULL the two coincide. Implied by TR.FULL (TR_FULL_PART).
            note_0_8_0: 'The choice matters once TS.FULL is dropped - with FACT, the T p antecedent entails truth introduction (TR_PART_TI), and the truth targets without TS.FULL are refuted with it but modelled with the sources'' antecedent (MK_truth_targets_source_form; finding F20). Litland''s Truth-grounding (litland2015 p. 488, Figure 1, "φ / φ ≺ T⌜φ⌝", partial strict ground) has the registry''s antecedent; Fine, Krämer and Korbmacher have the other. The sources'' form is the entry TR.PART.A since D11.'
      - id: TR.PART.A
        rank: standalone
        name: Propositional grounding (partial), with the sources' antecedent
        added: 0.8.0-draft (D11)
        statement: |
          T (tr p) ⟶ PG p (tr p)
        sources:
          - work: fine2010
            locator: p. 101, Propositional Grounding
            check: published-page
            quote: "T ( p), p = |A|/A ≺ T ( p)"
            note: same source as TR.PART; the premise T(p) is the truth ascription (see the note there).
          - work: kramer2013
            locator: section on the Finean counterpart, (A)
            check: manuscript
            quote: "If <p> is true then p < <p> is true"
            note: Krämer reaches the antecedent (F2) by Truth-Introduction (TI). His "<" is "≺", partial ground (fn. 4).
          - work: korbmacher2018b
            locator: p. 198 (APT, Lemma 1) and p. 207 (APU_T^γ)
            check: published-page
            quote: "∀x(Tr(x) → x ◁ Tr(ẋ))"
            note: APT as stated for Lemma 1 (p. 198), read from the page image; APU_T^γ (p. 207) is the typed version, with Tr_γ.
        readings:
          - point: relation to TR.PART
            chosen: standalone
            alternatives: ['replace TR.PART by TR.PART.A in the targets']
            why: 'TR.PART (antecedent T p) with FACT entails truth introduction (TR_PART_TI); TR.PART.A does not. Under TS.FULL the two coincide (TR_PART_A_TS_FULL). The truth targets keep TR.PART and record the TR.PART.A version as source_form_variant (D11), so the earlier results stay comparable.'
          - point: full versus partial
            chosen: partial
            alternatives: ['a full-ground version, the analogue of TR.FULL']
            why: all three sources state partial ground. MK satisfies the full version as well (MK_TR_A).

