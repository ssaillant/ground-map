      open: 'Fritz''s positive claim, that (EQ) without beta-conversion or beta-grounding is not inconsistent "without more substantial additional assumptions", is a consistency target for step 4 ([C3s, CL.QUANT, EX.FULL, IRR.F] plus N1); his (T1)/(T2) and recovery principles (FR) have no registry entries yet.'
    - id: P.ELGIN.IDENTITY
      source: elgin2026 (a = b partially grounds itself)
      status: not read in this thread

# ---------------------------------------------------------------------------
# Findings that bear on the search (step 4)
# ---------------------------------------------------------------------------
findings:
  - id: F1
    date: 2026-11-27
    claim: No package containing CL.PROP, TRANS.P and IRR.F together with any of CONJ.BIN, DISJ.ONE or TR.FULL (+ TS.FULL) has a finite model.
    proof: isabelle/No_Finite_Models.thy (chain_no_finite; no_finite_model_conj, _disj, _tr). The chain p, s p, s (s p), ... of truths, with s = λp. conj p p, disj p p or tr p, must repeat in a finite domain, and transitivity then gives PG x x.
    consequence: Nitpick can certify models only for packages that drop transitivity, irreflexivity or every such "successor" rule. Most packages of interest need infinite-model certificates (for example term models built in Isabelle), which the brief's classification "finite-model" does not cover. DECIDED (D4, 2026-11-27) - add the class "infinite-model", certified by a model constructed in Isabelle.
    status: checked
  - id: F2
    date: 2026-11-27
    claim: IMM.FRITZ7 (with FACT) has no finite model, though it has an infinite one; so no package containing it has a finite model.
    proof: isabelle/Model_Certificates.thy (imm_fritz7_no_finite_model, imm_fritz7_prp_infinite; infinite model ME). Only (∧1), (∧2) and (nt) are used. By (∧1) and (∧2) the immediate partial grounds of conj p q are exactly p and q whenever both are true, so the one- and two-element sets of truths inject into the truths; (nt) excludes a single truth.
    consequence: Nitpick cannot find a model of any package containing IMM.FRITZ7. Such packages need infinite-model certificates. The infinite model MF satisfies IMM.FRITZ7 with CL.PROP, CL.QUANT and TS.FULL (MF_classical) but has a single propositional function, so it fails C3s; with C3s the package is P.FRITZ.MAIN, refuted. Literature check (2026-11-27) - fritz2022 pp. 304-310 and 327-329 read; p. 308 derives 'at least two truths' from (nt) and (∧1) but no finite-model statement was found; p. 310 says the conjunct principle 'is consistent on its own' and defers to Fritz, Operands and instances (RSL 16, 2023), whose consistency model (Def. 17, Lemma 18, p. 199) is built on an infinite set, with no statement found that finite models are excluded (pp. 188-201 read verbatim, the rest not checked). INFERENCE - F2 is an elementary consequence that the literature appears to take for granted; it is not a candidate novel result.
    status: checked
  - id: F3
    date: 2026-11-27
    claim: "The package FACT, LAM_CORE, C3d, CL.PROP, CL.QUANT, TS.FULL, IRR.F, ASYM.P, TRANS.P, TRANS.CUT, AMALG.INF, EMPTY.NONE, CONJ.BIN, CONJ.GRAIN, DISJ.ONE, DISJ.BOTH, NEG.DN, NEG.DM, EX.FULL, ALL.INST, TR.FULL, TR.NEG is consistent at non-triviality N5: N1, N2, N3 (an instance for each of its nine introduction entries), N4 (CL.PROP holds; a distinct pair p, neg (neg p) with different full grounds) and a four-step chain of partial ground. N3 and N4 were added 2026-11-27 after the levels were made cumulative; before that the record claimed N5 with only N1, N2 and the chain proved. It has no finite model (F1), and it has an infinite one."
    proof: "isabelle/Models.thy (M1_package, M1_N3, M1_N4_pairs; fidelity lemmas link the restated principles to Principles.thy). M1 is a term model. Propositions are closed terms; application of a propositional function is a constructor of its own (PApp), true iff the body is true under the assignment, and it depends on nothing. Ground is the least relation closed under the package's introduction principles, cut and amalgamation (defined as the intersection of all closed relations), and every ground is shown to be a non-empty set of truths on which the grounded truth depends (gr_sound); dependence strictly raises a rank, which gives IRR.F and ASYM.P. M1 refutes BETA.ID (M1_not_BETA_ID) and BETA.GROUND (M1_app_ungrounded: no instance has a ground)."
    consequence: "Weaker packages (by the implications in Order.thy, e.g. IRR.W, IRR.MEM, ASYM.ANTI, AMALG.FIN, TS.TYPED, TR.TYPED, EX.LEV, EX.PRED) are consistent too. Falsifiers - adding BETA.ID or BETA.GROUND refutes the package (Kramer 2013; Fritz 2020, checked in Fritz2020_Checks.thy); so does any admissible function that applies as negation does (F4). LITERATURE - not new as a consistency result: Goodman 2023 sec. 2 (PDF pp. 5-10) develops Fritz 2020's suggestion (application of lambda-defined properties obliterates structure) into a consistent classical theory with transitive ground, true generalizations grounded in their true instances, and models in appendices A-B. What M1 adds - a machine-checked certificate for this registry's package, including the truth predicate (TR.FULL, TR.NEG, TS.FULL) and structure-contributing negation (NEG.DN, NEG.DM). INFERENCE, to check against Goodman's appendix A - in his section 2 theory negation yields mere truth conditions (PDF p. 7), so NEG.DN fails there and M1 is not a sub-case of it. M1 does not model Fritz's T1/T2 (truth ascriptions grounding structured truths) or his recoverability principle FR."
    status: checked
  - id: F4
    date: 2026-11-27
    claim: "CL.PROP, CL.QUANT, EX.FULL, NEG.DN and ASYM.P are jointly inconsistent once some admissible propositional function f applies as negation (app f p = neg p for all p). Neither FACT nor N1 is needed."
    proof: "isabelle/Models.thy (neg_as_function_refutes). Let E = exq f; E is true; its instance at neg E is neg (neg E), which grounds E by EX.FULL and is grounded in E by NEG.DN."
    consequence: "This is Goodman's negation variant of Kramer's puzzle (Goodman 2023, PDF p. 7), mechanized here; it is his objection to Fritz's form of the escape. It states the hidden premise of F3 - M1 escapes only because the signature has no propositional-function constant for negation (every application is a PApp term). A registry entry asserting such a function would make the F3 package refutable."
    status: checked

  - id: F5
    date: 2026-11-27
    claim: "Under registry 0.2.x the restricted entries EX.PRED, TS.TYPED and TR.TYPED were equivalent to EX.FULL, TS.FULL and TR.FULL, and EX.LEV gave EX.FULL for every admissible lam-term. Under 0.3.0, where they quantify over closed formulas, all four are strictly weaker: a classical finite model satisfies the four together and fails the three unrestricted entries."
    proof: "isabelle/Audit_Checks.thy for the collapse of the 0.2.x definitions, kept there as copies (EX_PRED_v021_iff_FULL, TS_TYPED_v021_iff_FULL, TR_TYPED_v021_iff_FULL, EX_LEV_v021_FULL, kramer_not_blocked_v021). isabelle/Restricted_Models.thy for the separation (MG_package, MG_N3, MG_N4). MG has ten propositions, a truth value paired with one of five ranks, and every function on them as a propositional function; a truth grounds each truth of higher rank. It satisfies FACT, LAM.T, LAM.ENV, C1, BETA.ID, CL.PROP, CL.QUANT, TS.TYPED, TR.TYPED, EX.PRED, EX.LEV, IRR.F, ASYM.P and TRANS.P, with N1, N2, N3 instances for the EX and TR entries, one N4 pair (p and its double negation) and a four-step chain."
    consequence: "Krämer's own escape route now escapes: his package with EX.PRED or EX.LEV in place of the unrestricted existential principle is consistent, and so is the 'something is true' package with EX, TS and TR all restricted. Search rows and certificates issued under 0.2.x for the four entries were results about the unrestricted principles. The affected search rows were recomputed (17 rows, all still unknown to the automatic search). The four singleton certificates in results/isabelle_models.jsonl stand for the 0.3.0 statements, since the 0.2.x statements imply them (v021_implies_repaired) and the theory is rebuilt against the new definitions. LIMITS - MG is one model and has no ALL, DISJ, CONJ or NEG grounding; C2 and the parameters of EX.LEV keep unrestricted environments (flagged on those entries)."
    status: checked
  - id: F6
    date: 2026-11-27
    claim: "CL.QUANT alone yields a truth. Three of the five packages that 0.2.x classed trivial-only are refuted outright; the other two are consistent, but only in models with no grounding fact."
    proof: "isabelle/Order.thy (CL_QUANT_truth): either every satisfier of f is true, and then bigconj f is, or some satisfier p is untrue, and then app f p is true. Refuted outright - [BETA.ID, C1, CL.QUANT, EX.FULL, IRR.F], which is Krämer's target as 0.2.x listed it (kramer_package_full); [CL.QUANT, DISJ.WEAK, ID.AC, IRR.F] (quant_disjweak_idac_irr; a truth p equals disj p p, which DISJ.WEAK makes p ground); [CL.QUANT, IRR.F, NEG.DN, TR.NEG, TS.ID] (quant_negdn_trneg_tsid_irr; under TS.ID the falsity clause at neg p makes neg (neg p) ground itself). All three in isabelle/Puzzle_Packages.thy; the search found the same refutations after the repair and they are replayed in isabelle/Results_Refutations.thy. Refuted at N1 with a verified model at N0 - [ASYM.P, EMPTY.NONE, ID.DN, NEG.DN, TRANS.CUT] and [CONJ.GRAIN, DISJ.BOTH, DISJ.WEAK, EMPTY.NONE, EX.FULL, ID.DN, IRR.F, NEG.DN, TR.FULL, TRANS.CUT] (results/models_verified.jsonl, level N0)."
    consequence: "The class trivial-only is renamed refuted-at-N1. It reports what was proved (the package with N1 is refuted) and claims consistency only together with a re-verified model in which nothing grounds anything. The 0.2.x gloss, 'consistent only in models where nothing grounds anything', was a consistency claim resting on a failed proof search (audit finding A3). Whether CL.QUANT should supply a truth is flagged as a reading on CL.QUANT."
    status: checked
  - id: F7
    date: 2026-11-27
    claim: "The sentence-position universal package as registry 0.2.x listed it, FACT, LAM.T, LAM.ENV, C1, BETA.ID, CL.QUANT, ALL.INST, DISJ.ONE, TRANS.P and IRR.F without CL.PROP, is consistent. It has no finite model. With excluded middle added it is refuted."
    proof: "isabelle/Separation_Models.thy (MS_package, MS_core, MS_N3, MS_N4; sp_package_no_finite_model) and isabelle/Puzzle_Packages.thy (fine_universal_sp_em). In MS a proposition is a truth value with a natural-number rank; conjunction and disjunction are classical and raise the rank; a truth fully grounds every truth of higher rank; negation is classical except that the negation of the false proposition of rank 0 is false. So excluded middle fails at one proposition, CL.PROP fails, and the universal closure of f_em is false (MS_f_em_false). MS also satisfies ASYM.P, with N1, N2, N3 instances for DISJ.ONE and ALL.INST, an N4 pair and a four-step chain. No finite model - FACT, CL.QUANT, DISJ.ONE, TRANS.P and IRR.F give an unending chain t, t ∨ t, ... of distinct truths (the argument of F1, with factivity in place of CL.PROP)."
    consequence: "The 0.2.x listing omitted a premise of the argument, and the CL.PROP added to P.FINE.UNIVERSAL.SP in 0.3.0 is required. The model is no escape from the puzzle: it is consistent because it denies the logical truth the argument is about, and ALL.INST is exercised in it only by f_tem. LIMITS - MS is one model, with a negation that is non-classical at a single point by stipulation; it was not checked against any CONJ, NEG, EX or TR entry."
    status: checked
  - id: F8
    date: 2026-11-27
    claim: "Each published puzzle among the targets uses exactly one of the four C1 witnesses - Krämer's f_id, 'something is true' f_tr, Fine's universal and particular arguments for propositions f_tem, the sentence-position universal argument f_em. C1 admits the four together. So, as packages, both particular puzzles contain Krämer's package, and Fine's universal package contains the sentence-position package and is refuted whatever truth entries it lists, TS.TYPED and TR.TYPED included."
    proof: "isabelle/Puzzle_Packages.thy - kramer_witness, something_true_trans_witness, something_true_asym_witness, fine_universal_witness, fine_particular_props_witness, fine_universal_sp_witness (each assumes adm of one witness, not C1); fine_universal_typed_refuted. The containments are read off the package lists."
    consequence: "Under the present COMP entries the map classifies the puzzle packages correctly and cannot say what one puzzle needs beyond another: which principles Fine's particular arguments need that Krämer's does not, or whether typing truth blocks Fine's universal argument once f_em is not admissible. Both questions need comprehension entries weaker than C1, for example one per witness. SETTLED by a model - model MT (isabelle/Separation_Models.thy; MT_package, MT_N3, MT_N4, MT_not_TR_PART). In MT the admissible functions are f_id, f_tr and f_tem, and f_em is not admissible. BETA.ID, CL.PROP, CL.QUANT, TS.FULL, TS.TYPED, TR.TYPED, ALL.INST, ALL.PART, DISJ.ONE, DISJ.PART, TRANS.P, IRR.F and ASYM.P hold together, with N1, N2, N3 instances for the DISJ, ALL and TR entries, an N4 pair and a four-step chain. TR.PART fails at the universal closure of f_tem, which is true and does not ground its own truth ascription. So typing the grounding of truth ascriptions blocks Fine's own route once f_em is not admissible, and the truth schema can stay unrestricted. In 0.3.1 MT's comprehension clause (C1 without f_em) was not a registry entry. Since 0.3.2 (D9) the result is a registry package with the witness entries W.ID, W.TR and W.TEM (finding F9). LIMITS - one model; its propositional functions are closures (a variable, a formula and an environment), not functions on propositions; the rank of a quantified proposition is fixed by whether its body is truth-free, which is a stipulation of the model; ranks have two tiers (ω + n); no EX, CONJ or NEG entry was checked."
    status: checked
  - id: F9
    date: 2026-11-28
    claim: "With TR.TYPED in place of TR.PART, each of the three targets that involve truth is consistent: 'something is true' (P.FINE.PARTICULAR, in both versions), Fine's universal argument for propositions (P.FINE.UNIVERSAL) and his particular argument for propositions (P.FINE.PARTICULAR.PROPS). The truth schema stays unrestricted (TS.FULL), and so do the existential and universal entries (EX.FULL, ALL.INST). Two packages have models - [W.ID, W.TR, W.TEM, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, TS.TYPED, TR.TYPED, ALL.INST, ALL.PART, DISJ.ONE, DISJ.PART, TRANS.P, IRR.F, ASYM.P] (model MT) and [W.TR, W.TEM, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, TS.TYPED, TR.TYPED, EX.FULL, EX.PART, ALL.INST, ALL.PART, DISJ.ONE, DISJ.PART, TRANS.P, IRR.F, ASYM.P] (model MU). The three variants are sub-packages of the second."
    proof: "isabelle/Separation_Models.thy - MT_package, MT_W, MT_N3, MT_N4, MT_not_TR_PART; MU_package, MU_N3, MU_N4, MU_not_TR_PART. Both models have N1, N2, N3 instances for their DISJ, ALL, TR and (in MU) EX entries, an N4 pair and a four-step chain. A proposition is a truth value with a rank in one of two tiers; a truth ascription has the lowest rank of the upper tier; an existential or universal proposition has upper-tier rank exactly when its body is not truth-free; a truth grounds every truth of higher rank. In MU 'something is true' is grounded in its own truth ascription, which is one of its instances, and does not ground that ascription (MU_not_TR_PART)."
    consequence: "What Fine's arguments need beyond Krämer's is the untyped grounding of truth ascriptions: TR.PART applied to a quantified truth whose body contains the truth predicate. Typing that one principle blocks the three arguments, and typing the truth schema is not needed. Krämer's puzzle and the sentence-position universal puzzle mention no truth entry and are untouched: adding W.ID to the second package refutes it (kramer_W), and adding W.EM refutes both (fine_universal_sp_W). So W.ID is compatible with the typed packages only in the absence of an unrestricted existential entry, and W.EM only in the absence of ALL.PART or DISJ.PART. LIMITS - two models of one construction; their propositional functions are closures (a variable, a formula and an environment), not functions on propositions; the rank of a quantified proposition is fixed by the syntax of its body, a stipulation of the models; no CONJ or NEG grounding entry was checked. NOVELTY - not assessed. Typing the truth predicate in the grounding of truth ascriptions is the approach of the registry's source for TR.TYPED (korbmacher2018b, read in fragments); that work's own consistency results were not compared with these models."
    status: checked

