            why: as for the other NEG entries; rank 3 is a label.

  # 11 -----------------------------------------------------------------------
  - id: EX
    name: Existential grounding
    order: chain
    entries:
      - id: EX.PRED
        rank: 1
        name: Predicative existential grounding (instance free of quantifiers)
        statement: |
          lvl a = 0 ∧ fv a = {} ∧ T (app f (den w a)) ⟶ G {app f (den w a)} (ex f)      (* D3, D5; adm f *)
        sources:
          - work: kramer2013
            locator: section "Can we give reasons to reject (X)"
            check: manuscript
            quote: "restricts (EG-S) to cases in which α is free of sentential quantifiers"
          - work: woods2018
            locator: p. 635
            check: published-page
            quote: "if A is free for p in the predicative fact ϕ(A), then ϕ(A) < ∃p(ϕ(p))"
        readings:
          - point: what must be quantifier-free
            chosen: the instance, presented by a quantifier-free formula a (Krämer's α)
            alternatives: ['the whole instance φ(a) (Woods''s "predicative fact ϕ(A)")']
            why: Krämer's wording is explicit; Woods's is the stronger restriction and is a mutation candidate.
          - point: which formulas count as quantifier-free instances (D5)
            chosen: closed formulas of level 0 (fv a = {}), that is, quantifier-free sentences
            alternatives: ['every level-0 formula under every environment - the 0.2.x statement, equivalent to EX.FULL because Var 0 has level 0 and denotes any proposition (finding F5)']
            why: Krämer's α is a sentence. With the 0.2.x statement his own escape route did not escape (kramer_not_blocked_v021 in isabelle/Audit_Checks.thy). With this one, Krämer's package with EX.PRED in place of the unrestricted principle has the model MG (isabelle/Restricted_Models.thy).
          - point: full versus partial
            chosen: full ground, as in EX.FULL
            alternatives: ['a restricted version of EX.PART']
            why: uniformity with EX.FULL. Krämer's "<" is partial (his fn. 4), so the entry is stronger than his restricted (EG-S).
      - id: EX.LEV
        rank: 2
        name: Level-restricted existential grounding
        statement: |
          lvl a < lvl (Ex x b) ∧ fv a = {} ∧ T (app (lam x b v) (den w a))
            ⟶ G {app (lam x b v) (den w a)} (ex (lam x b v))      (* D3, D5; adm (lam x b v) *)
        sources:
          - work: kramer2013
            locator: section "Can we give reasons to reject (X)"
            check: manuscript
            quote: "a less restrictive option is to introduce a hierarchy of sentential quantifiers"
        readings:
          - point: encoding of the hierarchy
            chosen: one unindexed ∃; the level of the quantified formula bounds the level of the instance
            alternatives: ['indexed quantifiers ex_n ranging over level < n']
            why: keeps one signature for all packages. The bound needs the function to be presented by a formula, so EX.LEV is silent on functions that are not lam-terms (possible under C3s). CORRECTED 0.3.0 (D5) - this note said that by the chain convention EX.LEV includes EX.PRED. It does not. EX.LEV implies EX.PRED exactly when every admissible function is a lam-term (EX_LEV_PRED; so under C1, C2, C3d); under C3s a package that wants both selects both.
          - point: which instances (D5)
            chosen: closed formulas a (fv a = {}) of level below that of the quantified formula
            alternatives: ['every formula of lower level under every environment - the 0.2.x statement, which gave EX.FULL for every lam-term (finding F5)']
            why: as for EX.PRED.
          - point: FLAGGED 0.3.0 (audit) - parameters of the quantified function
            chosen: unrestricted. The body b may have free variables other than x, and the environment v may assign them propositions of any level
            alternatives: ['require fv b ⊆ {x}', 'bound the level of the parameters']
            why: left open by D5 (see its choices). The level of Ex x b is read off the syntax of b, so a parameter can carry a proposition of high level into a function that counts as low. INFERENCE - under C1 this makes no difference, the four witnesses having no parameters. Also INFERENCE - under C1 the four bodies have level 0, so EX.LEV and EX.PRED apply to the same instances unless an admissible function has a second presentation with a body of higher level.
      - id: EX.FULL
        rank: 3
        name: Existential grounding (unrestricted)
        statement: |
          T (app f a) ⟶ G {app f a} (ex f)
        sources:
          - work: kramer2013
            locator: section "Re (iii)"
            check: manuscript
            quote: "From ϕ(α), infer ϕ(α) < ∃p ϕ(p)."
          - work: woods2018
            locator: p. 634
            check: published-page
            quote: "true propositions whose dominant logical component is an existential quantifier are grounded in their true instances."
          - work: fine2010
            locator: p. 101, Existential Grounding
            check: published-page
            quote: "A(y), E(y)/A(y) ≺∃x A(x)"
            note: Fine's ≺ is partial ground ("helps ground", p. 99) and the rule carries an existence premise E(y), trivial here. Fine's principle is weaker than EX.FULL; with TRANS.P and IRR.F it suffices for his arguments. Fine 2010 p. 108 proposes the weaker EX.WEAK.
          - work: lovett2020
            locator: p. 2544, rule ∃-I
            check: published-page
            quote: "A < ∃vA[t/v]"
            note: Lovett's < is strict full ground and the rule is non-factive (no premise); the factive version is not stated for ∃-I. Read from the page image (the rule is typeset as an image).
          - work: fine2012a
            locator: p. 59 (CUP), rule ∃I
            check: published-page
            quote: "∃I. B(a) < ∃xB(x)"
            note: ADDED 0.3.0 (audit). Read from the page image. Strict full ground; the direct source for the full reading.
        readings:
          - point: full versus partial
            chosen: each true instance is a full ground
            alternatives: ['partial - now the separate entry EX.PART']
            why: CORRECTED 0.3.0 (audit) - this note said Krämer uses the instance as a complete ground. His "<" is partial (his fn. 4), and so is Fine 2010's ≺; their principle is EX.PART. The full reading is Fine 2012a's ∃I (p. 59) and Lovett's ∃-I (p. 2544). Woods's "<" was not re-classified.
          - point: first-order quantification over propositions (Fine) versus quantification into sentence position (Krämer)
            chosen: collapsed into ex over pfun
            alternatives: ['a separate first-order domain of propositions with a "proposition" predicate']
            why: base-type design. Consequence flagged in signature notes - (PE) cannot fail.

      - id: EX.WEAK
        rank: 0
        name: Weak existential grounding (some instance grounds)
        added: 0.1.2-draft, pending review
        statement: |
          T (ex f) ⟶ (∃a. PG (app f a) (ex f))
        sources:
          - work: fine2010
            locator: p. 108, Weak Existential Grounding
            check: published-page
            quote: "Any existential truth is grounded by an instance."
          - work: fritz2022
            locator: p. 325
            check: published-page
            quote: "∃pφ → ∃p(φ  ≺  ∃pφ)"
            note: Fritz says this weakening "may well restore consistency" but leaves the theory of quantified grounds "excessively weak".
        readings:
          - point: place in the family
            chosen: rank 0, below EX.FULL
            alternatives: ['a separate family']
            why: EX.WEAK is implied by EX.FULL and by EX.PART under CL.QUANT (EX_FULL_WEAK, EX_PART_WEAK). INFERENCE - it is incomparable with EX.PRED and EX.LEV, so the EX family is not a chain. Fine p. 108 says the Particular Arguments then fail.
      - id: EX.PART
        rank: 0
        name: Existential grounding (partial, unrestricted)
        added: 0.3.0-draft (D5); reviewed 2026-11-27 (see D5 `reviewed`)
        statement: |
          T (app f a) ⟶ PG (app f a) (ex f)      (* adm f *)
        sources:
          - work: fine2010
            locator: p. 101, Existential Grounding
            check: published-page
            quote: "A(y), E(y)/A(y) ≺∃x A(x)"
            note: partial ground; the existence premise E(y) is trivial here (signature notes).
          - work: kramer2013
            locator: section "Re (iii)"
            check: manuscript
            quote: "From ϕ(α), infer ϕ(α) < ∃p ϕ(p)."
            note: (EG-S). Krämer's "<" is partial ground (his fn. 4).
        readings:
          - point: place in the family
            chosen: implied by EX.FULL (EX_FULL_PART); implies EX.WEAK under CL.QUANT (EX_PART_WEAK)
            alternatives: ['state the puzzles with EX.FULL only (0.2.x)']
            why: it is the premise Krämer's and Fine's arguments use. EX.PRED and EX.LEV do not imply it - the model MG satisfies both and refutes it, since Krämer's package with EX.PART is refuted (kramer_package). EX.PART implies neither of them - the model MH satisfies it and fails both (MH_package, isabelle/Separation_Models.thy; an inference until 0.3.0).

