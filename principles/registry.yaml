      PG (ex f_id) (ex f_id), against IRR.F.
    checked_against_source: '0.8.0 - re-read in full from the Glasgow eprint (accepted manuscript, no journal pagination; sources/Kramer-2013-A-simpler-puzzle-of-ground-Thought-eprint.pdf). The package and derivation match (1)-(2) - (1) "∃p p" is "a theorem of any standard logic with sentential quantification", its being "a true instance of itself" uses the null context of (EG-S), and fn. 4 says the claims "are standardly taken to hold for both partial and complete grounding", so EX.FULL is supported as well as EX.PART. The registry writes "<" for his "≺".'
    note: CORRECTED 0.3.0 (audit) - the derivation said CL.PROP gives the truth, while the package lists no CL.PROP. Krämer's own premise is that ∃p p is a theorem of logic; here the truth comes from CL.QUANT (reading flagged on CL.QUANT). His "<" is partial ground, hence EX.PART.
