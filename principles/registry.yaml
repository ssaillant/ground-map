# Ground Map: principle registry
# Single source of truth for the consistency map. Results are tied to
# registry_version. DRAFT for review. Version 0.3.0-draft applies the repairs
# of the audit of 2026-11-27 (decision D5; docs/audit-2026-11-27.md). Version
# 0.3.1-draft changes no statement: it records results on the questions the
# repair left open (findings F7, F8; section `implications`). Version
# 0.3.2-draft adds the family WIT (decision D9; finding F9). Version 0.5.0-draft
# records decisions D7 (certificate kinds) and D8 (N4 needs CL.PROP). Reviewer
# decisions are recorded in the section `decisions`; choices made while
# applying a decision are listed under `choices_made_in_applying_it`.

