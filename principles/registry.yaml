  - id: P.FRITZ.CANTOR
    source: fritz2022 pp. 306–307 (sect. 2.3, arbitrary conjunction); main result sect. 2.4 pp. 308–310
    package: [C3s, CL.PROP, CL.QUANT, IMM.CONJ]
    control_package: [C3s, CL.PROP, CL.QUANT, CONJ.GRAIN]
    expected: refuted, without irreflexivity
    caveat: reproduces the arbitrary-conjunction variant (S⋀)+(⋀T) of §2.3, with grain derived from IMM.CONJ (D1). Fritz's main result (§2.4, seven principles of immediate ground, (∧1)–(∀2) and (nt), pp. 304–305) needs further IMM entries.
  - id: P.FRITZ.MAIN
    source: fritz2022 §2.4, pp. 308–310
    package: [C3s, CL.PROP, CL.QUANT, IMM.FRITZ7]
    expected: refuted (Fritz), without irreflexivity
    note: FLAGGED 0.3.0 (audit) - the refutation uses the core clause FACT. Fritz does not list factivity among the seven principles (see the reading on IMM.FRITZ7).
  - id: P.WOODS.CHECK
    source: woods2018 (Krämer's package with substantive irreflexivity, which Woods states as no package and gives no model for)
    package: [C1, BETA.ID, CL.QUANT, EX.FULL, IRR.W, TRANS.P]
    expected: unknown; Woods neither claims nor argues consistency, so a model would be a result about his proposal, not a confirmation of a claim of his
    corrected: 2026-11-28, after re-reading woods2018 pp. 631-641. The earlier text read "Woods proposes, 'not prove', p. 639" as a remark about consistency. It is not. The passage ("Note, 'propose', not 'prove'", p. 639) qualifies his verdict that the plausible reflexive cases are vacuous; he adds that he does not show there are no other counterexamples to irreflexivity (p. 639) and gives no conclusive arguments (p. 632).
    package_attribution: 'Assembled by the registry, not taken from Woods. EX.FULL is his Existential Grounding, kept "in full generality" (p. 636). IRR.W is his substantive irreflexivity (p. 641), with the one-world approximation of his modal vacuity test (fn. 27, p. 640). TRANS.P - he calls ground a strict partial order (p. 632), weakening asymmetry to antisymmetry (fn. 4), and uses transitivity in Objections 2 and 6. BETA.ID is not his - fn. 6 (p. 633) sets lambda-abstraction aside. It is in the package because the encoding needs it to pose Krämer''s case: the instance of the existential "something is true" at p must be p itself (app f_id p = p).'
    status: finite-model at N5 (checked); one-world vacuity test
    theorem: MW_package (isabelle/Woods_Models.thy), with MW_N3 and MW_N4s for the levels
    model: >-
      MW, registry 0.7.0-draft. Ten propositions (a truth value with one of five ranks);
      existential propositions have the top rank, and a true proposition of top rank is
      fully grounded by every truth on its own. The only reflexive grounding fact is
      that the one true existential proposition grounds itself, which is vacuous in the
      sense of vacW because every truth grounds it. CL.PROP, TS.FULL and ASYM.ANTI hold
      as well; IRR.F and ASYM.P fail (MW_reflexive). The infinite model MV1 satisfies the
      same target together with the introduction entries for the connectives, the
      universal quantifier and the truth predicate.
    limits: >-
      The result is about the registry's package and its one-world reading of vacuity
      (D2). Woods's test quantifies over worlds (fn. 27, p. 640), so the model does not
      show that his own principle is satisfied. In MW all true existential propositions
      are one proposition, and every truth grounds it, not only its instances.
  - id: P.KORBMACHER.APF
    source: korbmacher2018b p. 199 (APF, "we can perform an analogous derivation, which is left to the interested reader"); reconstruction
    package: [W.TR, BETA.ID, CL.PROP, CL.QUANT, TS.FULL, TR.NEG, NEG.ALL, TRANS.P, IRR.F]
    expected: refuted
    theorem: korbmacher_apf_W (isabelle/Puzzle_Packages.thy)
    status: refuted (checked)
    derivation: |
      s = all f_tr ("everything is true") is untrue, since neg q is untrue for a truth q and
      so tr (neg q) is untrue (TS.FULL). By TR.NEG, PG (neg s) (neg (tr s)). neg (tr s) is the
      negation of a false instance of s, so PG (neg (tr s)) (neg s) by NEG.ALL. TRANS.P gives
      PG (neg s) (neg s), against IRR.F.
    note: >-
      FLAGGED (added 0.8.0, D10, finding F21) - a reconstruction. Korbmacher states APF
      (p. 199, "∀x(Tr(¬x) → ¬x ◁ ¬Tr(ẋ))") and leaves the derivation to the reader; the
      choice of "not everything is true" as the falsity analogue of "something is true",
      and the package, are this project's. TS.FULL is used once, to make tr (neg q) untrue;
      FACT is not used. The package tests whether F9's strategy extends to the falsity
      clause. It does not as stated - TR.NEG is untyped, and the registry has no typed
      falsity entry (the v1.1 candidate TR.NEG.TYPED), so whether a typed TR.NEG with
      TS.FULL escapes the argument is open.
    witness: f_tr
  - id: P.KORBMACHER.2018B.TYPED
    source: korbmacher2018b pp. 204-207 (Defs. 1-2 and T3) and p. 223 (two levels suffice); a transcription of PGA_2 into the registry's one truth operator
    package: [W.TR, W.TEM, BETA.ID, CL.PROP, CL.QUANT, TS.TYPED, TS.T3, TR.TYPED, TR.PART.A, EX.FULL, ALL.INST, DISJ.ONE, NEG.DN, CONJ.BIN, TRANS.P, IRR.F, ASYM.P]
    expected: modelled; Korbmacher proves the consistency of PGA_<ε0 (Cor. 3, p. 213), but his theory is first-order, with partial ground only, so his result does not cover this package
    theorem: MK_package, with MK_N3 and MK_N4s (isabelle/Korbmacher_Typed.thy)
    status: modelled (checked, infinite-model at N5)
    note: >-
      Added 0.8.0 (D10, finding F22). Correspondence, a reading choice - the registry's T is
      truth at some level (Korbmacher's union of the S_β), tr is Tr_1, truth-free formulas
      are L_0. Under it TS.TYPED is the level-1 T-scheme on L_0 (Lemma 3 with β = γ = 1,
      p. 210, see the caveat on TS.TYPED), TS.T3 is T3^1 (p. 204), and TR.TYPED is APU_T^1
      (p. 207). The full-ground entries EX.FULL, ALL.INST, DISJ.ONE, NEG.DN and CONJ.BIN
      stand in for his upward partial-ground axioms (p. 205); full ground implies partial.
      What the package cannot express - the Aristotelian principle at levels above 1 (APU^γ,
      γ ≥ 2), which needs an indexed tr, and the downward axioms. In MK "something is true"
      is not grounded in its own truth ascription, which is untrue (MK_blocks), as
      Korbmacher says of his theory (p. 224). TS.T3 contradicts TS.FULL (TS_T3_not_FULL),
      so this package and F9's packages cannot be combined. CHANGED (D11) - TR.PART.A
      added, since APU_T^1 has the antecedent Tr_1(x) (p. 207); MK satisfies it for every
      proposition (MK_TR_A).
  - id: P.DONALDSON.SP
    source: donaldson_arith appendix pp. 25-26 (draft pagination), the "puzzle of property grounding"; propositional transcription
    package: [W.EM, BETA.GROUND, CL.PROP, CL.QUANT, ALL.PART, DISJ.PART, TRANS.P, IRR.F]
    expected: refuted
    theorem: donaldson_sp_W (isabelle/Puzzle_Packages.thy)
    status: refuted (checked)
    derivation: |
      s = all f_em. Every instance app f_em b is fully grounded in disj b (neg b), which is
      true by CL.PROP (BETA.GROUND), so every instance is true (FACT) and s is true
      (CL.QUANT). PG (app f_em s) s by ALL.PART; PG (disj s (neg s)) (app f_em s) by
      BETA.GROUND; PG s (disj s (neg s)) by DISJ.PART. TRANS.P gives PG s s, against IRR.F.
    note: >-
      Added 0.8.0 (D11, finding F24). FLAGGED - a reconstruction. Donaldson's case is
      second-order - the fact ⟨λx : ∀X(Xx ∨ ¬Xx)⟩a is grounded in ∀X(Xa ∨ ¬Xa) by his λ
      rule ("If ⟨λx: φ(x)⟩t, then [⟨λx : φ(x)⟩t]←[φ(t)]", p. 25), which is grounded in its
      instance ⟨λx : ∀X (Xx ∨ ¬Xx)⟩a ∨ ¬⟨λx : ∀X (Xx ∨ ¬Xx)⟩a, which is grounded in
      ⟨λx : ∀X (Xx ∨ ¬Xx)⟩a (p. 26). The registry has no quantification over properties of
      individuals, so the λ step is placed at the instance of the propositional
      quantifier. What carries over - with predication grounding (BETA.GROUND) the
      universal argument closes without a truth predicate, so typing TR (F9) is no
      escape, and the package differs from P.FINE.UNIVERSAL.SP only in BETA.GROUND for
      BETA.ID (the two exclude each other, BETA_excl). Donaldson's own response, levels of
      properties (pp. 26-27), corresponds to restricting comprehension (no W.EM).
    witness: f_em
  irr_w_tests:
    # Requested by the reviewer 2026-11-28. Each package is a registry target with
    # IRR.W in place of IRR.F, or Woods's own case. `status` follows the three
    # statuses of the project; every model is reported with its level. All models
    # are in isabelle/Woods_Models.thy and use the one-world vacuity test (D2).
    packages_as_of: >-
      The tested packages are the targets as of registry 0.6.0-draft, which include TS.FULL.
      Registry 0.8.0-draft removed TS.FULL from P.FINE.PARTICULAR, P.FINE.UNIVERSAL and
      P.FINE.PARTICULAR.PROPS (finding F20). The models here satisfy TS.FULL, so they also
      model the reduced targets with IRR.W in place of IRR.F; the refuted controls are
      refutations of the packages with TS.FULL, and whether they hold without it is not
      shown here.
    source_reading: >-
      woods2018 pp. 640-645, re-read 2026-11-28 from the open-access PDF by an extraction
      that gives page numbers but only short verbatim fragments; everything else here
      is paraphrase. Definition of vacuous occurrence, p. 640 ("A proposition A occurs
      vacuously in a grounding fact", substitution in the grounds only, at any world
      where the modified grounds are true). SUBSTANTIVE IRREFLEXIVITY, p. 641.
      PARTIAL SUBSTANTIVE IRREFLEXIVITY, p. 644. Objection 3 and reply, pp. 643-644 -
      the existential of p ∨ A helps ground itself and "occurs vacuously in ∃p(p ∨ A) <
      ∃p(p ∨ A)" because every B grounds it. Objection 5 and reply, p. 645 - the
      universal case with a totality fact among the grounds; substituting B for one of
      the grounds must also be done inside the totality fact ("uniformly"), and the
      modified grounds then ground the universal truth whenever they are true; fn. 37
      says the solution assumes the totality fact is among the grounds. VERIFIED
      2026-11-28 against page images of p. 645 with fnn. 36-38 supplied by the reviewer,
      with these additions to the paraphrase - the grounds displayed are TOTALITY, A0,
      A1, ... "where the Ans are all the facts" and TOTALITY is the totality fact
      testifying to this (so the list is of all the facts, not of the instances of
      p ∨ ¬p); the question asked is whether the modified grounds could all be true
      without grounding the universal truth; the substitution is made in TOTALITY "on
      reasonable treatments" of it, and in the other members of the list; the conclusion
      that the modified grounds ground the universal truth where they are true is
      introduced by "Presumably" and not argued; fn. 37 adds that the assumption can be
      avoided with the notion of grounding* facts of an unpublished manuscript (his
      [33]), which is not available to the project; fn. 38 defers the truth-teller.
