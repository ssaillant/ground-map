  - id: TR
    name: Grounding of truth ascriptions (Aristotelian principle)
    order: chain
    entries:
      - id: TR.TYPED
        rank: 1
        name: Typed Aristotelian principle
        statement: |
          tfree a ∧ fv a = {} ∧ T (den v a) ⟶ G {den v a} (tr (den v a))      (* D3, D5: closed formulas *)
        sources:
          - work: korbmacher2018b
            locator: Def. 2, APU_T^γ
            check: manuscript
            quote: "∀x(Tr_γ(x) → x ◁ Tr_γ(ẋ))"
        readings:
          - point: hierarchy depth
            chosen: two levels, as for TS.TYPED
            alternatives: []
            why: see TS.TYPED.
          - point: which formulas the principle covers (D5)
            chosen: closed truth-free formulas (fv a = {})
            alternatives: ['every truth-free formula under every environment - the 0.2.x statement, equivalent to TR.FULL (finding F5)']
            why: as for TS.TYPED. Separated from TR.FULL by the model MG.
          - point: FLAGGED 0.3.0 (audit) - full versus partial
            chosen: full ground {p}
            alternatives: ['partial, as in Korbmacher, whose ◁ is partial ground']
            why: uniformity with TR.FULL. The entry is stronger than its only source.
      - id: TR.FULL
        rank: 2
        name: Aristotelian principle
        statement: |
          T p ⟶ G {p} (tr p)
        sources:
          - work: kramer2013
            locator: section on the Finean counterpart
            check: manuscript
            quote: "If <p> is true then p < <p> is true"
            note: Krämer's (A), "often associated with Aristotle". His "<" is partial ground (his fn. 4), so strictly a source for TR.PART (0.3.0).
          - work: lovett2020
            locator: p. 2544, rule T-I
            check: published-page
            quote: "A < T⟨A⟩"
            note: ADDED 0.3.0 (audit). Read from the page image. Lovett's < is strict full ground and the rule has no premise (non-factive); the direct source for the full reading.
        readings:
          - point: antecedent T p versus T (tr p)
            chosen: T p (with TS the two coincide)
            alternatives: ['T (tr p)']
            why: makes TR independent of TS for the map.
          - point: FLAGGED 0.3.0 (audit) - full versus partial
            chosen: full ground {p}
            alternatives: ['partial - now the separate entry TR.PART']
            why: Lovett's T-I is a full-ground rule. Krämer's (A) and Fine's Propositional Grounding (fine2010 p. 101) are partial; the puzzles need only the partial rule and are now stated with TR.PART.
      - id: TR.NEG
        rank: 3
        name: Aristotelian principle with the falsity clause
        statement: |
          T (neg p) ⟶ G {neg p} (neg (tr p))
        sources:
          - work: korbmacher2018b
            locator: Def. 2, APU_F^γ
            check: manuscript
            quote: "∀x(Tr_γ(¬x) → ¬x ◁ ¬Tr_γ(ẋ))"
        readings:
          - point: typed versus untyped
            chosen: untyped
            alternatives: ['typed falsity clause, as in the source']
            why: the typed falsity clause is a v1.1 candidate. CORRECTED 0.3.0 (D5) - this note said the clause is "added on top of TR.FULL". TR.NEG is standalone and does not include TR.FULL; a package that wants the full Aristotelian principle selects both.
          - point: FLAGGED 0.3.0 (audit) - full versus partial
            chosen: full ground {neg p}
            alternatives: ['partial, as in Korbmacher, whose ◁ is partial ground']
            why: uniformity with TR.FULL. The entry is stronger than its source in this respect and weaker in being untyped.
      - id: TR.PART
        rank: 0
        name: Propositional grounding (partial)
        added: 0.3.0-draft (D5); reviewed 2026-11-27 (see D5 `reviewed`)
        statement: |
          T p ⟶ PG p (tr p)
        sources:
          - work: fine2010
            locator: p. 101, Propositional Grounding
            check: published-page
            quote: "T ( p), p = |A|/A ≺ T ( p)"
            note: Fine's ≺ is partial ground (p. 99). His premise is T(p), not A.
          - work: kramer2013
            locator: section on the Finean counterpart
            check: manuscript
            quote: "If <p> is true then p < <p> is true"
            note: Krämer's (A). His "<" is partial ground (his fn. 4).
        readings:
          - point: antecedent
            chosen: T p, as in TR.FULL
            alternatives: ['T (tr p), as in Fine and Krämer']
