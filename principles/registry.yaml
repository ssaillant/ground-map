# Ground Map: principle registry
# Single source of truth for the consistency map. Results are tied to
# registry_version. DRAFT for review. Version 0.3.0-draft applies the repairs
# of the audit of 2026-11-27 (decision D5; docs/audit-2026-11-27.md). Version
# 0.3.1-draft changes no statement: it records results on the questions the
# repair left open (findings F7, F8; section `implications`). Version
# 0.3.2-draft adds the family WIT (decision D9; finding F9). Version 0.5.0-draft
# records decisions D7 (certificate kinds) and D8 (N4 needs CL.PROP). Version
# 0.6.0-draft adds the strong Kleene entries (decision D6; findings F10-F13)
# and the section `proposed`. Version 0.7.0-draft changes no entry: it adds the
# tests of Woods's substantive irreflexivity against the Krämer and Fine
# targets (puzzles.irr_w_tests; findings F14-F19) and a proposed constraint,
# not adopted (proposed.GEN.RULES). Version 0.8.0-draft integrates Korbmacher
# 2018b (decision D10; findings F20-F23). Reviewer
# decisions are recorded in the section `decisions`; choices made while
# applying a decision are listed under `choices_made_in_applying_it`.

registry_version: 0.8.0-draft
date: 2026-11-28
status: draft-for-review
decisions:
  # Reviewer decisions, recorded with the version that implements them.
  - id: D1
    date: 2026-11-26
    decided_by: Said Saillant (reviewer), approving the recommendation in the decision note
    implemented_in: 0.2.0-draft
    question: how to encode Fritz's "only its conjuncts" without a primitive of immediate ground
    decision: option (d) - define immediate full ground IG from mediate full ground by Fritz's support proposal (fritz2022 p. 322), with the added clause that Γ itself fully grounds q (our reading); state Fritz's (⋀≺) for the partial notion IPG (new family IMM, entry IMM.CONJ). CONJ.GRAIN is kept as a control.
    checks: grain_from_conj_imm, fritz_cantor_imm, fritz_p315_imm in isabelle/Signature.thy
  - id: D2
    date: 2026-11-26
    decided_by: Said Saillant (reviewer), approving the recommendation in the decision note
    implemented_in: 0.2.0-draft
    question: what Woods's "occurs in the grounds" means
    decision: option (c) - uniform substitution on formulas, embedded occurrences included (woods2018 pp. 640–641, fn. 35 p. 644); one-world approximation of Woods's modal test (fn. 27), recorded on every IRR.W result. The draft membership reading is kept only as the control entry IRR.MEM.
    checks: kramer_vacuous in isabelle/Signature.thy (Krämer's self-ground of ∃p p is vacuous, as Woods p. 640 says)
  - id: D3
    date: 2026-11-26
    decided_by: Said Saillant (reviewer), approving the recommendation in the decision note
    implemented_in: 0.2.0-draft
    question: how to state level and truth-freeness restrictions over a base type
    decision: option (c) - a datatype of formulas with a denotation map into prop, used only by the restricted principles (EX.PRED, EX.LEV, TS.TYPED, TR.TYPED), comprehension, BETA and Woods's substitution. Propositions stay a base type and ground still relates sets of propositions. C3 splits into C3d (definable) and C3s (every function); new family BETA (BETA.ID, BETA.GROUND; neither = the rejection Goodman reports of Fritz).
    checks: kramer_v2 in isabelle/Signature.thy (Krämer's puzzle in the new encoding)
  - id: D4
    date: 2026-11-27
    decided_by: Said Saillant (reviewer), decision card
    implemented_in: 0.2.1-draft (recorded; applies from step 4)
    question: how step 4 classifies packages that have only infinite models (finding F1)
    decision: add a classification "infinite-model", certified by an infinite model constructed in Isabelle (for example a term model) and checked like any other result. Classes are now refuted, finite-model, infinite-model, unknown.
  - id: D5
    date: 2026-11-27
    decided_by: Said Saillant (reviewer), "Please repair all", in reply to the audit report docs/audit-2026-11-27.md
    implemented_in: 0.3.0-draft
    question: what to do about audit findings A1–A4 and the corrections the audit proposed and did not make
    decision: >-
      repair all of them. A1 - EX.PRED, EX.LEV, TS.TYPED and TR.TYPED quantify
      over closed formulas (fv a = {}); this replaces the D3 convention that a
      restriction applies to whatever some formula with the property denotes
      under some environment. A2 - every entry is standalone; the only
      implications are those proved in isabelle/Order.thy and listed in the
      section `implications`. A3 - the class "trivial-only" becomes "refuted
      at N1" and claims consistency only where a model with no grounding fact
      (level N0) has been found and re-verified. A4 - Fine's partial Universal
      Grounding gets an entry (ALL.PART), and the puzzle packages are stated
      with the partial principles the sources use. Citations and reading notes
      are corrected as the audit proposed.
    reviewed: >-
      2026-11-27, Said Saillant, after the repair report. His words - "The
      choices you made, nice. You see that it doesn't change, it's bound still,
      does not. Makes sense to me." INFERENCE (the assistant's reading) - this
      accepts the choices below, the remark on the bound referring to the first
      one (C2 unchanged). No choice was discussed singly; each can still be
      reverted on its own.
    choices_made_in_applying_it:
      # Made by the assistant while applying D5, not by the reviewer. Reviewed
      # 2026-11-27 (see `reviewed`).
      - C2 is left as it was. Its level bound binds the body, not the parameters (the environment), so it is predicative in the bound variable only. Flagged on C2. Closing the parameters as well would change which functions C2 admits and is left to the reviewer.
      - EX.LEV closes the instance formula a only. The body b of the quantified function keeps its parameters. Flagged on EX.LEV.
      - Besides ALL.PART (named in A4), three further partial entries were added, DISJ.PART, EX.PART and TR.PART, because Fine's 2010 rules for disjunction, existence and truth are partial as well and the puzzle packages are now stated with them.
      - The ALL family is no longer a set of alternatives. ALL.INST and ALL.TOT each imply ALL.PART, and the search does not treat them as mutually exclusive (it never did).
      - P.FINE.UNIVERSAL.SP now lists CL.PROP. The checked proof uses it. SETTLED 0.3.1 - the package without it is consistent (model MS, finding F7), so the premise was missing from the 0.2.x listing and adding it was required.
      - Puzzle targets are stated with the weakest entries the checked proofs use. The 0.2.x packages follow from them by the implications in Order.thy.
    checks: isabelle/Restricted_Models.thy (MG_package), isabelle/Puzzle_Packages.thy, isabelle/Order.thy; isabelle/Audit_Checks.thy keeps the proofs that the 0.2.x definitions collapsed
  - id: D7
    date: 2026-11-27
    decided_by: Said Saillant (reviewer), in thread "Resolve the 12 unknown principles" ("Let's go with option A")
    implemented_in: 0.5.0-draft
    question: how to treat models that scripts/verify_models.py cannot re-check (formula layer, infinite carriers)
    decision: >-
      option (a). A model proved in Isabelle counts as a certificate on the
      strength of Isabelle's proof kernel, and every model record carries a
      field certificate - "nitpick+python" for a Nitpick model re-checked by
      scripts/verify_models.py, "isabelle-kernel" for a model built and proved
      in Isabelle. The classes finite-model and infinite-model are the same
      for both kinds. The Python re-check exists because Nitpick's output is
      not proof-checked; it cannot re-check formula-layer models because
      Nitpick interprets only finitely many formulas. A re-proof in a second
      proof assistant (Lean) is reserved for results reported as new.
    checks: results/isabelle_models.jsonl (field certificate); docs/results.md section 4
  - id: D8
    date: 2026-11-27
    decided_by: Said Saillant (reviewer), same message ("then we should fix that")
    implemented_in: 0.5.0-draft
    question: whether N4 counts in models where truth is not classical (for example every proposition true)
    decision: >-
      N4 counts only in models that satisfy CL.PROP. Its pairs are meant to be
      classically equivalent; where CL.PROP fails (all-true models, the term
      model ME) a distinct pair with different grounds does not show grain
      among equivalent propositions. Because the levels are cumulative, such
      a model is reported at N3 at most, with N4_pairs and N5_chain noted
      separately when proved.
    checks: N4_pairs in isabelle/Principles.thy; levels in results/isabelle_models.jsonl
  - id: D9
    date: 2026-11-28
    decided_by: Said Saillant (reviewer), decision card, option "Add four witness entries"
    implemented_in: 0.3.2-draft
    question: whether to add comprehension entries weaker than C1, one per witness, so that the map can say what one puzzle needs beyond another (finding F8)
    decision: >-
      add four entries, each asserting that one named witness is admissible.
      C1 stays and implies them. The puzzles are restated with them.
    numbering: D9 because PR #5 records D7 and D8 and skips D6. INFERENCE - D6 is left for PR #3, whose own decision is numbered D5 on its branch and collides with D5 here.
    choices_made_in_applying_it:
      # Made by the assistant while applying D9, not by the reviewer.
      - The entries form a family of their own, WIT, and are not added to COMP. A COMP entry fixes adm exactly and a package takes at most one; a witness entry is a lower bound and any number can be combined, with one another and with a COMP entry.
      - The entries are W.ID, W.TR, W.EM and W.TEM, one per C1 witness. No entry denies admissibility. That a witness is not admissible is a fact about a model (MT, MU), not a principle one can select.
      - Each puzzle target lists its witness entry in place of C1. The packages with C1 are still refuted, by the implication from C1.
      - The automatic search was not rerun for packages with witness entries. They mention lam, so Nitpick's models for them are not genuine; the new classifications rest on theorems and on the models MT and MU.
    checks: isabelle/Principles.thy (W_ID, W_TR, W_EM, W_TEM), isabelle/Order.thy (C1_W, C2_W, C3d_W, C3s_W), isabelle/Puzzle_Packages.thy (theorems named *_W), isabelle/Separation_Models.thy (MT_W, MU_package)
  - id: D6
    date: 2026-11-27
    decided_by: Said Saillant (reviewer), decision card ("Strong Kleene only")
    implemented_in: 0.6.0-draft
    question: which proposed non-classical entries enter the search
    decision: SK.PROP, SK.QUANT (new family SK) and TS.KF (TS chain, rank 3, below TS.ID) enter the enumeration; SR.LIAR, SR.FINE15, DIAG.K, DISJ.GRD, FOUND.ATOM and the WP conditions stay in section `proposed` until their flagged readings are reviewed.
    checks: cl_sk, ts_kf_full, ts_id_kf in isabelle/NonClassical.thy (used by driver.py for propagation); K1_package (finding F11)
  - id: D10
    date: 2026-11-28
    decided_by: Said Saillant (reviewer), project thread ("lets do 1-4 and revisit 5 afterwards")
    implemented_in: 0.8.0-draft
    question: what to take into the registry from Korbmacher 2018b (report notes/korbmacher-2018b-report.md, now docs/korbmacher-2018b.md)
    decision: (1) restate F9's novelty and limits with the comparison to Korbmacher's typed theory; (2) add Korbmacher's T3 as an entry (TS.T3) and a consistency target transcribing his solution at two levels (P.KORBMACHER.2018B.TYPED); (3) add an entry for grounding negated universals (NEG.ALL) and the falsity version of his puzzle (P.KORBMACHER.APF); (4) drop TS.FULL from the three truth targets once Isabelle confirms it is not needed. Item 5 of the report - recording the apparent inconsistency between his Lemma 3 and his axiom APD_F - is deferred ("revisit 5 afterwards").
    choices_made_in_applying_it:
      - TS.T3 is placed in the TS family with rank `standalone`, since it contradicts TS.FULL (TS_T3_not_FULL) and so cannot sit in the chain.
      - NEG.ALL is a full-ground entry, like NEG.DM; Korbmacher's U9 is partial and Fine's ¬∀I has an existence premise, both flagged on the entry.
      - The consistency target lists NEG.DN and CONJ.BIN as well, because Korbmacher's theory has them (U1, U3) and MT and MU did not check any negation or conjunction entry.
      - Both new entries are added to driver.py's ENTRIES (TS.T3 also to LAMB); the search was not rerun.
      - The three truth targets keep their ids; their packages lose TS.FULL and cite the new theorems. The old theorems with TS.FULL remain and still hold.
      - The consistency target lists ASYM.P, which Korbmacher does not state but which follows from his G1 and G2 (p. 205).
      - The novelty fields of the MT and MU records in results/isabelle_models.jsonl are restated to match F9 and F23; their certificates are unchanged.
  - id: D11
    date: 2026-11-28
    decided_by: Said Saillant (reviewer), project thread ("I would add target P, Donaldson, SP. Add the sources form of the Aristotelian principle as an entry, yes.")
    implemented_in: 0.8.0-draft
    question: proposals 1 and 2 of the addendum to docs/korbmacher-2018b.md, after reading Krämer 2013, Donaldson (draft) and Litland 2015
    decision: (1) add the target P.DONALDSON.SP, a propositional transcription of Donaldson's puzzle of property grounding; (2) add the Aristotelian principle with the sources' antecedent as an entry (TR.PART.A). Proposal 3, Skiles (ms.), is with the reviewer.
    choices_made_in_applying_it:
      - TR.PART.A is partial, like Fine's, Krämer's and Korbmacher's principles, and standalone in the TR family - it neither implies nor is implied by TR.PART; under TS.FULL the two are equivalent (TR_PART_A_TS_FULL).
      - The three truth targets keep TR.PART; each gains a field source_form_variant recording the package with TR.PART.A (refuted with TS.FULL, theorems *_A; modelled without it, MK_truth_targets_source_form).
      - TR.PART.A is added to P.KORBMACHER.2018B.TYPED, since Korbmacher's APU_T^1 has the antecedent Tr_1(x) (p. 207); MK satisfies it for every proposition, so the model and its record are extended rather than replaced.
      - P.DONALDSON.SP uses BETA.GROUND as the registry's predication-grounding rule; the circle goes through the instance app f_em s rather than through a λ-abstract applied to an individual, which the signature lacks. FLAGGED as a reconstruction.
      - TR.PART.A is added to driver.py ENTRIES (not LAMB); the search was not rerun.
