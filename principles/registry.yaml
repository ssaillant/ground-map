# sit in the lattice, and whether the readings flagged below stand.
proposed:
  version: 0.6.0-draft
  status: SK and TS.KF adopted (D6); the rest pending review (Said); requested 2026-11-27 ("yes" to the coordinator's proposal to start the non-classical families). GEN added 2026-11-28 with finding F19, pending review.
  families:
    - id: GEN
      name: Grounds are generated by the rules (closure constraint)
      status: proposed 2026-11-28 (finding F19); NOT adopted; not in scripts/driver.py; realised only in the model MR (isabelle/Rule_Generated.thy)
      order: single entry
      entries:
        - id: GEN.RULES
          name: Only rule-generated grounds
          statement: |
            G is the least relation closed under the selected introduction and
            structural entries: for every relation R on sets of propositions and
            propositions, if R satisfies each selected entry (read with R in place
            of G), then G Γ q implies R Γ q.
          sources: []
          readings:
            - point: status of the constraint
              chosen: registry construction, not attributed to any author
              why: FLAGGED - Fine's and Krämer's principles are stated as sufficient conditions for ground. That they give the only grounds is a further claim. It is the reading on which a puzzle "from these rules" is a puzzle about what the rules generate; no page is cited for it.
            - point: form of the entry
              chosen: relative to the package - which entries count as rules depends on the package selected
              alternatives: ['a fixed list of rules (as in MR - the nine full-strength introduction entries, TRANS.CUT, AMALG.INF)', 'an elimination entry per connective and quantifier (every ground of a disjunction contains or is generated from a true disjunct, and so on), which is first-order in G but must be stated for each form of proposition']
              why: FLAGGED - the statement quantifies over relations, which HOL allows but a finite model search does not handle; and it has content only where propositions are fine-grained enough for the rules to tell them apart. In a model that identifies the propositions on a circle the least relation can satisfy IRR.W.
            - point: what it needs before it can enter the enumeration
              chosen: not decided
              why: the driver selects entries independently of one another; an entry whose statement depends on the other selected entries needs a change to scripts/driver.py and to the Isabelle statement generator. Reviewer's decision.
    - id: SR
      name: Self-reference witnesses (comprehension for propositions)
      order: alternatives
      entries:
        - id: SR.LIAR
          name: A liar proposition (identity version)
          statement: |
            ∃l. l = neg (tr l)
          sources:
            - work: fine2010
              locator: p. 114
              check: published-page
              quote: "Universal Middle will fail for familiar reasons (when instanced with the Liar, for example)."
            - work: korbmacher2015
              locator: slide 7
              check: published-page
              quote: "we get a liar sentence λ such that: ⊢PA λ ↔ ¬Tr(pλq)"
              note: slides, not the Kriterion paper; "published-page" here means the slide number.
          readings:
            - point: identity versus material liar
              chosen: identity (l = neg (tr l))
              alternatives: ['material: T l ⟷ T (neg (tr l))']
              why: >-
                propositions are a base type; a diagonal lemma gives only a material biconditional
                in arithmetic, but with structured propositions the natural witness is an identity.
                FLAGGED. Checked - with CL.PROP + TS.FULL refuted (liar_classical); with SK.PROP +
                TS.KF it forces a gap (liar_gap). K1 has no liar (K1_no_liar), so SR.LIAR is not
                modelled.
        - id: SR.FINE15
          name: Fine's self-including disjunction
          statement: |
            ∃c t. T t ∧ c = disj t (tr c)
          sources:
            - work: fine2010
              locator: fn. 15, p. 117
              check: published-page
              quote: "An especially clear case in which the stronger form of Disjunctive Grounding fails is with the sentence (∀x(x = x) ∨ T (c)), where c denotes the very sentence"
          readings:
            - point: ∀x(x = x)
              chosen: any truth t
              alternatives: ['a logical truth']
              why: the argument uses only that t is true. Checked - SR.FINE15 + SK.PROP + TS.FULL + DISJ.ONE + TR.FULL + TRANS.P + IRR.F is refuted (fine_fn15), without bivalence.
        - id: DIAG.K
          name: Korbmacher's diagonal proposition
          statement: |
            ∃d. d ∉ range atom ∧ (T d ⟷ ¬ PG d (disj d d))
          sources:
            - work: korbmacher2015
              locator: slide 8
              check: published-page
              quote: "Let ϕ(x) be the formula ¬(x C x∨. x). By the diagonal lemma, there is a sentence δ"
          readings:
            - point: material and non-atomic
              chosen: material biconditional, d not an atom
              alternatives: ['without the non-atomic clause (used only with FOUND)']
              why: >-
                the slide's diagonal sentence is material over PA. Non-atomicity is my addition, needed
                only for korbmacher_found: Korbmacher's δ is a complex arithmetic sentence, not a
                fundamental one. FLAGGED.
    - id: DISJ
      note: proposed additions to the existing family DISJ
      entries:
        - id: DISJ.GRD
          rank: standalone
          name: Disjunction grounding restricted to grounded disjuncts
          statement: |
            (∃x. PG x p) ⟶ G {p} (disj p q)
            (∃x. PG x q) ⟶ G {q} (disj p q)
          sources:
            - work: korbmacher2015
              locator: slide 12
              check: published-page
              quote: "Intuitively, the principles of partial ground should only apply if the truths involved are themselves grounded."
            - work: korbmacher2015
              locator: Kriterion paper p. 6
              check: published-page
              quote: "(∨∗1 ): Θ ⊢ ∃x(x ⊲ ⌜ϕ⌝) ↔ ⌜ϕ⌝ ⊲ ⌜ϕ ∨ ψ⌝"
              note: the paper states a biconditional; DISJ.GRD is its left-to-right half, the only half his Observation (pp. 6-7) uses ("We only need the left-to-right direction").
          readings:
            - point: partial versus full
              chosen: full ground {p}, as DISJ.ONE
              alternatives: ['PG p (disj p q)']
              why: matches DISJ.ONE; Korbmacher's predicate is partial ground, and full {p} implies it. FLAGGED - grounded atoms are excluded, so atomic truths do not ground disjunctions under this entry.
    - id: FOUND
      name: Foundation (every truth is fundamental or partially grounded)
      order: chain
      entries:
        - id: FOUND.ATOM
          rank: 1
          statement: |
            T p ⟶ p ∈ range atom ∨ (∃x. PG x p)
          sources:
            - work: korbmacher2015
              locator: slide 3
              check: published-page
              quote: "∀x(Tr (x) ↔ Fund(x) ∨ ∃y (y C x))"
            - work: korbmacher2015
              locator: Kriterion paper p. 1
              check: published-page
              quote: "Take, for example, the intuitively plausible claim that every truth is either fundamental or grounded in some other truths."
            - work: korbmacher2018a
              locator: p. 164
              check: published-page
              quote: "we could plausibly define this predicate F und by postulating that: ∀x(F und(x) ↔def T r(x) ∧ ¬∃y(y ≺ x))."
          readings:
            - point: status in the source
              chosen: taken as a principle (left-to-right half)
              alternatives: ['an example of expressive power only']
              why: >-
                Korbmacher calls the claim "intuitively plausible" (2015 p. 1; 2018a p. 164) as an
                illustration of what a ground predicate can express; he does not adopt it as an axiom.
            - point: Fund
              chosen: atomic propositions (an independently given class)
              alternatives: ["Korbmacher 2018a's definition, Fund(x) iff Tr(x) and x has no partial ground"]
              why: >-
                FLAGGED, decisive for F13 - under Korbmacher's own definition (2018a p. 164) the principle
                is trivially true and korbmacher_found does not apply; F13 needs Fund to be fixed
                independently of ground (here, atomicity). Checked - FACT + DISJ.GRD + FOUND.ATOM +
                DIAG.K is refuted (korbmacher_found). Kriterion fn. 5 (p. 7) states the unexceptioned
                version himself - with FACT, "Θ ⊢ ϕ → ∃x(x ⊲ ⌜ϕ⌝)" for every sentence is inconsistent,
                "details ... to the interested reader".
    - id: WP
      name: Wilhelm's identity conditions and Poggiolesi's repair (formula level)
      note: >-
        Not stated over prp. These are conditions on formulas with immediate partial ground and
        ground-theoretic identity as relations (isabelle/Poggiolesi_Checks.thy, deep embedding);
        a prp version of Wilhelm's derivation is wilhelm_prp. Proposed as a puzzle target and a
        checked consistency claim (puzzles.candidates P.WILHELM.2021, P.POGGIOLESI.2022), not as
        lattice families, because the identity relation would need an encoding decision (D6).
      entries:
        - id: W.1-8
          statement: "conditions (1)-(8) of poggiolesi2022 p. 2 (W1-W8)"
          sources:
            - work: poggiolesi2022
              locator: p. 2
              check: published-page
              quote: "(1) A ⊲ (B ∧ C) if, and only if, (B ∧ C) and A ≈ B or A ≈ C,"
              note: pages are the article's own (1-6, online version); LLP 32(1) 2023 pp. 33-38 per the journal page, not checked against the issue PDF.
        - id: P.2'4'7'8'
          statement: "(2'), (4'), (7'), (8') with the star operation, poggiolesi2022 p. 3 (P2, P4, P7, P8)"
          sources:
            - work: poggiolesi2022
              locator: p. 3
              check: published-page
              quote: "(7′ ) A ∧ B ≈ (A∗ ∨ B ∗ )∗ ,"
          readings:
            - point: Leibniz's law (p. 4)
              chosen: identity is an equivalence and a congruence for ∧, ∨, double negation and star (not single negation); ground and truth respect it (LEIBNIZ)
              alternatives: ['full congruence including single negation', "substitution only into the (¬)²ⁿ/star reformulation, as a syntactic operation"]
              why: FLAGGED - her p. 4 says only that Leibniz's law applies "to the reformulation of formulas in terms of pairs of negations (¬)2n and ∗"; my congruence reading is one way to make that precise.
            - point: her ≐ (p. 4)
              chosen: left as a parameter E, assumed only to contain ≅
              alternatives: ['a specific closure construction']
              why: '"the closure of ≅ under conditions (7′) and (8′)" is not defined further; the counterexample needs only E ⊇ ≅.'
            - point: her ≅ (p. 4)
              chosen: literal - "B is the formula A itself or it is A*"
              alternatives: ['≅ meant to apply only inside the star reformulation, never relating A to a formula of opposite truth value']
              why: FLAGGED - the counterexample in finding F10 depends on this literal reading (A* has the opposite truth value of A).

