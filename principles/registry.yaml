        statement: |
          app (lam x a v) p = den (v(x:=p)) a
        sources:
          - work: goodman2023
            locator: sect. 1, PDF p. 4 (online-first version; the PDF carries no journal page numbers)
            check: published-page
            quote: "Fritz argues that there could be a principled basis for rejecting both β-conversion and (9)"
            note: CORRECTED 2026-11-27 (audit) - locator and check updated from the PDF supplied by the reviewer.
          - work: fritz2020
            locator: sect. 4, final draft p. 4, (βC)
            check: manuscript
            quote: "(βC) φ[ψ/p] = (λpφ)ψ"
