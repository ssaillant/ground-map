name: search
# Step 4 enumeration. Long runs go here (project decision, 2026-11-27).
# Push a branch named search/<anything>, or start it by hand with chosen seeds.
# At the end the results are committed and a pull request against main is opened with the
# secret RESULTS_PR_TOKEN (scripts/publish_results.sh says which base and which branch).
# The token is checked first: a search without a working token does not start.
on:
  push:
    branches: ['search/**']
  workflow_dispatch:
    inputs:
      seeds:
        description: 'JSON list of grow seeds (targets mode: one job per element, the list is only counted)'
        default: '[11, 12, 13, 14]'
      targets:
        description: 'Targets mode: path of a package list (results/targets/<name>.json). Empty = grow.'
        default: ''
      token_check_only:
        description: 'Only check RESULTS_PR_TOKEN (no search, no pull request)'
        type: boolean
        default: false
permissions:
  contents: write
jobs:
  token:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Check RESULTS_PR_TOKEN (missing, expired, or without the needed access)
        env:
          RESULTS_PR_TOKEN: ${{ secrets.RESULTS_PR_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_ID: ${{ github.run_id }}
        run: scripts/publish_results.sh check-token
  grow:
    needs: token
    if: ${{ github.event.inputs.token_check_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(github.event.inputs.seeds || '[11, 12, 13, 14]') }}
    env:
      ISABELLE_URL: https://dists.isabelle.cit.tum.de/dist/Isabelle2026_linux.tar.gz?token=Isabelle
      ISABELLE_SHA256: 858c995b32216b3876bf395c3be843147d1f1eee404bc6c958d7534ee335e48d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Isabelle2026_linux.tar.gz
          key: isabelle-${{ env.ISABELLE_SHA256 }}
      - name: Install pinned Isabelle
        run: |
          [ -f Isabelle2026_linux.tar.gz ] || curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' -o Isabelle2026_linux.tar.gz "$ISABELLE_URL"
          echo "$ISABELLE_SHA256  Isabelle2026_linux.tar.gz" | sha256sum -c -
          tar xzf Isabelle2026_linux.tar.gz -C "$RUNNER_TEMP"
          echo "ISABELLE=$RUNNER_TEMP/Isabelle2026/bin/isabelle" >> "$GITHUB_ENV"
      - name: Build heap
        run: '"$ISABELLE" build -b -o threads=4 -D isabelle'
      - name: Grow (seed ${{ matrix.seed }}), or query a fixed list of targets
        env:
          TARGETS: ${{ github.event.inputs.targets }}
        run: |
          export GM_WORK="$RUNNER_TEMP/gm"
          cp results/queries.jsonl results/queries.base.jsonl 2>/dev/null || true
          if [ -n "$TARGETS" ]; then
            case "$TARGETS" in results/targets/*.json) ;; *) echo "targets must be results/targets/<name>.json"; exit 1;; esac
            timeout 300m python3 scripts/driver.py targets "$TARGETS" ${{ strategy.job-index }} ${{ strategy.job-total }} || echo "stopped (timeout or error): partial results kept"
          else
            timeout 300m python3 scripts/driver.py grow ${{ matrix.seed }} || echo "stopped (timeout or error): partial results kept"
          fi
          mkdir -p out && cp results/queries.jsonl out/queries.jsonl && cp results/grow.jsonl out/grow.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: results-seed-${{ matrix.seed }}
          path: out/
  merge:
    needs: [token, grow]
    if: ${{ always() && needs.token.result == 'success' && github.event.inputs.token_check_only != 'true' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    env:
      RESULTS_PR_TOKEN: ${{ secrets.RESULTS_PR_TOKEN }}
      REPO: ${{ github.repository }}
      RUN_ID: ${{ github.run_id }}
      RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
      RUN_SHA: ${{ github.sha }}
      REF_NAME: ${{ github.ref_name }}
      REF_TYPE: ${{ github.ref_type }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/download-artifact@v4
        with:
          path: parts
          pattern: results-seed-*
      - name: Merge results, re-verify models, regenerate docs/results.md, commit
        run: scripts/publish_results.sh prepare parts
      - name: Keep the merged results as an artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: results-merged
          path: |
            results/
            docs/results.md
      - name: Push the results and open the pull request (RESULTS_PR_TOKEN)
        # A cancelled run keeps its results in the artifacts but opens no pull request.
        if: ${{ !cancelled() }}
        run: scripts/publish_results.sh publish
