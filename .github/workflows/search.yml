name: search
# Step 4 enumeration. Long runs go here (project decision, 2026-11-27).
# Push a branch named search/<anything>, or start it by hand with chosen seeds.
on:
  push:
    branches: ['search/**']
  workflow_dispatch:
    inputs:
      seeds:
        description: 'JSON list of grow seeds'
        default: '[11, 12, 13, 14]'
permissions:
  contents: write
jobs:
  grow:
    runs-on: ubuntu-24.04
    timeout-minutes: 340
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(github.event.inputs.seeds || '[11, 12, 13, 14]') }}
    env:
      ISABELLE_URL: https://dists.isabelle.cit.tum.de/dist/Isabelle2026_linux.tar.gz?token=Isabelle
      ISABELLE_SHA256: 858c995b32216b3876bf395c3be843147d1f1eee404bc6c958d7534ee335e48d
    steps:
      - uses: actions/checkout@v4
      - uses: actions/cache@v4
        with:
          path: Isabelle2026_linux.tar.gz
          key: isabelle-${{ env.ISABELLE_SHA256 }}
      - name: Install pinned Isabelle
        run: |
          [ -f Isabelle2026_linux.tar.gz ] || curl -fsSL --retry 3 --proto '=https' --proto-redir '=https' -o Isabelle2026_linux.tar.gz "$ISABELLE_URL"
          echo "$ISABELLE_SHA256  Isabelle2026_linux.tar.gz" | sha256sum -c -
          tar xzf Isabelle2026_linux.tar.gz -C "$RUNNER_TEMP"
          echo "ISABELLE=$RUNNER_TEMP/Isabelle2026/bin/isabelle" >> "$GITHUB_ENV"
      - name: Build heap
        run: '"$ISABELLE" build -b -o threads=4 -D isabelle'
      - name: Grow (seed ${{ matrix.seed }})
        run: |
          export GM_WORK="$RUNNER_TEMP/gm"
          cp results/queries.jsonl results/queries.base.jsonl 2>/dev/null || true
          timeout 300m python3 scripts/driver.py grow ${{ matrix.seed }} || echo "stopped (timeout or error): partial results kept"
          mkdir -p out && cp results/queries.jsonl out/queries.jsonl && cp results/grow.jsonl out/grow.jsonl 2>/dev/null || true
      - uses: actions/upload-artifact@v4
        with:
          name: results-seed-${{ matrix.seed }}
          path: out/
  merge:
    needs: grow
    if: always()
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: parts
      - name: Merge results and re-verify models
        run: |
          python3 scripts/merge_results.py parts
          python3 scripts/verify_models.py
      - name: Commit results to this branch
        run: |
          git config user.name "ground-map search"
          git config user.email "actions@users.noreply.github.com"
          git add results/
          git commit -m "search: results of run ${{ github.run_id }}" || echo "nothing new"
          git push
